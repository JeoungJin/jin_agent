<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="760" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">PII 가 밖으로 나가는 4지점</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">외부로 나가거나 남는 곳마다 한 겹씩 마스킹한다 (한 곳만 막지 않는다)</text>
<rect x="40" y="88" width="1040" height="44" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
<text x="60" y="116" text-anchor="start" font-size="13" fill="#475569" font-weight="bold">입력 예)</text>
<text x="130" y="116" text-anchor="start" font-size="14" fill="#0f172a">제 계좌 110-123-456789 로 이체 가능한가요? 주민번호는 900101-1234567 입니다.</text>
<rect x="30" y="170" width="130" height="84" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
<text x="95.0" y="204" text-anchor="middle" font-size="17" fill="#0284c7" font-weight="bold">사용자</text>
<text x="95.0" y="228" text-anchor="middle" font-size="12" fill="#475569">브라우저</text>
<rect x="200" y="170" width="130" height="84" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
<text x="265.0" y="204" text-anchor="middle" font-size="17" fill="#0284c7" font-weight="bold">React</text>
<text x="265.0" y="228" text-anchor="middle" font-size="12" fill="#475569">5173</text>
<rect x="370" y="170" width="160" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<text x="450.0" y="204" text-anchor="middle" font-size="17" fill="#16a34a" font-weight="bold">Spring</text>
<text x="450.0" y="228" text-anchor="middle" font-size="12" fill="#475569">8000 · 대화 기록 보관</text>
<rect x="570" y="170" width="160" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
<text x="650.0" y="204" text-anchor="middle" font-size="17" fill="#7c3aed" font-weight="bold">FastAPI</text>
<text x="650.0" y="228" text-anchor="middle" font-size="12" fill="#475569">9000 · LLM 호출</text>
<rect x="850" y="170" width="240" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
<text x="970.0" y="204" text-anchor="middle" font-size="17" fill="#dc2626" font-weight="bold">OpenAI</text>
<text x="970.0" y="228" text-anchor="middle" font-size="12" fill="#475569">외부 서비스 (제3자)</text>
<line x1="160" y1="212" x2="200" y2="212" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="330" y1="212" x2="370" y2="212" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="530" y1="212" x2="570" y2="212" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="730" y1="194" x2="850" y2="194" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<line x1="850" y1="230" x2="730" y2="230" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<circle cx="790" cy="194" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="790" y="199" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">①</text>
<circle cx="790" cy="230" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="790" y="235" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">③</text>
<rect x="570" y="330" width="160" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="650" y="352" text-anchor="middle" font-size="14" fill="#c2410c" font-weight="bold">도구 (Tool)</text>
<text x="650" y="372" text-anchor="middle" font-size="11" fill="#475569">계좌 API · 시세</text>
<line x1="650" y1="330" x2="650" y2="254" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<circle cx="650" cy="292" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="650" y="297" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">②</text>
<rect x="370" y="330" width="160" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="450" y="352" text-anchor="middle" font-size="14" fill="#c2410c" font-weight="bold">대화 기록 · 로그</text>
<text x="450" y="372" text-anchor="middle" font-size="11" fill="#475569">서버에 오래 남음</text>
<line x1="450" y1="254" x2="450" y2="330" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<circle cx="450" cy="292" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="450" y="297" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">④</text>
<text x="960" y="300" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">붉은 화살표 = PII 가 지나가는 길</text>
<text x="960" y="320" text-anchor="middle" font-size="12" fill="#475569">각 지점에서 마스킹한다</text>
<rect x="40" y="420" width="250" height="230" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<rect x="40" y="420" width="250" height="36" rx="10" fill="#dc2626"/><rect x="40" y="444" width="250" height="12" fill="#dc2626"/><text x="165.0" y="445" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">① 입력</text>
<text x="165" y="474" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">LLM 호출 직전</text>
<text x="56" y="504" text-anchor="start" font-size="13" fill="#334155">대상: 질문 + 이전 대화(history)</text>
<text x="56" y="530" text-anchor="start" font-size="13" fill="#334155" font-family="Consolas,'DejaVu Sans Mono',monospace">계좌 110-123-456789</text>
<text x="56" y="556" text-anchor="start" font-size="13" fill="#334155" font-family="Consolas,'DejaVu Sans Mono',monospace">→ ***-***-**6789</text>
<text x="56" y="582" text-anchor="start" font-size="13" fill="#334155">외부로 나가는 마지막 문</text>
<rect x="310" y="420" width="250" height="230" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
<rect x="310" y="420" width="250" height="36" rx="10" fill="#ea580c"/><rect x="310" y="444" width="250" height="12" fill="#ea580c"/><text x="435.0" y="445" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">② 도구 결과</text>
<text x="435" y="474" text-anchor="middle" font-size="13" fill="#ea580c" font-weight="bold">LLM 에 넘기기 전</text>
<text x="326" y="504" text-anchor="start" font-size="13" fill="#334155">대상: 도구가 돌려준 문자열</text>
<text x="326" y="530" text-anchor="start" font-size="13" fill="#334155">필요한 값만 전달</text>
<text x="326" y="556" text-anchor="start" font-size="13" fill="#334155">잔액 숫자 O</text>
<text x="326" y="582" text-anchor="start" font-size="13" fill="#334155">계좌번호 전체 X</text>
<rect x="580" y="420" width="250" height="230" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<rect x="580" y="420" width="250" height="36" rx="10" fill="#7c3aed"/><rect x="580" y="444" width="250" height="12" fill="#7c3aed"/><text x="705.0" y="445" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">③ 출력</text>
<text x="705" y="474" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="bold">응답을 내보내기 직전</text>
<text x="596" y="504" text-anchor="start" font-size="13" fill="#334155">대상: LLM 이 만든 답변</text>
<text x="596" y="530" text-anchor="start" font-size="13" fill="#334155">AI 가 PII 를 되풀이하거나</text>
<text x="596" y="556" text-anchor="start" font-size="13" fill="#334155">지어낼 수 있다</text>
<text x="596" y="582" text-anchor="start" font-size="13" fill="#334155">스트리밍은 조각 경계 주의</text>
<rect x="850" y="420" width="250" height="230" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<rect x="850" y="420" width="250" height="36" rx="10" fill="#0f766e"/><rect x="850" y="444" width="250" height="12" fill="#0f766e"/><text x="975.0" y="445" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">④ 저장 · 로그</text>
<text x="975" y="474" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">기록하기 직전</text>
<text x="866" y="504" text-anchor="start" font-size="13" fill="#334155">대상: 대화 기록, 서버 로그</text>
<text x="866" y="530" text-anchor="start" font-size="13" fill="#334155">로그는 오래, 널리 남는다</text>
<text x="866" y="556" text-anchor="start" font-size="13" fill="#334155">원문 대신 마스킹본 저장</text>
<text x="866" y="582" text-anchor="start" font-size="13" fill="#334155">로그엔 유형별 건수만</text>
<rect x="40" y="676" width="1040" height="56" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="560" y="700" text-anchor="middle" font-size="14" fill="#713f12" font-weight="bold">원칙 1  필요 없는 개인정보는 보내지 않는다 (데이터 최소화)</text>
<text x="560" y="722" text-anchor="middle" font-size="13" fill="#713f12">원칙 2  나가는 곳마다 한 겹씩 막는다 (다층 방어) — 한 곳이 뚫려도 끝나지 않게</text>
</svg>
