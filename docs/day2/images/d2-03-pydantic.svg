<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="560" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Pydantic 스키마: 요청의 모양을 검사한다</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">schema = 주고받는 데이터의 계약</text>
<rect x="30" y="100" width="270" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="165" y="128" text-anchor="middle" font-size="14" fill="#075985" font-weight="bold">클라이언트 요청 본문</text>
<text x="165" y="160" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">{&quot;question&quot;: &quot;삼성전자 주가&quot;}</text>
<text x="165" y="186" text-anchor="middle" font-size="11" fill="#64748b">JSON 문자열</text>
<rect x="365" y="100" width="270" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="500" y="126" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">Pydantic 모델</text>
<text x="500" y="152" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">QuestionRequest</text>
<text x="500" y="174" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">question: str (필수)</text>
<text x="500" y="194" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">min_length=1</text>
<rect x="700" y="100" width="270" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="835" y="121" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">통과 → service 호출</text>
<text x="835" y="140" text-anchor="middle" font-size="11" fill="#64748b">router 가 service 로 넘긴다</text>
<rect x="700" y="160" width="270" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="835" y="181" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">실패 → 422 자동 응답</text>
<text x="835" y="200" text-anchor="middle" font-size="11" fill="#64748b" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">{&quot;detail&quot;: [ ... ]}</text>
<line x1="300" y1="155" x2="365" y2="155" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="635" y1="135" x2="700" y2="125" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<line x1="635" y1="175" x2="700" y2="185" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<text x="30" y="254" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">예시: 같은 모델로 이런 요청을 검사한다</text>
<rect x="30" y="266" width="940" height="34" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="48" y="288" text-anchor="start" font-size="13" fill="#ffffff" font-weight="bold">요청 본문</text>
<text x="470" y="288" text-anchor="start" font-size="13" fill="#ffffff" font-weight="bold">결과</text>
<text x="590" y="288" text-anchor="start" font-size="13" fill="#ffffff" font-weight="bold">이유</text>
<rect x="30" y="306" width="940" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="48" y="332" text-anchor="start" font-size="13" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">{&quot;question&quot;: &quot;삼성전자 주가&quot;}</text>
<rect x="470" y="313" width="64" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="502" y="331" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">통과</text>
<text x="590" y="332" text-anchor="start" font-size="13" fill="#0f172a">올바른 형식</text>
<rect x="30" y="352" width="940" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="48" y="378" text-anchor="start" font-size="13" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">{}</text>
<rect x="470" y="359" width="64" height="26" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="502" y="377" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">422</text>
<text x="590" y="378" text-anchor="start" font-size="13" fill="#0f172a">question 필드가 없다</text>
<rect x="30" y="398" width="940" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="48" y="424" text-anchor="start" font-size="13" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">{&quot;question&quot;: &quot;&quot;}</text>
<rect x="470" y="405" width="64" height="26" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="502" y="423" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">422</text>
<text x="590" y="424" text-anchor="start" font-size="13" fill="#0f172a">빈 문자열 (min_length=1)</text>
<rect x="30" y="458" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="485" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">같은 모델이 Swagger 문서(/docs)도 자동으로 만든다</text>
<text x="500.0" y="508" text-anchor="middle" font-size="12" fill="#fbbf24">스키마를 꼼꼼히 쓸수록 문서가 좋아진다 — 코드가 곧 문서</text>
</svg>
