<rect x="670" y="462" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="820" y="486" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">③ FastAPI → Spring</text>
<text x="820" y="508" text-anchor="middle" font-size="11.5" fill="#475569" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">GET /internal/api/accounts/…/balance</text>
<rect x="30" y="548" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="575" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">오늘은 React 없이 curl · Swagger 로 확인합니다 — 화면 연결은 Day 3</text>
