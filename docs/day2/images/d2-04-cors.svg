<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="640" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">CORS: 브라우저가 다른 출처를 막는 규칙</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">출처(Origin) = 프로토콜 + 도메인 + 포트</text>
<rect x="60" y="92" width="300" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="210" y="120" text-anchor="middle" font-size="15" fill="#075985" font-weight="bold">React 화면</text>
<text x="210" y="146" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">http://localhost:5173</text>
<rect x="640" y="92" width="300" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="790" y="120" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">FastAPI</text>
<text x="790" y="146" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">http://localhost:9000</text>
<line x1="360" y1="129" x2="640" y2="129" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<text x="500" y="119" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">포트가 달라서 &#x27;다른 출처&#x27;</text>
<rect x="30" y="190" width="450" height="236" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
<text x="255" y="218" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">CORS 설정이 없을 때</text>
<rect x="45" y="236" width="420" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="58" y="258" text-anchor="start" font-size="13" fill="#991b1b" font-weight="bold">① 요청</text>
<text x="58" y="278" text-anchor="start" font-size="12" fill="#0f172a">React 페이지가 FastAPI를 호출 (JSON POST는 먼저 OPTIONS 사전 확인)</text>
<rect x="45" y="298" width="420" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="58" y="320" text-anchor="start" font-size="13" fill="#991b1b" font-weight="bold">② 응답</text>
<text x="58" y="340" text-anchor="start" font-size="12" fill="#0f172a">Access-Control-Allow-Origin 헤더가 없다</text>
<rect x="45" y="360" width="420" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="58" y="382" text-anchor="start" font-size="13" fill="#991b1b" font-weight="bold">③ 결과</text>
<text x="58" y="402" text-anchor="start" font-size="12" fill="#0f172a">브라우저가 차단 → 콘솔에 CORS 오류</text>
<rect x="520" y="190" width="450" height="236" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<text x="745" y="218" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">CORS 설정이 있을 때</text>
<rect x="535" y="236" width="420" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="548" y="258" text-anchor="start" font-size="13" fill="#166534" font-weight="bold">① 서버 설정</text>
<text x="548" y="278" text-anchor="start" font-size="12" fill="#0f172a">허용 출처 목록: 5173(React), 8000(Spring)</text>
<rect x="535" y="298" width="420" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="548" y="320" text-anchor="start" font-size="13" fill="#166534" font-weight="bold">② 응답</text>
<text x="548" y="340" text-anchor="start" font-size="12" fill="#0f172a">Access-Control-Allow-Origin: http://localhost:5173</text>
<rect x="535" y="360" width="420" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="548" y="382" text-anchor="start" font-size="13" fill="#166534" font-weight="bold">③ 결과</text>
<text x="548" y="402" text-anchor="start" font-size="12" fill="#0f172a">브라우저가 허용 → 화면에서 응답을 사용</text>
<rect x="30" y="446" width="450" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="255" y="474" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">curl · Swagger(/docs)는 영향 없음</text>
<text x="255" y="498" text-anchor="middle" font-size="12" fill="#0f172a">curl은 브라우저가 아니고, /docs는 같은 출처(9000)</text>
<text x="255" y="516" text-anchor="middle" font-size="12" fill="#0f172a">에서 호출하기 때문</text>
<rect x="520" y="446" width="450" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="745" y="474" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">Spring → FastAPI 호출도 대상 아님</text>
<text x="745" y="498" text-anchor="middle" font-size="12" fill="#0f172a">서버끼리의 호출이라 브라우저 규칙이 적용되지 않는다</text>
<text x="745" y="516" text-anchor="middle" font-size="12" fill="#64748b">(허용 목록에 있어도 영향 없음)</text>
<rect x="30" y="552" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="579" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">CORS는 서버 보안이 아니라 &#x27;브라우저의 보호 규칙&#x27;</text>
<text x="500.0" y="602" text-anchor="middle" font-size="12" fill="#fbbf24">허용할 출처만 명시한다 — * 와일드카드는 쓰지 않는다 (쿠키 인증과 함께 쓸 수 없다)</text>
</svg>
