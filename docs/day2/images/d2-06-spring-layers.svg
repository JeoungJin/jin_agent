<text x="440" y="396" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">설정값</text>
<text x="590" y="396" text-anchor="start" font-size="12.5" fill="#166534" font-weight="bold">application.yml</text>
<text x="790" y="396" text-anchor="start" font-size="12.5" fill="#5b21b6" font-weight="bold">config.py · .env</text>
<rect x="420" y="436" width="550" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="695" y="459" text-anchor="middle" font-size="12.5" fill="#92400e" font-weight="bold">설정값(주소 · 타임아웃)은 application.yml — 코드에 하드코딩하지 않는다</text>
<rect x="30" y="498" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="525" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">Controller 는 받고, Service 는 호출하고, DTO 는 모양을 정한다</text>
<text x="500.0" y="548" text-anchor="middle" font-size="12" fill="#fbbf24">FastAPI 에서 배운 3계층 분리가 Spring 에서도 그대로 이어진다</text>
