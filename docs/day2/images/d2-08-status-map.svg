<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="665" viewBox="0 0 1000 665" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="665" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">HTTP 상태코드 지도</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">누가 만들고, Spring 은 어떻게 처리하는가</text>
<rect x="30" y="92" width="940" height="36" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="48" y="116" text-anchor="start" font-size="13" fill="#ffffff" font-weight="bold">코드</text>
<text x="160" y="116" text-anchor="start" font-size="13" fill="#ffffff" font-weight="bold">의미</text>
<text x="450" y="116" text-anchor="start" font-size="13" fill="#ffffff" font-weight="bold">만드는 곳</text>
<text x="590" y="116" text-anchor="start" font-size="13" fill="#ffffff" font-weight="bold">처리 방식</text>
<rect x="30" y="136" width="940" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="30" y="136" width="8" height="66" rx="4" fill="#d97706" stroke="#d97706" stroke-width="0"/>
<text x="48" y="178" text-anchor="start" font-size="22" fill="#92400e" font-weight="bold">400</text>
<text x="160" y="164" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold">요청이 잘못됨</text>
<text x="160" y="186" text-anchor="start" font-size="12" fill="#64748b">빈 질문 · null · JSON 형식 오류</text>
<text x="450" y="175" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">Spring (@Valid)</text>
<text x="590" y="175" text-anchor="start" font-size="12.5" fill="#0f172a">FastAPI 를 호출하지 않고 바로 차단  {status, message}</text>
<rect x="30" y="210" width="940" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="30" y="210" width="8" height="66" rx="4" fill="#d97706" stroke="#d97706" stroke-width="0"/>
<text x="48" y="252" text-anchor="start" font-size="22" fill="#92400e" font-weight="bold">401</text>
<text x="160" y="238" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold">인증 실패</text>
<text x="160" y="260" text-anchor="start" font-size="12" fill="#64748b">토큰 없음 · 만료 · 위조</text>
<text x="450" y="249" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">Spring 필터</text>
<text x="590" y="249" text-anchor="start" font-size="12.5" fill="#0f172a">Controller 까지 가지 않는다 → 다시 로그인</text>
<rect x="30" y="284" width="940" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="30" y="284" width="8" height="66" rx="4" fill="#d97706" stroke="#d97706" stroke-width="0"/>
<text x="48" y="326" text-anchor="start" font-size="22" fill="#92400e" font-weight="bold">403</text>
<text x="160" y="312" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold">권한 없음</text>
<text x="160" y="334" text-anchor="start" font-size="12" fill="#64748b">다른 사람의 계좌 조회</text>
<text x="450" y="323" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">Spring 내부 API</text>
<text x="590" y="323" text-anchor="start" font-size="12.5" fill="#0f172a">토큰의 사용자 ≠ userId → 안내 문구</text>
<rect x="30" y="358" width="940" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="30" y="358" width="8" height="66" rx="4" fill="#d97706" stroke="#d97706" stroke-width="0"/>
<text x="48" y="400" text-anchor="start" font-size="22" fill="#92400e" font-weight="bold">404</text>
<text x="160" y="386" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold">대상 없음</text>
<text x="160" y="408" text-anchor="start" font-size="12" fill="#64748b">없는 userId</text>
<text x="450" y="397" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">Spring 내부 API</text>
<text x="590" y="397" text-anchor="start" font-size="12.5" fill="#0f172a">&#x27;계좌를 찾을 수 없습니다&#x27; 안내</text>
<rect x="30" y="432" width="940" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="30" y="432" width="8" height="66" rx="4" fill="#d97706" stroke="#d97706" stroke-width="0"/>
<text x="48" y="474" text-anchor="start" font-size="22" fill="#92400e" font-weight="bold">422</text>
<text x="160" y="460" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold">스키마 위반</text>
<text x="160" y="482" text-anchor="start" font-size="12" fill="#64748b">FastAPI 의 Pydantic 검증 실패</text>
<text x="450" y="471" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">FastAPI</text>
<text x="590" y="471" text-anchor="start" font-size="12.5" fill="#0f172a">Fallback 하지 않고 같은 상태코드로 전달</text>
<rect x="30" y="506" width="940" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="30" y="506" width="8" height="66" rx="4" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<text x="48" y="548" text-anchor="start" font-size="22" fill="#991b1b" font-weight="bold">5xx</text>
<text x="160" y="534" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold">서버 쪽 문제</text>
<text x="160" y="556" text-anchor="start" font-size="12" fill="#64748b">오류 · 타임아웃 · 연결 거부</text>
<text x="450" y="545" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">FastAPI · 네트워크</text>
<text x="590" y="545" text-anchor="start" font-size="12.5" fill="#0f172a">Fallback: HTTP 200 + category &quot;FALLBACK&quot;</text>
<rect x="30" y="590" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="617" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">4xx 는 호출한 쪽의 잘못이라 숨기지 않고 알린다 — 5xx 만 대체 응답(Fallback)으로 감싼다</text>
<text x="500.0" y="640" text-anchor="middle" font-size="12" fill="#fbbf24">Fallback 응답은 &#x27;성공&#x27;이 아니라 &#x27;대체 응답&#x27;이므로 category 로 정상 응답과 구분한다</text>
</svg>
