<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="590" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Swagger 문서는 어떻게 자동으로 생길까?</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">코드(타입 힌트 + Pydantic) → OpenAPI 명세 → Swagger UI</text>

  <!-- 1 code -->
  <rect x="30" y="96" width="300" height="352" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="50" y="126" font-size="17" font-weight="bold" fill="#075985">① 우리가 작성한 코드</text>

  <g font-size="12.5">
    <rect x="46" y="142" width="268" height="52" rx="8" fill="#fff" stroke="#bae6fd"/>
    <text x="58" y="162" font-family="Consolas,monospace" fill="#0f172a">@app.post("/api/v1/chat")</text>
    <text x="58" y="182" font-size="12" fill="#0369a1">→ 경로 · HTTP 메서드</text>

    <rect x="46" y="202" width="268" height="52" rx="8" fill="#fff" stroke="#bae6fd"/>
    <text x="58" y="222" font-family="Consolas,monospace" fill="#0f172a">req: ChatRequest</text>
    <text x="58" y="242" font-size="12" fill="#0369a1">→ 요청 body 구조</text>

    <rect x="46" y="262" width="268" height="52" rx="8" fill="#fff" stroke="#bae6fd"/>
    <text x="58" y="282" font-family="Consolas,monospace" fill="#0f172a">response_model=ChatResponse</text>
    <text x="58" y="302" font-size="12" fill="#0369a1">→ 응답 JSON 구조</text>

    <rect x="46" y="322" width="268" height="52" rx="8" fill="#fff" stroke="#bae6fd"/>
    <text x="58" y="342" font-family="Consolas,monospace" fill="#0f172a">Field(min_length=1)</text>
    <text x="58" y="362" font-size="12" fill="#0369a1">→ 필수 여부 · 검증 규칙</text>

    <rect x="46" y="382" width="268" height="52" rx="8" fill="#fff" stroke="#bae6fd"/>
    <text x="58" y="402" font-family="Consolas,monospace" fill="#0f172a">Field(description="세션 ID")</text>
    <text x="58" y="422" font-size="12" fill="#0369a1">→ 필드 설명</text>
  </g>

  <line x1="330" y1="272" x2="390" y2="272" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 2 FastAPI -->
  <rect x="390" y="186" width="220" height="172" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">② FastAPI</text>
  <text x="500" y="248" text-anchor="middle" font-size="14" fill="#1e293b">타입 힌트 + Pydantic</text>
  <text x="500" y="270" text-anchor="middle" font-size="14" fill="#1e293b">모델을 읽어서</text>
  <rect x="412" y="288" width="176" height="46" rx="8" fill="#fff" stroke="#16a34a"/>
  <text x="500" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">OpenAPI 명세</text>
  <text x="500" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">자동 생성</text>

  <!-- validation branch -->
  <line x1="500" y1="358" x2="500" y2="394" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="390" y="394" width="220" height="82" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">같은 스키마로 요청 검증</text>
  <text x="500" y="446" text-anchor="middle" font-size="13" fill="#1e293b">형식이 틀리면</text>
  <text x="500" y="464" text-anchor="middle" font-size="13" fill="#1e293b">422 응답 (문서와 동작 일치)</text>

  <!-- 3 openapi.json -->
  <path d="M610,240 L640,240 L640,146 L670,146" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <rect x="670" y="96" width="300" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="820" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b21b6" font-family="Consolas,monospace">③ /openapi.json</text>
  <text x="820" y="154" text-anchor="middle" font-size="14" fill="#1e293b">원본 API 명세 (기계가 읽는 JSON)</text>
  <text x="820" y="176" text-anchor="middle" font-size="13" fill="#7c3aed">다른 도구(코드 생성기 등)도 활용 가능</text>

  <!-- 4 viewers -->
  <line x1="745" y1="196" x2="745" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="895" y1="196" x2="895" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="820" y="226" text-anchor="middle" font-size="12" fill="#64748b">화면으로 렌더링</text>
  <rect x="670" y="240" width="150" height="84" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="745" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e" font-family="Consolas,monospace">/docs</text>
  <text x="745" y="294" text-anchor="middle" font-size="14" fill="#1e293b">Swagger UI</text>
  <text x="745" y="312" text-anchor="middle" font-size="12" fill="#64748b">테스트용</text>
  <rect x="830" y="240" width="140" height="84" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="900" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e" font-family="Consolas,monospace">/redoc</text>
  <text x="900" y="294" text-anchor="middle" font-size="14" fill="#1e293b">ReDoc</text>
  <text x="900" y="312" text-anchor="middle" font-size="12" fill="#64748b">읽기용</text>

  <line x1="745" y1="324" x2="745" y2="356" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="670" y="356" width="300" height="76" rx="12" fill="#fff" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="820" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Try it out</text>
  <text x="820" y="410" text-anchor="middle" font-size="13" fill="#1e293b">브라우저에서 바로 API 호출·테스트</text>

  <!-- banner -->
  <rect x="30" y="502" width="940" height="56" rx="12" fill="#0f172a"/>
  <text x="500" y="537" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8fafc">코드가 곧 문서 — 스키마를 꼼꼼히 쓸수록 Swagger 문서가 좋아진다</text>
</svg>
