<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker></defs>
<rect width="1100" height="570" fill="#FFFFFF"/>
<text x="550" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">환각(Hallucination)이 생기는 과정</text>
<text x="550" y="68" text-anchor="middle" font-size="14" fill="#4B5563">학습 이후의 일은 모르지만, 모른다고 말하지 않는다</text>
<line x1="40" y1="82" x2="1060" y2="82" stroke="#1F3864" stroke-width="1.5"/>
<rect x="60" y="104" width="560" height="36" rx="6" fill="#E6ECF5" stroke="#1F3864" stroke-width="2"/>
<text x="340" y="128" text-anchor="middle" font-size="15" fill="#1F3864" font-weight="bold">학습한 글 (학습 시점까지)</text>
<rect x="620" y="104" width="420" height="36" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="830" y="128" text-anchor="middle" font-size="15" fill="#4B5563" font-weight="bold">학습 이후 — 모델은 모른다</text>
<text x="1040" y="162" text-anchor="end" font-size="14" fill="#111827" font-weight="bold">지금 ▶</text>
<rect x="60" y="200" width="330" height="60" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="225.0" y="235.625" text-anchor="middle" font-size="15" fill="#111827">&quot;삼성전자 현재 주가 알려줘&quot;</text>
<line x1="390" y1="230" x2="460" y2="230" stroke="#4B5563" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="460" y="190" width="180" height="80" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="550.0" y="237.5" text-anchor="middle" font-size="20" fill="#1F3864" font-weight="bold">LLM</text>
<line x1="640" y1="230" x2="710" y2="230" stroke="#4B5563" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="710" y="200" width="330" height="60" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="875.0" y="235.625" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">&quot;현재 주가는 71,000원입니다&quot;</text>
<text x="875" y="286" text-anchor="middle" font-size="13" fill="#4B5563">출처·기준 시각이 없다</text>
<text x="60" y="336" text-anchor="start" font-size="16" fill="#1F3864" font-weight="bold">환각이 생기는 이유</text>
<rect x="60" y="352" width="310" height="92" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="215.0" y="393.475" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">① 최신 정보가 없다</text>
<text x="215.0" y="415.225" text-anchor="middle" font-size="14" fill="#111827">학습 이후의 변화는 모른다</text>
<rect x="395" y="352" width="310" height="92" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="550.0" y="393.475" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">② 모른다고 하지 않는다</text>
<text x="550.0" y="415.225" text-anchor="middle" font-size="14" fill="#111827">그럴듯한 문장으로 이어 쓴다</text>
<rect x="730" y="352" width="310" height="92" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="885.0" y="393.475" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">③ 말투가 자신 있다</text>
<text x="885.0" y="415.225" text-anchor="middle" font-size="14" fill="#111827">틀려도 티가 나지 않는다</text>
<rect x="40" y="478" width="1020" height="58" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="550" y="512.0" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">막는 방법:  실시간·사실 정보는 Tool로 가져오고, 결과는 사람이 검증한다</text>
</svg>
