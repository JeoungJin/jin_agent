<rect x="570" y="124" width="490" height="18" rx="0" fill="#1F3864" stroke="#1F3864" stroke-width="0"/>
<text x="815" y="130" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="bold">Vibe Coding</text>
<rect x="620" y="156" width="340" height="32" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="790.0" y="177.25" text-anchor="middle" font-size="14" fill="#111827">AI에게 요청</text>
