<rect x="620" y="248" width="340" height="32" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="790.0" y="269.25" text-anchor="middle" font-size="14" fill="#111827">실행</text>
<line x1="790" y1="280" x2="790" y2="294" stroke="#4B5563" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="620" y="294" width="340" height="32" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="790.0" y="315.25" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">검증 (요구사항과 대조)</text>
<line x1="790" y1="326" x2="790" y2="340" stroke="#4B5563" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="620" y="340" width="340" height="32" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="790.0" y="361.25" text-anchor="middle" font-size="14" fill="#111827">수정 요청</text>
<polyline points="960,356 1000,356 1000,264 962,264" fill="none" stroke="#1F3864" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#b)"/>
<rect x="40" y="430" width="1020" height="54" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="550" y="462.0" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">차이는 &#x27;검증&#x27; — 결과를 그대로 믿지 않고, 실행해서 확인한 뒤 다시 요청한다</text>
