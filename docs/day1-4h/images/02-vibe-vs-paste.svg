<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker></defs>
<rect width="1100" height="520" fill="#FFFFFF"/>
<text x="550" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">복붙과 Vibe Coding의 차이</text>
<text x="550" y="68" text-anchor="middle" font-size="14" fill="#4B5563">같은 AI를 쓰지만 &#x27;검증&#x27;이 있느냐 없느냐가 다르다</text>
<line x1="40" y1="82" x2="1060" y2="82" stroke="#1F3864" stroke-width="1.5"/>
<rect x="40" y="104" width="490" height="300" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="40" y="104" width="490" height="38" rx="12" fill="#4B5563" stroke="#4B5563" stroke-width="0"/>
<rect x="40" y="124" width="490" height="18" rx="0" fill="#4B5563" stroke="#4B5563" stroke-width="0"/>
<text x="285" y="130" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="bold">복붙</text>
