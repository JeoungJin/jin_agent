<text x="285.0" y="187.625" text-anchor="middle" font-size="15" fill="#111827">AI에게 요청</text>
<line x1="285" y1="202" x2="285" y2="224" stroke="#4B5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="105" y="224" width="360" height="40" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="285.0" y="249.625" text-anchor="middle" font-size="15" fill="#111827">코드를 받는다</text>
<line x1="285" y1="264" x2="285" y2="286" stroke="#4B5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="105" y="286" width="360" height="40" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="285.0" y="311.625" text-anchor="middle" font-size="15" fill="#111827">그대로 사용한다</text>
<rect x="105" y="348" width="360" height="44" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="285.0" y="375.25" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">결과가 틀려도 알아채지 못한다</text>
<line x1="285" y1="322" x2="285" y2="348" stroke="#4B5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="570" y="104" width="490" height="300" rx="12" fill="#FFFFFF" stroke="#1F3864" stroke-width="2.2"/>
