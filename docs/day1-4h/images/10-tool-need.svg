<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker></defs>
<rect width="1100" height="540" fill="#FFFFFF"/>
<text x="550" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">왜 Tool이 필요한가</text>
<text x="550" y="68" text-anchor="middle" font-size="14" fill="#4B5563">현재 값이 필요한 질문은 LLM의 기억이 아니라 조회한 데이터로 답한다</text>
<line x1="40" y1="82" x2="1060" y2="82" stroke="#1F3864" stroke-width="1.5"/>
<rect x="40" y="100" width="490" height="336" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="40" y="100" width="490" height="36" rx="12" fill="#4B5563" stroke="#4B5563" stroke-width="0"/>
<rect x="40" y="120" width="490" height="16" rx="0" fill="#4B5563" stroke="#4B5563" stroke-width="0"/>
<text x="285" y="125" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">LLM만 사용</text>
<rect x="110" y="162" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="285.0" y="191.25" text-anchor="middle" font-size="14" fill="#111827">사용자: 삼성전자 현재 주가는?</text>
<line x1="285" y1="210" x2="285" y2="246" stroke="#4B5563" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="110" y="246" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="285.0" y="275.25" text-anchor="middle" font-size="14" fill="#111827">LLM이 학습한 기억으로 추측</text>
<line x1="285" y1="294" x2="285" y2="330" stroke="#4B5563" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="110" y="330" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="285.0" y="359.25" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">답변: 71,000원  (언제 값인지 모름)</text>
<text x="285" y="420" text-anchor="middle" font-size="13" fill="#4B5563">출처 · 기준 시각이 없다</text>
<rect x="570" y="100" width="490" height="336" rx="12" fill="#FFFFFF" stroke="#1F3864" stroke-width="2.2"/>
<rect x="570" y="100" width="490" height="36" rx="12" fill="#1F3864" stroke="#1F3864" stroke-width="0"/>
<rect x="570" y="120" width="490" height="16" rx="0" fill="#1F3864" stroke="#1F3864" stroke-width="0"/>
<text x="815" y="125" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">LLM + Tool</text>
<rect x="645" y="152" width="340" height="32" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="815.0" y="173.25" text-anchor="middle" font-size="14" fill="#111827">사용자: 삼성전자 현재 주가는?</text>
<line x1="815" y1="184" x2="815" y2="198" stroke="#4B5563" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="645" y="198" width="340" height="32" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="815.0" y="219.25" text-anchor="middle" font-size="14" fill="#111827">Agent: 현재 데이터가 필요하다고 판단</text>
<line x1="815" y1="230" x2="815" y2="244" stroke="#4B5563" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="645" y="244" width="340" height="32" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="815.0" y="265.25" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">Stock Tool 호출</text>
<line x1="815" y1="276" x2="815" y2="290" stroke="#4B5563" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="645" y="290" width="340" height="32" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="815.0" y="311.25" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">외부 금융 데이터 API 조회</text>
<line x1="815" y1="322" x2="815" y2="336" stroke="#4B5563" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="645" y="336" width="340" height="32" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="815.0" y="357.25" text-anchor="middle" font-size="14" fill="#111827">값 + 기준 시각을 돌려받는다</text>
<line x1="815" y1="368" x2="815" y2="382" stroke="#4B5563" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="645" y="382" width="340" height="32" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="815.0" y="403.25" text-anchor="middle" font-size="14" fill="#111827">답변: 값 · 출처 · 기준 시각 포함</text>
<rect x="40" y="458" width="1020" height="54" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="550" y="490.0" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">변하는 데이터는 Tool로 조회하고, 값에는 출처와 기준 시각을 함께 표시한다</text>
</svg>
