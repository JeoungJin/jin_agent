<text x="885.0" y="321.09999999999997" text-anchor="middle" font-size="14" fill="#111827">키워드 방식의</text>
<text x="885.0" y="341.4" text-anchor="middle" font-size="14" fill="#111827">route_question()</text>
<rect x="590" y="368" width="130" height="60" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="655.0" y="403.625" text-anchor="middle" font-size="15" fill="#1F3864" font-weight="bold">제약조건</text>
