<text x="815.0" y="501.09999999999997" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">좋은 예</text>
<text x="815.0" y="521.4" text-anchor="middle" font-size="14" fill="#111827">문제 · 기대 결과 · 현재 구조 · 제약조건을 함께 전달</text>
