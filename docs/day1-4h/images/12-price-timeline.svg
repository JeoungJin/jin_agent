<rect x="40" y="436" width="1020" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="550" y="466.0" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">가격을 보여줄 때는  값 + 출처 + 기준 시각  을 함께 표시한다</text>
