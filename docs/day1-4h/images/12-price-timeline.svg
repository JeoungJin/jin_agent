<rect x="330" y="330" width="230" height="84" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="445.0" y="359.15000000000003" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">최근 거래가</text>
