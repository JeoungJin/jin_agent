<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker></defs>
<rect width="1100" height="590" fill="#FFFFFF"/>
<text x="550" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">Prompt와 Context</text>
<text x="550" y="68" text-anchor="middle" font-size="14" fill="#4B5563">지시(Prompt)와 배경(Context)을 분리해서 설계한다</text>
<line x1="40" y1="82" x2="1060" y2="82" stroke="#1F3864" stroke-width="1.5"/>
<rect x="50" y="108" width="430" height="86" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="265.0" y="145.75" text-anchor="middle" font-size="15" fill="#1F3864" font-weight="bold">Prompt — 지시</text>
<text x="265.0" y="167.5" text-anchor="middle" font-size="15" fill="#111827">PER을 쉽게 설명해라</text>
<rect x="50" y="212" width="430" height="160" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="265.0" y="257.025" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">Context — 배경</text>
<text x="265.0" y="278.775" text-anchor="middle" font-size="14" fill="#111827">대상: 금융 초보자</text>
<text x="265.0" y="299.075" text-anchor="middle" font-size="14" fill="#111827">원칙: 투자 추천을 하지 않는다</text>
<text x="265.0" y="319.375" text-anchor="middle" font-size="14" fill="#111827">원칙: 일상적인 예시를 포함한다</text>
<text x="265.0" y="339.675" text-anchor="middle" font-size="14" fill="#111827">원칙: 모르면 추측하지 않는다</text>
<rect x="50" y="390" width="430" height="70" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="265.0" y="431.0" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">질문: PER이 뭐야?</text>
<rect x="580" y="230" width="190" height="130" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="675.0" y="282.95" text-anchor="middle" font-size="22" fill="#1F3864" font-weight="bold">LLM</text>
<text x="675.0" y="314.84999999999997" text-anchor="middle" font-size="14" fill="#111827">함께 읽고</text>
<text x="675.0" y="335.15" text-anchor="middle" font-size="14" fill="#111827">답변을 만든다</text>
<polyline points="480,150 530,150 530,270 580,270" fill="none" stroke="#4B5563" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="480,290 580,290" fill="none" stroke="#4B5563" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="480,425 530,425 530,330 580,330" fill="none" stroke="#4B5563" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="850" y="120" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="950.0" y="165.1" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">Context 없이</text>
<text x="950.0" y="185.4" text-anchor="middle" font-size="14" fill="#111827">일반적인 설명</text>
<rect x="850" y="330" width="200" height="130" rx="10" fill="#E6ECF5" stroke="#1F3864" stroke-width="2.4"/>
<text x="950.0" y="379.95" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">Context 있음</text>
<text x="950.0" y="400.25" text-anchor="middle" font-size="14" fill="#111827">초보 눈높이에</text>
<text x="950.0" y="420.55" text-anchor="middle" font-size="14" fill="#111827">맞고 안전한 답변</text>
<polyline points="770,255 810,255 810,170 850,170" fill="none" stroke="#4B5563" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<polyline points="770,335 810,335 810,395 850,395" fill="none" stroke="#1F3864" stroke-width="2.2" marker-end="url(#b)"/>
<rect x="40" y="490" width="1020" height="58" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="550" y="524.0" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">Prompt = &#x27;무엇을 하라&#x27;는 지시   ｜   Context = &#x27;이 상황을 참고하라&#x27;는 배경</text>
</svg>
