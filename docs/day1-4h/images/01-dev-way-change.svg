<rect x="40" y="470" width="1020" height="54" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="550" y="502.0" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">개발자의 역할:  무엇을 만들지 정의  ·  결과를 검증  ·  시스템을 설계</text>
