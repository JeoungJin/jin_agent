<text x="550" y="390" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">수정 요청 → 다시 검증  (이 사이클을 반복한다)</text>
<rect x="380" y="422" width="22" height="22" rx="4" fill="#E6ECF5" stroke="#1F3864" stroke-width="2"/>
<text x="412" y="439" text-anchor="start" font-size="14" fill="#111827">사람이 하는 일</text>
