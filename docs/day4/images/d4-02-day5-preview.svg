<text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#475569">조각내고 숫자 벡터로</text>
<line x1="395" y1="356" x2="425" y2="356" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="425" y="326" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="500" y="352" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">인덱스 (FAISS)</text>
<text x="500" y="372" text-anchor="middle" font-size="10.5" fill="#475569">벡터 · 원문 · 출처 저장</text>
