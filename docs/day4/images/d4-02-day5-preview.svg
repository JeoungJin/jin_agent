<rect x="300" y="134" width="300" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="450" y="158" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">&quot;JIN 스마트 신용대출</text>
<text x="450" y="178" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">중도상환수수료율은?&quot;</text>
<line x1="600" y1="162" x2="650" y2="162" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="650" y="126" width="300" height="72" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="800" y="150" text-anchor="middle" font-size="13.5" fill="#991b1b" font-weight="bold">근거 자료가 없다</text>
<text x="800" y="172" text-anchor="middle" font-size="12" fill="#0f172a">모른다고 답하거나, 그럴듯하게 지어낼 위험</text>
<text x="800" y="190" text-anchor="middle" font-size="10" fill="#0f172a"></text>
<text x="50" y="238" text-anchor="start" font-size="12.5" fill="#475569">Tool 은 시세 · 환율 · 잔액처럼 &#x27;조회되는 값&#x27;에는 강하지만, 우리 회사 문서의 내용은 알지 못한다</text>
<text x="30" y="296" text-anchor="start" font-size="15" fill="#5b21b6" font-weight="bold">Day 5 (내일) — RAG + PII 마스킹</text>
