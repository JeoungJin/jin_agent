<rect width="1000" height="560" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Day 4 → Day 5</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">LLM 이 &#x27;모르는 우리 문서&#x27;를 근거와 함께 답하게 만든다</text>
<text x="30" y="106" text-anchor="start" font-size="15" fill="#075985" font-weight="bold">Day 4 (오늘)</text>
