<text x="680" y="352" text-anchor="middle" font-size="11.5" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">search_documents</text>
<text x="680" y="372" text-anchor="middle" font-size="10.5" fill="#475569">Tool 로 검색 호출</text>
<line x1="755" y1="356" x2="785" y2="356" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="785" y="326" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="860" y="352" text-anchor="middle" font-size="12.5" fill="#166534" font-weight="bold">근거 + 출처로 답변</text>
<text x="860" y="372" text-anchor="middle" font-size="10.5" fill="#475569">점수가 낮으면 &#x27;자료 없음&#x27;</text>
<rect x="50" y="404" width="900" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="500" y="430" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">PII 마스킹 — 개인정보(주민번호 · 전화번호 · 계좌번호)를 AI 와 로그에서 가린다</text>
<text x="500" y="450" text-anchor="middle" font-size="12" fill="#0f172a">입력 · 도구 결과 · 출력 · 저장 · 로그 네 지점마다 한 겹씩</text>
<rect x="30" y="500" width="940" height="40" rx="12" fill="#0f172a"/><text x="500.0" y="525.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">RAG 검색도 오늘 배운 Function Calling 위에 Tool 로 얹힌다 — 오늘의 구조가 그대로 쓰인다</text>
