<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="790" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">토큰과 비용: 요청마다 무엇을 보내나</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">LLM 은 매 요청을 처음부터 읽는다 — 보내는 만큼 토큰이 늘고 비용도 늘어난다</text>
<text x="30" y="100" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">한 번의 요청에서 입력 토큰이 되는 것</text>
<rect x="30" y="114" width="420" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="46" y="140" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">system 규칙</text>
<text x="440" y="140" text-anchor="end" font-size="12" fill="#0f172a">항상 포함 (고정)</text>
<rect x="30" y="164" width="420" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="46" y="190" text-anchor="start" font-size="13" fill="#92400e" font-weight="bold">Few-shot 예시 3개</text>
<text x="440" y="190" text-anchor="end" font-size="12" fill="#0f172a">항상 포함 (고정)</text>
<rect x="30" y="214" width="420" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="46" y="240" text-anchor="start" font-size="13" fill="#5b21b6" font-weight="bold">Tool 스키마 (함수 설명서)</text>
<text x="440" y="240" text-anchor="end" font-size="12" fill="#0f172a">항상 포함 (고정)</text>
<rect x="30" y="264" width="420" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="46" y="290" text-anchor="start" font-size="13" fill="#991b1b" font-weight="bold">대화 history</text>
<text x="440" y="290" text-anchor="end" font-size="12" fill="#0f172a">턴이 늘수록 계속 늘어난다</text>
<rect x="30" y="314" width="420" height="42" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="46" y="340" text-anchor="start" font-size="13" fill="#075985" font-weight="bold">현재 질문</text>
<text x="440" y="340" text-anchor="end" font-size="12" fill="#0f172a">매번 새로 들어온다</text>
<rect x="30" y="372" width="420" height="2" rx="0" fill="#475569" stroke="#475569" stroke-width="0"/>
<text x="240" y="394" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">입력 토큰 (prompt tokens)</text>
<line x1="450" y1="240" x2="520" y2="240" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="520" y="194" width="120" height="92" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
<text x="580" y="232" text-anchor="middle" font-size="18" fill="#5b21b6" font-weight="bold">LLM</text>
<text x="580" y="258" text-anchor="middle" font-size="11.5" fill="#0f172a">처음부터 읽는다</text>
<line x1="640" y1="240" x2="710" y2="240" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="710" y="194" width="260" height="92" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<text x="840" y="226" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">답변</text>
<text x="840" y="250" text-anchor="middle" font-size="12.5" fill="#0f172a">출력 토큰 (completion tokens)</text>
<text x="840" y="270" text-anchor="middle" font-size="11.5" fill="#64748b">생성한 만큼 계산된다</text>
<rect x="490" y="114" width="480" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="730" y="140" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">비용 = 입력 토큰 × 입력 단가 + 출력 토큰 × 출력 단가</text>
<text x="730" y="162" text-anchor="middle" font-size="12" fill="#0f172a">단가는 모델마다 다르다 (공식 요금표 확인)</text>
<rect x="490" y="300" width="480" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="730" y="324" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">Tool 루프는 라운드마다 LLM 을 다시 부른다</text>
<text x="730" y="344" text-anchor="middle" font-size="12" fill="#0f172a">→ 같은 입력이 라운드 수만큼 반복해서 계산된다</text>
<text x="30" y="430" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">턴이 늘수록 입력 토큰이 커진다 (설명용 예시 숫자)</text>
<line x1="60" y1="700" x2="960" y2="700" stroke="#475569" stroke-width="1.6"/>
<rect x="100" y="616.0" width="100" height="84.00000000000001" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="150" y="663.0" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">고정 부분</text>
<text x="150" y="718" text-anchor="middle" font-size="12" fill="#0f172a">1번째 질문</text>
<text x="150" y="608.0" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">300</text>
<rect x="270" y="616.0" width="100" height="84.00000000000001" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="320" y="663.0" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">고정 부분</text>
<rect x="270" y="582.4" width="100" height="33.6" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="320" y="604.2" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">history +120</text>
<text x="320" y="718" text-anchor="middle" font-size="12" fill="#0f172a">2번째 질문</text>
<text x="320" y="574.4" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">420</text>
<rect x="440" y="616.0" width="100" height="84.00000000000001" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="490" y="663.0" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">고정 부분</text>
<rect x="440" y="543.2" width="100" height="72.80000000000001" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="490" y="584.6" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">history +260</text>
<text x="490" y="718" text-anchor="middle" font-size="12" fill="#0f172a">3번째 질문</text>
<text x="490" y="535.2" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">560</text>
<rect x="610" y="616.0" width="100" height="84.00000000000001" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="660" y="663.0" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">고정 부분</text>
<rect x="610" y="498.4" width="100" height="117.60000000000001" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="660" y="562.2" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">history +420</text>
<text x="660" y="718" text-anchor="middle" font-size="12" fill="#0f172a">4번째 질문</text>
<text x="660" y="490.4" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">720</text>
<rect x="780" y="616.0" width="100" height="84.00000000000001" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="830" y="663.0" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">고정 부분</text>
<rect x="780" y="448.0" width="100" height="168.00000000000003" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="830" y="537.0" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">history +600</text>
<text x="830" y="718" text-anchor="middle" font-size="12" fill="#0f172a">5번째 질문</text>
<text x="830" y="440.0" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">900</text>
<text x="30" y="452" text-anchor="start" font-size="11.5" fill="#64748b">고정 부분 = system 규칙 + Few-shot 예시 + Tool 스키마</text>
<rect x="30" y="742" width="940" height="36" rx="12" fill="#0f172a"/><text x="500.0" y="765.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">줄이는 방법: 최근 N개만 보내기 · Few-shot 2~3개 · 짧은 system·Tool 설명 · 반복 횟수 제한 · 짧은 답</text>
</svg>
