<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1136" viewBox="0 0 1000 1136" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1000" height="1136" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">JWT 인증 기본 개념 ① 구조와 구성요소 (HttpOnly 쿠키 방식)</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">JWT = 서버가 서명해서 발급하는 신원 증명 문자열 — 이 프로젝트는 그 토큰을 HttpOnly 쿠키에 담아 주고받는다</text>
<text x="30" y="104" font-size="16" font-weight="bold" fill="#0f172a">JWT 토큰의 구조 — 점(.)으로 구분된 3부분</text>
<rect x="30" y="116" width="300" height="118" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="46" y="144" font-size="17" font-weight="bold" fill="#1e3a8a">① Header</text>
<text x="46" y="164" font-size="13" fill="#475569">알고리즘 · 타입</text>
<rect x="42" y="176" width="276" height="48" rx="6" fill="#fff" stroke="#2563eb" stroke-opacity=".4"/>
<text x="52" y="196" font-size="12" font-family="Consolas,monospace" fill="#0f172a">{"alg":"HS256",</text>
<text x="52" y="214" font-size="12" font-family="Consolas,monospace" fill="#0f172a">"typ":"JWT"}</text>
<rect x="350" y="116" width="300" height="118" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="366" y="144" font-size="17" font-weight="bold" fill="#14532d">② Payload (Claims)</text>
<text x="366" y="164" font-size="13" fill="#475569">사용자 정보 · 만료시각</text>
<rect x="362" y="176" width="276" height="48" rx="6" fill="#fff" stroke="#16a34a" stroke-opacity=".4"/>
<text x="372" y="196" font-size="12" font-family="Consolas,monospace" fill="#0f172a">{"sub":"1","email":"a@b.com",</text>
<text x="372" y="214" font-size="12" font-family="Consolas,monospace" fill="#0f172a">"iat":…,"exp":…}</text>
<rect x="670" y="116" width="300" height="118" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="686" y="144" font-size="17" font-weight="bold" fill="#78350f">③ Signature</text>
<text x="686" y="164" font-size="13" fill="#475569">위조 · 변조 방지</text>
<rect x="682" y="176" width="276" height="48" rx="6" fill="#fff" stroke="#d97706" stroke-opacity=".4"/>
<text x="692" y="196" font-size="12" font-family="Consolas,monospace" fill="#0f172a">HMACSHA256(</text>
<text x="692" y="214" font-size="12" font-family="Consolas,monospace" fill="#0f172a">header.payload, secret)</text>
<text x="340" y="190" text-anchor="middle" font-size="38" font-weight="bold" fill="#475569">.</text>
<text x="660" y="190" text-anchor="middle" font-size="38" font-weight="bold" fill="#475569">.</text>
<rect x="30" y="248" width="940" height="36" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="500" y="271" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">주의: Payload는 암호화가 아니라 Base64URL 인코딩 → 누구나 읽을 수 있음. 비밀번호 등 민감정보를 넣지 말 것</text>
<text x="30" y="324" font-size="16" font-weight="bold" fill="#0f172a">토큰을 담는 쿠키의 속성 4가지</text>
<rect x="30" y="338" width="224" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="44" y="364" font-size="15" font-weight="bold" fill="#166534" font-family="Consolas,monospace">HttpOnly</text>
<text x="44" y="388" font-size="12.5" fill="#1e293b">JS(document.cookie)로 읽기</text>
<text x="44" y="405" font-size="12.5" fill="#1e293b">차단</text>
<line x1="44" y1="426" x2="240" y2="426" stroke="#16a34a" stroke-opacity=".4"/>
<text x="44" y="444" font-size="12.5" font-weight="bold" fill="#166534">→ XSS로 인한 토큰 탈취 방지</text>
<rect x="268" y="338" width="224" height="140" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="282" y="364" font-size="15" font-weight="bold" fill="#075985" font-family="Consolas,monospace">Secure</text>
<text x="282" y="388" font-size="12.5" fill="#1e293b">HTTPS 연결에서만 전송</text>
<line x1="282" y1="426" x2="478" y2="426" stroke="#0284c7" stroke-opacity=".4"/>
<text x="282" y="444" font-size="12.5" font-weight="bold" fill="#075985">→ 로컬(http)은 false,</text>
<text x="282" y="460" font-size="12.5" font-weight="bold" fill="#075985">운영(https)은 true</text>
<rect x="506" y="338" width="224" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="520" y="364" font-size="15" font-weight="bold" fill="#92400e" font-family="Consolas,monospace">SameSite=Lax</text>
<text x="520" y="388" font-size="12.5" fill="#1e293b">다른 사이트에서 온 POST</text>
<text x="520" y="405" font-size="12.5" fill="#1e293b">요청에는 쿠키를 보내지 않음</text>
<line x1="520" y1="426" x2="716" y2="426" stroke="#d97706" stroke-opacity=".4"/>
<text x="520" y="444" font-size="12.5" font-weight="bold" fill="#92400e">→ CSRF 방어</text>
<rect x="744" y="338" width="224" height="140" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="758" y="364" font-size="15" font-weight="bold" fill="#5b21b6" font-family="Consolas,monospace">Max-Age</text>
<text x="758" y="388" font-size="12.5" fill="#1e293b">쿠키 유효기간(초)</text>
<line x1="758" y1="426" x2="954" y2="426" stroke="#7c3aed" stroke-opacity=".4"/>
<text x="758" y="444" font-size="12.5" font-weight="bold" fill="#5b21b6">→ 토큰 만료(1시간)와 같은 값</text>
<text x="30" y="516" font-size="16" font-weight="bold" fill="#0f172a">JWT 인증에 필요한 구성요소 (이번 Spring 프로젝트 기준)</text>
<rect x="30" y="530" width="940" height="36" rx="8" fill="#0f172a"/>
<text x="46" y="554" font-size="14" font-weight="bold" fill="#f8fafc">구성요소</text>
<text x="250" y="554" font-size="14" font-weight="bold" fill="#f8fafc">역할</text>
<text x="700" y="554" font-size="14" font-weight="bold" fill="#f8fafc">이번 프로젝트</text>
<rect x="30" y="566" width="940" height="54" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="598.0" font-size="14" font-weight="bold" fill="#1e3a8a">비밀키 (Secret)</text>
<text x="250" y="588" font-size="13" fill="#1e293b">서명을 만들고 검증하는 서버 전용 열쇠.</text>
<text x="250" y="605" font-size="13" fill="#1e293b">노출되면 누구나 토큰을 위조할 수 있음</text>
<text x="700" y="588.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">jwt.secret</text>
<text x="700" y="605.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">(환경변수 JWT_SECRET)</text>
<rect x="30" y="620" width="940" height="54" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="652.0" font-size="14" font-weight="bold" fill="#1e3a8a">만료시간 (exp)</text>
<text x="250" y="642" font-size="13" fill="#1e293b">토큰의 유효기간. 쿠키 Max-Age도</text>
<text x="250" y="659" font-size="13" fill="#1e293b">같은 값으로 맞춘다</text>
<text x="700" y="642.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">jwt.expiration-ms</text>
<text x="700" y="659.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">(1시간)</text>
<rect x="30" y="674" width="940" height="54" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="706.0" font-size="14" font-weight="bold" fill="#1e3a8a">토큰 발급 · 검증</text>
<text x="250" y="696" font-size="13" fill="#1e293b">로그인 시 서명한 토큰 생성,</text>
<text x="250" y="713" font-size="13" fill="#1e293b">요청 시 서명·만료를 확인해 사용자 추출</text>
<text x="700" y="690.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">JwtTokenProvider</text>
<text x="700" y="705.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">createToken / validateToken</text>
<text x="700" y="720.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">/ getAuthUser</text>
<rect x="30" y="728" width="940" height="54" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="760.0" font-size="14" font-weight="bold" fill="#1e3a8a">인증 쿠키</text>
<text x="250" y="750" font-size="13" fill="#1e293b">토큰을 HttpOnly 쿠키로 내려주고</text>
<text x="250" y="767" font-size="13" fill="#1e293b">로그아웃 때는 같은 속성의 삭제 쿠키 발급</text>
<text x="700" y="744.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">AuthCookieFactory</text>
<text x="700" y="759.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">jwt.cookie-name</text>
<text x="700" y="774.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">jwt.cookie-secure</text>
<rect x="30" y="782" width="940" height="54" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="814.0" font-size="14" font-weight="bold" fill="#1e3a8a">인증 필터</text>
<text x="250" y="804" font-size="13" fill="#1e293b">매 요청에서 쿠키의 토큰을 꺼내 검증</text>
<text x="250" y="821" font-size="13" fill="#1e293b">(없으면 Authorization: Bearer로 대체)</text>
<text x="700" y="804.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">JwtAuthenticationFilter</text>
<text x="700" y="821.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">resolveToken()</text>
<rect x="30" y="836" width="940" height="54" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="868.0" font-size="14" font-weight="bold" fill="#1e3a8a">보안 설정</text>
<text x="250" y="858" font-size="13" fill="#1e293b">공개/인증 URL 구분, 세션 미사용(STATELESS),</text>
<text x="250" y="875" font-size="13" fill="#1e293b">인증 실패 시 401, CSRF는 SameSite로 방어</text>
<text x="700" y="867.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">SecurityConfig</text>
<rect x="30" y="890" width="940" height="54" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="922.0" font-size="14" font-weight="bold" fill="#1e3a8a">SecurityContext</text>
<text x="250" y="912" font-size="13" fill="#1e293b">인증된 사용자를 요청 처리 동안 보관</text>
<text x="250" y="929" font-size="13" fill="#1e293b">(컨트롤러에서 꺼내 사용)</text>
<text x="700" y="912.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">SecurityContextHolder</text>
<text x="700" y="929.5" font-size="12" font-family="Consolas,monospace" fill="#92400e">@AuthenticationPrincipal</text>
<rect x="30" y="944" width="940" height="54" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="976.0" font-size="14" font-weight="bold" fill="#1e3a8a">사용자 정보</text>
<text x="250" y="975.0" font-size="13" fill="#1e293b">토큰에 담는 최소 정보 (비밀번호는 제외)</text>
<text x="700" y="975.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">record AuthUser(id, email)</text>
<rect x="30" y="998" width="940" height="54" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="1030.0" font-size="14" font-weight="bold" fill="#1e3a8a">로그인 상태 확인</text>
<text x="250" y="1020" font-size="13" fill="#1e293b">JS는 HttpOnly 쿠키를 읽을 수 없으므로</text>
<text x="250" y="1037" font-size="13" fill="#1e293b">서버에 물어서 로그인 여부 판단 (200 / 401)</text>
<text x="700" y="1029.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">GET /api/ai/me</text>
<rect x="30" y="1052" width="940" height="54" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="1084.0" font-size="14" font-weight="bold" fill="#1e3a8a">로그아웃</text>
<text x="250" y="1074" font-size="13" fill="#1e293b">서버가 삭제 쿠키(Max-Age=0)를 내려줘</text>
<text x="250" y="1091" font-size="13" fill="#1e293b">브라우저의 쿠키를 지움</text>
<text x="700" y="1083.0" font-size="12" font-family="Consolas,monospace" fill="#92400e">POST /api/auth/logout</text>
<line x1="240" y1="566" x2="240" y2="1106" stroke="#e2e8f0"/><line x1="690" y1="566" x2="690" y2="1106" stroke="#e2e8f0"/>
</svg>