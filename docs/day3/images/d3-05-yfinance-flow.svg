<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="630" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">yfinance 포트폴리오: 조회 · 캐시 · 실패 처리</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">GET /api/v1/portfolio 한 번에 9개 종목</text>
<rect x="30" y="92" width="480" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="270" y="120" text-anchor="middle" font-size="14" fill="#075985" font-weight="bold">GET /api/v1/portfolio 요청</text>
<line x1="270" y1="136" x2="270" y2="164" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="30" y="166" width="480" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
<text x="270" y="190" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">캐시 확인 — TTL(60초) 이내인가?</text>
<text x="270" y="209" text-anchor="middle" font-size="11.5" fill="#0f172a">config.py 설정값 · 스레드 안전하게</text>
<polyline points="150,218 150,252" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="160" y="240" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">예</text>
<rect x="30" y="254" width="225" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="142" y="282" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="bold">캐시 값 사용</text>
<text x="142" y="304" text-anchor="middle" font-size="11.5" fill="#0f172a">yfinance 를 다시 부르지 않음</text>
<polyline points="400,218 400,252" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<text x="410" y="240" text-anchor="start" font-size="12" fill="#475569" font-weight="bold">아니오</text>
<rect x="285" y="254" width="225" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="397" y="282" text-anchor="middle" font-size="13.5" fill="#5b21b6" font-weight="bold">yfinance 9개 병렬 조회</text>
<text x="397" y="304" text-anchor="middle" font-size="11.5" fill="#0f172a">순차 호출 금지 · 타임아웃 설정</text>
<line x1="397" y1="318" x2="397" y2="346" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="285" y="348" width="225" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="397" y="374" text-anchor="middle" font-size="13" fill="#5b21b6" font-weight="bold">등락률 계산 → 캐시 저장</text>
<text x="397" y="394" text-anchor="middle" font-size="11" fill="#0f172a">종목별 (price, changePercent, 시각)</text>
<rect x="30" y="432" width="480" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="270" y="458" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">종목별 조회 실패 시</text>
<text x="270" y="482" text-anchor="middle" font-size="12.5" fill="#0f172a">마지막 캐시 값을 반환  (&quot;N분 전 값&quot; 표시)</text>
<text x="270" y="504" text-anchor="middle" font-size="12" fill="#0f172a">캐시도 없으면 그 종목은 제외 · 9개 모두 실패하면 503</text>
<rect x="540" y="92" width="430" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
<text x="755" y="118" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">전일 대비 등락률 공식</text>
<text x="755" y="148" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">changePercent =</text>
<text x="755" y="172" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">(현재가 − 전일 종가) ÷ 전일 종가 × 100</text>
<text x="755" y="198" text-anchor="middle" font-size="12" fill="#475569">소수 둘째 자리 반올림</text>
<text x="755" y="222" text-anchor="middle" font-size="12.5" fill="#92400e" font-weight="bold">예) 71,000 vs 70,000 → +1.43%</text>
<rect x="540" y="258" width="430" height="128" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="755" y="284" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">종목 코드의 .KS</text>
<text x="755" y="310" text-anchor="middle" font-size="12.5" fill="#0f172a">.KS = 코스피(KOSPI)   .KQ = 코스닥(KOSDAQ)</text>
<text x="755" y="334" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">삼성전자 005930.KS · SK하이닉스 000660.KS</text>
<text x="755" y="358" text-anchor="middle" font-size="11.5" fill="#475569">같은 숫자라도 어느 거래소인지 접미사로 구분한다</text>
<rect x="540" y="402" width="430" height="122" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="556" y="430" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">[ { &quot;ticker&quot;: &quot;005930.KS&quot;,</text>
<text x="556" y="454" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    &quot;name&quot;: &quot;삼성전자&quot;,</text>
<text x="556" y="478" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    &quot;price&quot;: 71000,</text>
<text x="556" y="502" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    &quot;changePercent&quot;: 1.43 }, … ]</text>
<rect x="30" y="544" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="571" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">yfinance 호출이 실패해도 서버는 죽지 않는다 — 예외를 던지지 않고 캐시 값 또는 안내 문구로 대응</text>
<text x="500.0" y="594" text-anchor="middle" font-size="12" fill="#fbbf24">시세는 지연될 수 있으므로 조회 시각을 함께 표시한다</text>
</svg>
