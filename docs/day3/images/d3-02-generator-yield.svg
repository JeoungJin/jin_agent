<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="580" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">return 과 yield 의 차이</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">yield 는 값을 내보내고 잠시 멈춘다 — 그래서 &#x27;하나씩 보내기&#x27;에 알맞다</text>
<rect x="30" y="92" width="300" height="290" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
<text x="180" y="120" text-anchor="middle" font-size="16" fill="#991b1b" font-weight="bold">return</text>
<rect x="48" y="134" width="264" height="92" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="60" y="160" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">def normal_function():</text>
<text x="60" y="184" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    return &quot;첫 번째&quot;</text>
<text x="60" y="208" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    return &quot;두 번째&quot;  # 실행 안 됨</text>
<rect x="48" y="244" width="264" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="180" y="270" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">첫 return 에서 함수가</text>
<text x="180" y="292" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">완전히 끝난다</text>
<text x="180" y="340" text-anchor="middle" font-size="13" fill="#64748b">값은 1개, 한 번에 끝</text>
<rect x="360" y="92" width="610" height="290" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<text x="665" y="120" text-anchor="middle" font-size="16" fill="#166534" font-weight="bold">yield  (제너레이터)</text>
<rect x="378" y="134" width="574" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="392" y="159" text-anchor="start" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">① gen = generator_function()</text>
<text x="610" y="159" text-anchor="start" font-size="12" fill="#0f172a">아직 아무 코드도 실행되지 않는다 (지연 실행)</text>
<rect x="378" y="181" width="574" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="392" y="206" text-anchor="start" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">② next(gen)</text>
<text x="610" y="206" text-anchor="start" font-size="12" fill="#0f172a">첫 yield 까지 실행 → &quot;첫 번째&quot; 를 내보내고 멈춤</text>
<rect x="378" y="228" width="574" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="392" y="253" text-anchor="start" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">③ next(gen)</text>
<text x="610" y="253" text-anchor="start" font-size="12" fill="#0f172a">멈춘 곳에서 이어서 → &quot;두 번째&quot; 를 내보내고 멈춤</text>
<rect x="378" y="275" width="574" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="392" y="300" text-anchor="start" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">④ next(gen)</text>
<text x="610" y="300" text-anchor="start" font-size="12" fill="#0f172a">이어서 → &quot;세 번째&quot; 를 내보내고 멈춤</text>
<rect x="378" y="322" width="574" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="392" y="347" text-anchor="start" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">⑤ for chunk in gen</text>
<text x="610" y="347" text-anchor="start" font-size="12" fill="#0f172a">for 문이 next() 를 자동으로 반복 호출한다</text>
<text x="30" y="418" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">그래서 스트리밍에 이렇게 쓰인다</text>
<rect x="30" y="432" width="215" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="137" y="458" text-anchor="middle" font-size="13.5" fill="#5b21b6" font-weight="bold">제너레이터</text>
<text x="137" y="480" text-anchor="middle" font-size="12" fill="#0f172a">events()</text>
<line x1="245" y1="464" x2="270" y2="464" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="270" y="432" width="215" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="377" y="458" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="bold">StreamingResponse</text>
<text x="377" y="480" text-anchor="middle" font-size="12" fill="#0f172a">값이 나올 때마다 전송</text>
<line x1="485" y1="464" x2="510" y2="464" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="510" y="432" width="215" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="617" y="458" text-anchor="middle" font-size="13.5" fill="#075985" font-weight="bold">네트워크</text>
<text x="617" y="480" text-anchor="middle" font-size="12" fill="#0f172a">SSE 이벤트가 흘러감</text>
<line x1="725" y1="464" x2="750" y2="464" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="750" y="432" width="215" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="857" y="458" text-anchor="middle" font-size="13.5" fill="#92400e" font-weight="bold">브라우저</text>
<text x="857" y="480" text-anchor="middle" font-size="12" fill="#0f172a">조각이 오는 대로 표시</text>
<rect x="30" y="512" width="940" height="50" rx="12" fill="#0f172a"/><text x="500.0" y="542.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">yield 덕분에 &#x27;답이 만들어지는 대로 하나씩 내보내기&#x27;를 자연스럽게 표현할 수 있다</text>
</svg>
