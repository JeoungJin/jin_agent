<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="766" viewBox="0 0 1000 766" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1000" height="766" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">스트리밍은 왜 필요한가?</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">일반 방식(/chat) vs 스트리밍 방식(/route-stream) — 같은 5초, 다른 체감</text>
<text x="30" y="100" font-size="16" font-weight="bold" fill="#0f172a">타임라인 비교 (예: 답변을 만드는 데 5초 걸리는 경우)</text>
<line x1="200.0" y1="130" x2="200.0" y2="138" stroke="#94a3b8"/>
<text x="200.0" y="124" text-anchor="middle" font-size="12" fill="#64748b">0초</text>
<line x1="320.0" y1="130" x2="320.0" y2="138" stroke="#94a3b8"/>
<text x="320.0" y="124" text-anchor="middle" font-size="12" fill="#64748b">1초</text>
<line x1="440.0" y1="130" x2="440.0" y2="138" stroke="#94a3b8"/>
<text x="440.0" y="124" text-anchor="middle" font-size="12" fill="#64748b">2초</text>
<line x1="560.0" y1="130" x2="560.0" y2="138" stroke="#94a3b8"/>
<text x="560.0" y="124" text-anchor="middle" font-size="12" fill="#64748b">3초</text>
<line x1="680.0" y1="130" x2="680.0" y2="138" stroke="#94a3b8"/>
<text x="680.0" y="124" text-anchor="middle" font-size="12" fill="#64748b">4초</text>
<line x1="800.0" y1="130" x2="800.0" y2="138" stroke="#94a3b8"/>
<text x="800.0" y="124" text-anchor="middle" font-size="12" fill="#64748b">5초</text>
<line x1="200" y1="134" x2="820" y2="134" stroke="#94a3b8"/>
<line x1="800" y1="138" x2="800" y2="334" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="30" y="150" width="150" height="58" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="105" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#075985">일반 방식</text>
<text x="105" y="195" text-anchor="middle" font-size="12" fill="#0369a1" font-family="Consolas,monospace">/chat</text>
<rect x="200" y="164" width="600" height="30" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="500" y="184" text-anchor="middle" font-size="13" fill="#475569">서버가 답변을 다 만드는 중… (화면은 비어 있음)</text>
<circle cx="800" cy="179" r="8" fill="#0284c7"/>
<text x="786" y="226" text-anchor="end" font-size="13" font-weight="bold" fill="#075985">5초 뒤 전체 답변이 한 번에 표시</text>
<rect x="30" y="252" width="150" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="105" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">스트리밍 방식</text>
<text x="105" y="297" text-anchor="middle" font-size="12" fill="#15803d" font-family="Consolas,monospace">/route-stream (오늘)</text>
<rect x="200" y="266" width="60" height="30" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
<rect x="266" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="292" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="318" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="344" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="370" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="396" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="422" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="448" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="474" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="500" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="526" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="552" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="578" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="604" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="630" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="656" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="682" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="708" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="734" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<rect x="760" y="266" width="20" height="30" rx="4" fill="#16a34a"/>
<circle cx="260" cy="281" r="8" fill="#16a34a"/>
<text x="262" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">0.5초: 첫 글자 표시</text>
<text x="530" y="320" text-anchor="middle" font-size="12" fill="#475569">글자가 만들어지는 즉시 이어서 표시</text>
<text x="786" y="346" text-anchor="end" font-size="13" font-weight="bold" fill="#6d28d9">완료는 둘 다 약 5초 (거의 동일)</text>
<text x="30" y="386" font-size="16" font-weight="bold" fill="#0f172a">두 방식 비교</text>
<rect x="30" y="396" width="940" height="36" rx="8" fill="#0f172a"/>
<text x="46" y="420" font-size="14" font-weight="bold" fill="#f8fafc">항목</text>
<text x="306" y="420" font-size="14" font-weight="bold" fill="#f8fafc">일반 방식 (/chat)</text>
<text x="646" y="420" font-size="14" font-weight="bold" fill="#f8fafc">스트리밍 방식 (/route-stream)</text>
<rect x="30" y="432" width="940" height="34" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="453.5" font-size="13" fill="#1e3a8a" font-weight="bold" >응답 전송 시점</text>
<text x="306" y="453.5" font-size="13" fill="#1e293b"  >답변을 다 만든 뒤 한 번에</text>
<text x="646" y="453.5" font-size="13" fill="#1e293b"  >만들어지는 즉시 조금씩</text>
<rect x="30" y="466" width="940" height="34" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="487.5" font-size="13" fill="#1e3a8a" font-weight="bold" >첫 글자까지 걸리는 시간</text>
<text x="306" y="487.5" font-size="13" fill="#1e293b"  >전체 생성 시간만큼 (길다)</text>
<text x="646" y="487.5" font-size="13" fill="#1e293b"  >매우 짧다</text>
<rect x="30" y="500" width="940" height="34" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="521.5" font-size="13" fill="#1e3a8a" font-weight="bold" >전체 소요 시간</text>
<text x="306" y="521.5" font-size="13" fill="#1e293b"  >T</text>
<text x="646" y="521.5" font-size="13" fill="#1e293b"  >약 T (거의 같음)</text>
<rect x="30" y="534" width="940" height="34" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="555.5" font-size="13" fill="#1e3a8a" font-weight="bold" >응답 형태 (Spring)</text>
<text x="306" y="555.5" font-size="13" fill="#1e293b"  >JSON 1개 → Mono</text>
<text x="646" y="555.5" font-size="13" fill="#1e293b"  >이벤트 N개 → Flux + SSE</text>
<rect x="30" y="568" width="940" height="34" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="589.5" font-size="13" fill="#1e3a8a" font-weight="bold" >프론트 처리</text>
<text x="306" y="589.5" font-size="13" fill="#1e293b"  >axios로 한 번에 받기</text>
<text x="646" y="589.5" font-size="13" fill="#1e293b"  >fetch + ReadableStream</text>
<rect x="30" y="602" width="940" height="34" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="46" y="623.5" font-size="13" fill="#1e3a8a" font-weight="bold" >오류 처리</text>
<text x="306" y="623.5" font-size="13" fill="#1e293b"  >HTTP 상태코드로 알림</text>
<text x="646" y="623.5" font-size="13" fill="#1e293b"  >시작 후에는 error 이벤트로 알림</text>
<rect x="30" y="636" width="940" height="34" fill="#fff" stroke="#e2e8f0"/>
<text x="46" y="657.5" font-size="13" fill="#1e3a8a" font-weight="bold" >잘 맞는 경우</text>
<text x="306" y="657.5" font-size="13" fill="#1e293b"  >짧은 답 · 조회성 응답</text>
<text x="646" y="657.5" font-size="13" fill="#1e293b"  >길게 생성되는 LLM 답변</text>
<line x1="290" y1="432" x2="290" y2="670" stroke="#e2e8f0"/>
<line x1="630" y1="432" x2="630" y2="670" stroke="#e2e8f0"/>
<rect x="30" y="686" width="940" height="56" rx="12" fill="#0f172a"/>
<text x="500" y="710" text-anchor="middle" font-size="16" font-weight="bold" fill="#f8fafc">스트리밍은 전체를 빠르게 만드는 기술이 아니라, "첫 글자까지의 대기"를 줄여</text>
<text x="500" y="732" text-anchor="middle" font-size="16" font-weight="bold" fill="#fbbf24">사용자가 덜 기다리는 것처럼 "느끼게" 만드는 기술이다</text>
</svg>