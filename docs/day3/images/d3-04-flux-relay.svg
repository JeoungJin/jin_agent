<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="640" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Spring 은 모았다가 보내지 않고, 받는 즉시 중계한다</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">같은 token 이벤트라도 어떻게 받느냐에 따라 화면이 달라진다</text>
<rect x="30" y="92" width="940" height="158" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
<text x="50" y="118" text-anchor="start" font-size="15" fill="#991b1b" font-weight="bold">모았다가 보내기 (잘못된 방식)</text>
<rect x="50" y="132" width="200" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="150" y="158" text-anchor="middle" font-size="13.5" fill="#5b21b6" font-weight="bold">FastAPI</text>
<text x="150" y="180" text-anchor="middle" font-size="12" fill="#0f172a">token 이벤트</text>
<text x="150" y="200" text-anchor="middle" font-size="12" fill="#0f172a">0.5초 간격으로 4개</text>
<line x1="250" y1="178" x2="330" y2="178" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="330" y="132" width="330" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="495" y="160" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="bold">SpringBoot</text>
<text x="495" y="184" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">collectList() · block()</text>
<text x="495" y="206" text-anchor="middle" font-size="12" fill="#0f172a">전부 모일 때까지 기다림</text>
<line x1="660" y1="178" x2="740" y2="178" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="740" y="132" width="210" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="845" y="158" text-anchor="middle" font-size="13.5" fill="#075985" font-weight="bold">React 화면</text>
<text x="845" y="184" text-anchor="middle" font-size="15" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">▮▮▮▮</text>
<text x="845" y="208" text-anchor="middle" font-size="11.5" fill="#64748b">도착 모양</text>
<text x="500" y="242" text-anchor="middle" font-size="12.5" fill="#991b1b" font-weight="bold">2초 뒤 한꺼번에 도착 → 스트리밍 효과 사라짐</text>
<rect x="30" y="262" width="940" height="158" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<text x="50" y="288" text-anchor="start" font-size="15" fill="#166534" font-weight="bold">받는 즉시 중계 (올바른 방식)</text>
<rect x="50" y="302" width="200" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="150" y="328" text-anchor="middle" font-size="13.5" fill="#5b21b6" font-weight="bold">FastAPI</text>
<text x="150" y="350" text-anchor="middle" font-size="12" fill="#0f172a">token 이벤트</text>
<text x="150" y="370" text-anchor="middle" font-size="12" fill="#0f172a">0.5초 간격으로 4개</text>
<line x1="250" y1="348" x2="330" y2="348" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="330" y="302" width="330" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="495" y="330" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="bold">SpringBoot</text>
<text x="495" y="354" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">bodyToFlux(ServerSentEvent)</text>
<text x="495" y="376" text-anchor="middle" font-size="12" fill="#0f172a">이벤트를 그대로 전달</text>
<line x1="660" y1="348" x2="740" y2="348" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="740" y="302" width="210" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="845" y="328" text-anchor="middle" font-size="13.5" fill="#075985" font-weight="bold">React 화면</text>
<text x="845" y="354" text-anchor="middle" font-size="15" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">▮ ▮ ▮ ▮</text>
<text x="845" y="378" text-anchor="middle" font-size="11.5" fill="#64748b">도착 모양</text>
<text x="500" y="412" text-anchor="middle" font-size="12.5" fill="#166534" font-weight="bold">0.5초마다 한 조각씩 도착 → 글자가 타이핑됨</text>
<rect x="30" y="440" width="455" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="257" y="466" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">타임아웃의 의미가 달라진다</text>
<text x="257" y="490" text-anchor="middle" font-size="12.5" fill="#0f172a">스트리밍에서는 &#x27;전체 시간&#x27;이 아니라</text>
<text x="257" y="510" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">&#x27;이벤트와 이벤트 사이의 최대 대기시간&#x27;</text>
<rect x="515" y="440" width="455" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="742" y="466" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">실패하면 error 이벤트 1개</text>
<text x="742" y="490" text-anchor="middle" font-size="12" fill="#0f172a">연결 거부 · 5xx · 스트림 도중 오류 → error 후 종료</text>
<text x="742" y="510" text-anchor="middle" font-size="12" fill="#0f172a">(4xx 는 fallback 없이 상태코드 그대로)</text>
<rect x="30" y="552" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="579" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">OpenAI 첫 토큰이 3초를 넘으면 정상 응답인데도 fallback 이 나갈 수 있다</text>
<text x="500.0" y="602" text-anchor="middle" font-size="12" fill="#fbbf24">그래서 스트리밍에서는 ai.fastapi.timeout: 10s 처럼 넉넉한 값이 더 안전하다</text>
</svg>
