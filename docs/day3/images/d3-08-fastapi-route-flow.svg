<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="700" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">FastAPI 안에서 요청이 지나가는 길</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">질문 분류부터 브라우저 렌더링까지  ·  POST /api/v1/route-stream</text>
<rect x="250" y="92" width="500" height="52" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
<text x="500.0" y="116" text-anchor="middle" font-size="14" fill="#075985" font-weight="bold">브라우저 · React</text>
<text x="500.0" y="135" text-anchor="middle" font-size="12" fill="#0f172a">POST /api/v1/route-stream</text>
<line x1="500" y1="144" x2="500" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="250" y="172" width="500" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
<text x="500.0" y="196" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">route.py  (router)</text>
<text x="500.0" y="215" text-anchor="middle" font-size="12" fill="#0f172a">요청을 받아 service 를 호출하고 StreamingResponse 로 감싼다</text>
<line x1="500" y1="224" x2="500" y2="250" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="250" y="252" width="500" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
<text x="500.0" y="276" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">route_service.py</text>
<text x="500.0" y="295" text-anchor="middle" font-size="12" fill="#0f172a">질문 분류 (ACCOUNT · STOCK · EXCHANGE · FINANCE · GENERAL)</text>
<polyline points="400,304 400,324 235,324 235,344" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="600,304 600,324 765,324 765,344" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="30" y="346" width="410" height="82" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
<text x="235" y="372" text-anchor="middle" font-size="13.5" fill="#92400e" font-weight="bold">Tool 경로  (ACCOUNT · STOCK · EXCHANGE)</text>
<text x="235" y="396" text-anchor="middle" font-size="12.5" fill="#0f172a">Tool 실행 → 답 1개</text>
<text x="235" y="416" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">iter((&quot;답변&quot;,))</text>
<rect x="560" y="346" width="410" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<text x="765" y="372" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="bold">LLM 경로  (FINANCE · GENERAL)</text>
<text x="765" y="396" text-anchor="middle" font-size="12.5" fill="#0f172a">OpenAI stream=True → 조각 여러 개</text>
<text x="765" y="416" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">stream_llm()</text>
<polyline points="235,428 235,456 400,456 400,472" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="765,428 765,456 600,456 600,472" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="250" y="474" width="500" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/>
<text x="500" y="498" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">Iterator[str]</text>
<text x="500" y="517" text-anchor="middle" font-size="11.5" fill="#0f172a">두 경로가 같은 모양이라 같은 코드로 이어 쓸 수 있다</text>
<line x1="500" y1="526" x2="500" y2="550" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="250" y="552" width="500" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
<text x="500.0" y="576" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">events() 제너레이터</text>
<text x="500.0" y="595" text-anchor="middle" font-size="12" fill="#0f172a">조각마다 SSE 이벤트로 포장 (category → token… → done / error)</text>
<line x1="500" y1="604" x2="500" y2="628" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="150" y="630" width="700" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
<text x="500.0" y="654" text-anchor="middle" font-size="14" fill="#075985" font-weight="bold">StreamingResponse  →  브라우저</text>
<text x="500.0" y="673" text-anchor="middle" font-size="12" fill="#0f172a">조각이 나올 때마다 하나씩 흘려보내 글자가 한 자씩 표시된다</text>
</svg>
