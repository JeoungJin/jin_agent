<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="860" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">★ 꼭 이해하기 (개념) — 면접에서도 나옵니다</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">코드를 외우지 말고, 이 5가지를 자기 말로 설명할 수 있으면 충분합니다</text>
<rect x="20" y="92" width="340" height="340" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<rect x="20" y="92" width="340" height="36" rx="10" fill="#0284c7"/><rect x="20" y="116" width="340" height="12" fill="#0284c7"/><text x="190.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">① 실행은 LLM이 아니라 우리 서버</text>
<rect x="40" y="150" width="110" height="40" rx="8" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
<text x="95" y="175" text-anchor="middle" font-size="14" fill="#075985" font-weight="bold">LLM</text>
<rect x="230" y="150" width="110" height="40" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="285" y="175" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">우리 서버</text>
<line x1="150" y1="160" x2="230" y2="160" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<text x="190" y="152" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="bold">요청</text>
<line x1="230" y1="182" x2="150" y2="182" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<text x="190" y="200" text-anchor="middle" font-size="11" fill="#166534" font-weight="bold">결과</text>
<text x="40" y="232" text-anchor="start" font-size="12" fill="#dc2626" font-weight="bold">✗ LLM이 함수를 직접 실행하지 않는다</text>
<text x="40" y="254" text-anchor="start" font-size="12" fill="#0f172a">✔ "get_per를 이 인자로 불러줘"라는</text>
<text x="40" y="272" text-anchor="start" font-size="12" fill="#0f172a">   요청서(tool_calls)만 만든다</text>
<text x="40" y="296" text-anchor="start" font-size="12" fill="#0f172a">✔ 실행과 결과 전달은 서버 코드가 한다</text>
<rect x="40" y="366" width="300" height="52" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="50" y="387" text-anchor="start" font-size="12" fill="#854d0e" font-weight="bold">면접  "LLM이 함수를 직접 실행하나요?"</text>
<text x="50" y="407" text-anchor="start" font-size="12" fill="#475569">→ 아니요, 요청만 하고 실행은 서버</text>
<rect x="390" y="92" width="340" height="340" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<rect x="390" y="92" width="340" height="36" rx="10" fill="#7c3aed"/><rect x="390" y="116" width="340" height="12" fill="#7c3aed"/><text x="560.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">② description이 선택 기준</text>
<rect x="410" y="150" width="300" height="112" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="422" y="172" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">"name": "get_per",</text>
<rect x="418" y="180" width="284" height="38" rx="4" fill="#fde68a" stroke="#fde68a" stroke-width="1"/>
<text x="424" y="196" text-anchor="start" font-size="11" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">"description": "국내 종목의 PER 조회.</text>
<text x="424" y="212" text-anchor="start" font-size="11" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">  PER·밸류에이션 질문에 사용",</text>
<text x="422" y="240" text-anchor="start" font-size="12" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">"parameters": { … }</text>
<text x="410" y="286" text-anchor="start" font-size="12" fill="#dc2626" font-weight="bold">✗ 설명이 모호 → 엉뚱한 도구를 고른다</text>
<text x="410" y="308" text-anchor="start" font-size="12" fill="#0f172a">✔ "언제 쓰는지"를 구체적으로 쓴다</text>
<rect x="410" y="366" width="300" height="52" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="420" y="387" text-anchor="start" font-size="12" fill="#854d0e" font-weight="bold">면접  "LLM은 도구를 어떻게 고르나요?"</text>
<text x="420" y="407" text-anchor="start" font-size="12" fill="#475569">→ 스키마의 이름·설명·인자를 읽고 판단</text>
<rect x="760" y="92" width="340" height="340" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="760" y="92" width="340" height="36" rx="10" fill="#16a34a"/><rect x="760" y="116" width="340" height="12" fill="#16a34a"/><text x="930.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">③ 도구 요청이 없을 때까지 반복</text>
<rect x="780" y="150" width="80" height="40" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="820" y="175" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">LLM 호출</text>
<rect x="890" y="150" width="80" height="40" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="930" y="175" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">도구 실행</text>
<rect x="1000" y="150" width="80" height="40" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="1040" y="175" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">결과 전달</text>
<line x1="860" y1="170" x2="890" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="970" y1="170" x2="1000" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="1040,190 1040,214 820,214 820,192" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="930" y="208" text-anchor="middle" font-size="10" fill="#166534">다시 LLM에게</text>
<rect x="780" y="232" width="300" height="40" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="930" y="250" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">tool_calls 가 없으면 → 그것이 최종 답변</text>
<text x="930" y="266" text-anchor="middle" font-size="11" fill="#475569">(반복 종료)</text>
<text x="780" y="300" text-anchor="start" font-size="12" fill="#0f172a" font-weight="bold">최대 반복 횟수(MAX_TOOL_ROUNDS)로 제한</text>
<text x="780" y="320" text-anchor="start" font-size="11" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">if not msg.tool_calls: return msg.content</text>
<rect x="780" y="366" width="300" height="52" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="790" y="387" text-anchor="start" font-size="12" fill="#854d0e" font-weight="bold">면접  "반복은 언제 끝나나요?"</text>
<text x="790" y="407" text-anchor="start" font-size="12" fill="#475569">→ 도구 요청이 없는 응답 = 최종 답변</text>
<rect x="20" y="452" width="530" height="340" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="20" y="452" width="530" height="36" rx="10" fill="#dc2626"/><rect x="20" y="476" width="530" height="12" fill="#dc2626"/><text x="285.0" y="477" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">④ 안전장치 3가지</text>
<rect x="40" y="506" width="140" height="52" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="110" y="537" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">최대 반복 횟수</text>
<rect x="188" y="506" width="340" height="52" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="198" y="528" text-anchor="start" font-size="11" fill="#7f1d1d">도구 호출이 끝나지 않아도 정해진 횟수에서</text>
<text x="198" y="546" text-anchor="start" font-size="11" fill="#7f1d1d">멈춘다 (무한 루프·비용 방지)</text>
<rect x="40" y="582" width="140" height="52" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="110" y="613" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">잘못된 인자 처리</text>
<rect x="188" y="582" width="340" height="52" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="198" y="604" text-anchor="start" font-size="11" fill="#7f1d1d">JSON이 깨져도 서버는 죽지 않고</text>
<text x="198" y="622" text-anchor="start" font-size="11" fill="#7f1d1d">오류 문자열을 결과로 돌려준다</text>
<rect x="40" y="658" width="140" height="52" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="110" y="689" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">user_id는 서버가 주입</text>
<rect x="188" y="658" width="340" height="52" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="198" y="680" text-anchor="start" font-size="11" fill="#7f1d1d">LLM이 정하면 프롬프트 인젝션으로</text>
<text x="198" y="698" text-anchor="start" font-size="11" fill="#7f1d1d"> 남의 계좌를 볼 수 있다 → 도구에 user_id 인자 없음</text>
<rect x="40" y="734" width="490" height="52" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="50" y="755" text-anchor="start" font-size="12" fill="#854d0e" font-weight="bold">면접  "user_id를 LLM 인자로 받으면 어떤 문제가?"</text>
<text x="50" y="775" text-anchor="start" font-size="12" fill="#475569">→ 프롬프트 인젝션으로 타인 정보 조회. 서버가 로그인 값으로 주입</text>
<rect x="570" y="452" width="530" height="340" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<rect x="570" y="452" width="530" height="36" rx="10" fill="#ca8a04"/><rect x="570" y="476" width="530" height="12" fill="#ca8a04"/><text x="835.0" y="477" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">⑤ tool 이벤트가 필요한 이유</text>
<text x="590" y="510" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">tool 이벤트 없이</text>
<rect x="590" y="520" width="490" height="26" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
<text x="730" y="538" text-anchor="middle" font-size="11" fill="#6b7280">화면이 멈춘 것처럼 보임 (침묵)</text>
<rect x="870" y="520" width="210" height="26" rx="6" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
<text x="975" y="538" text-anchor="middle" font-size="11" fill="#4c1d95">답변 글자</text>
<text x="590" y="580" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">tool 이벤트가 있으면</text>
<rect x="590" y="590" width="180" height="26" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
<text x="680" y="608" text-anchor="middle" font-size="11" fill="#14532d">주가 조회 중…</text>
<rect x="774" y="590" width="100" height="26" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
<text x="824" y="608" text-anchor="middle" font-size="11" fill="#14532d">완료</text>
<rect x="878" y="590" width="202" height="26" rx="6" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
<text x="979" y="608" text-anchor="middle" font-size="11" fill="#4c1d95">답변 글자</text>
<text x="590" y="648" text-anchor="start" font-size="12" fill="#0f172a">✔ 사용자가 진행 상황을 본다</text>
<text x="590" y="670" text-anchor="start" font-size="12" fill="#0f172a">✔ 서버 사이 타임아웃(이벤트 간격)이 초기화된다</text>
<rect x="590" y="734" width="490" height="52" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="600" y="755" text-anchor="start" font-size="12" fill="#854d0e" font-weight="bold">면접  "스트리밍 중 도구 실행 상태를 왜 보내나요?"</text>
<text x="600" y="775" text-anchor="start" font-size="12" fill="#475569">→ 침묵 구간 해소와 타임아웃 방지</text>
</svg>
