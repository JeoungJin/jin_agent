<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="880" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">PII 마스킹 — 핵심 개념</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">★ 꼭 이해하기 (개념)   ○ 흐름만 이해하기 (구조)   △ AI에게 맡기기 (세부)</text>
<rect x="30" y="92" width="1060" height="34" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<text x="48" y="115" text-anchor="start" font-size="16" fill="#fff" font-weight="bold">★ 꼭 이해하기 (개념)</text>
<rect x="30" y="136" width="346" height="176" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<rect x="30" y="136" width="346" height="32" rx="10" fill="#dc2626"/><rect x="30" y="156" width="346" height="12" fill="#dc2626"/><text x="203.0" y="157" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">① PII 란?</text>
<text x="44" y="194" text-anchor="start" font-size="13" fill="#334155">개인을 알아볼 수 있는 정보</text>
<text x="44" y="217" text-anchor="start" font-size="13" fill="#334155">이름 · 주민번호 · 전화번호</text>
<text x="44" y="240" text-anchor="start" font-size="13" fill="#334155">계좌번호 · 카드번호 · 잔액</text>
<text x="44" y="263" text-anchor="start" font-size="13" fill="#334155">여러 개를 합쳐 식별돼도 PII</text>
<text x="44" y="286" text-anchor="start" font-size="13" fill="#334155">금융은 유출 한 건이 치명적</text>
<rect x="397" y="136" width="346" height="176" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<rect x="397" y="136" width="346" height="32" rx="10" fill="#dc2626"/><rect x="397" y="156" width="346" height="12" fill="#dc2626"/><text x="570.0" y="157" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">② 왜 마스킹하나?</text>
<text x="411" y="194" text-anchor="start" font-size="13" fill="#334155">질문이 외부 AI 로 전송된다</text>
<text x="411" y="217" text-anchor="start" font-size="13" fill="#334155">로그 · 대화 기록에 그대로 남는다</text>
<text x="411" y="240" text-anchor="start" font-size="13" fill="#334155">AI 답변에 필요한 정보가 아니다</text>
<text x="411" y="263" text-anchor="start" font-size="13" fill="#334155">→ 데이터 최소화</text>
<text x="411" y="286" text-anchor="start" font-size="13" fill="#334155">   안 보내는 것이 가장 안전</text>
<rect x="764" y="136" width="326" height="176" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<rect x="764" y="136" width="326" height="32" rx="10" fill="#dc2626"/><rect x="764" y="156" width="326" height="12" fill="#dc2626"/><text x="927.0" y="157" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">③ 마스킹 · 가명 · 익명</text>
<text x="778" y="194" text-anchor="start" font-size="13" fill="#334155">삭제: 제거 (맥락 손실)</text>
<text x="778" y="217" text-anchor="start" font-size="13" fill="#334155">마스킹: 일부만 가림</text>
<text x="778" y="240" text-anchor="start" font-size="13" fill="#334155" font-family="Consolas,'DejaVu Sans Mono',monospace">   900101-1******</text>
<text x="778" y="263" text-anchor="start" font-size="13" fill="#334155">토큰화: [ACCOUNT_1], 원본 별도</text>
<text x="778" y="286" text-anchor="start" font-size="13" fill="#334155">익명화: 되돌릴 수 없음</text>
<rect x="30" y="328" width="525" height="176" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<rect x="30" y="328" width="525" height="32" rx="10" fill="#dc2626"/><rect x="30" y="348" width="525" height="12" fill="#dc2626"/><text x="292.5" y="349" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">④ 검사 순서: 구체적인 것 먼저</text>
<text x="44" y="386" text-anchor="start" font-size="13" fill="#334155">주민번호 → 전화번호 → 계좌번호</text>
<text x="44" y="409" text-anchor="start" font-size="13" fill="#334155">계좌 패턴은 느슨해서 다른 PII 를 삼킨다</text>
<text x="44" y="432" text-anchor="start" font-size="13" fill="#334155" font-family="Consolas,'DejaVu Sans Mono',monospace">010-1234-5678 이 계좌로 오분류</text>
<text x="44" y="455" text-anchor="start" font-size="13" fill="#334155">→ 마스킹 형식 · 탐지 기록이 틀어진다</text>
<text x="44" y="478" text-anchor="start" font-size="13" fill="#334155">앞뒤 숫자 경계로 일부만 잡히는 것 방지</text>
<rect x="575" y="328" width="515" height="176" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<rect x="575" y="328" width="515" height="32" rx="10" fill="#dc2626"/><rect x="575" y="348" width="515" height="12" fill="#dc2626"/><text x="832.5" y="349" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">⑤ 정규식의 한계</text>
<text x="589" y="386" text-anchor="start" font-size="13" fill="#334155">이름 · 주소 · 문장 속 정보는 놓친다 (미탐)</text>
<text x="589" y="409" text-anchor="start" font-size="13" fill="#334155">일반 숫자를 PII 로 잘못 잡는다 (오탐)</text>
<text x="589" y="432" text-anchor="start" font-size="13" fill="#334155" font-family="Consolas,'DejaVu Sans Mono',monospace">2024-05-01 같은 날짜, 주문번호</text>
<text x="589" y="455" text-anchor="start" font-size="13" fill="#334155">보완: 형식 검증 + NER 모델 + 접근 통제</text>
<text x="589" y="478" text-anchor="start" font-size="13" fill="#334155">마스킹은 수단 하나일 뿐</text>
<rect x="30" y="524" width="1060" height="34" rx="8" fill="#ea580c" stroke="#ea580c" stroke-width="0"/>
<text x="48" y="547" text-anchor="start" font-size="16" fill="#fff" font-weight="bold">○ 흐름만 이해하기 (구조) — 나가는 4지점</text>
<rect x="30" y="570" width="250" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="155" y="596" text-anchor="middle" font-size="15" fill="#c2410c" font-weight="bold">① 입력</text>
<text x="155" y="620" text-anchor="middle" font-size="13" fill="#334155">LLM 호출 직전</text>
<text x="155" y="642" text-anchor="middle" font-size="12" fill="#64748b">질문 + 이전 대화</text>
<line x1="280" y1="616" x2="300" y2="616" stroke="#ea580c" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="300" y="570" width="250" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="425" y="596" text-anchor="middle" font-size="15" fill="#c2410c" font-weight="bold">② 도구 결과</text>
<text x="425" y="620" text-anchor="middle" font-size="13" fill="#334155">LLM 에 넘기기 전</text>
<text x="425" y="642" text-anchor="middle" font-size="12" fill="#64748b">필요한 값만</text>
<line x1="550" y1="616" x2="570" y2="616" stroke="#ea580c" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="570" y="570" width="250" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="695" y="596" text-anchor="middle" font-size="15" fill="#c2410c" font-weight="bold">③ 출력</text>
<text x="695" y="620" text-anchor="middle" font-size="13" fill="#334155">내보내기 직전</text>
<text x="695" y="642" text-anchor="middle" font-size="12" fill="#64748b">AI 가 되풀이할 수 있음</text>
<line x1="820" y1="616" x2="840" y2="616" stroke="#ea580c" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="840" y="570" width="250" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="965" y="596" text-anchor="middle" font-size="15" fill="#c2410c" font-weight="bold">④ 저장 · 로그</text>
<text x="965" y="620" text-anchor="middle" font-size="13" fill="#334155">기록하기 직전</text>
<text x="965" y="642" text-anchor="middle" font-size="12" fill="#64748b">원문 대신 마스킹본</text>
<text x="560" y="688" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="bold">한 곳만 막지 않는다 → 나가는 곳마다 한 겹씩 (다층 방어)</text>
<rect x="30" y="712" width="1060" height="34" rx="8" fill="#64748b" stroke="#64748b" stroke-width="0"/>
<text x="48" y="735" text-anchor="start" font-size="16" fill="#fff" font-weight="bold">△ AI 에게 맡기기 (세부)</text>
<rect x="30" y="756" width="1060" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="50" y="786" text-anchor="start" font-size="13" fill="#334155">· 정규식 세부 패턴 작성 · 주민번호 월/일 검증 코드</text>
<text x="50" y="810" text-anchor="start" font-size="13" fill="#334155">· 마스킹 함수 · 스트리밍 조각 버퍼 구현</text>
<text x="50" y="834" text-anchor="start" font-size="13" fill="#334155">· 테스트 코드 작성 · 로그 필터 연결</text>
<text x="1070" y="786" text-anchor="end" font-size="13" fill="#475569" font-weight="bold">직접 확인할 것:</text>
<text x="1070" y="810" text-anchor="end" font-size="13" fill="#475569">순서(주민 → 전화 → 계좌)와 숫자 경계가</text>
<text x="1070" y="834" text-anchor="end" font-size="13" fill="#475569">지켜졌는가</text>
</svg>
