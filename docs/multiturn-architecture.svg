<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="930" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">3-tier 에서 대화 기억은 누가 갖나</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">대화 기록은 Spring 이 보관하고, FastAPI 는 매번 받은 history 로만 일한다 (무상태)</text>
<rect x="20" y="92" width="230" height="300" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<rect x="20" y="92" width="230" height="36" rx="10" fill="#0284c7"/><rect x="20" y="116" width="230" height="12" fill="#0284c7"/><text x="135.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">React :5173</text>
<rect x="300" y="92" width="290" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="300" y="92" width="290" height="36" rx="10" fill="#16a34a"/><rect x="300" y="116" width="290" height="12" fill="#16a34a"/><text x="445.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Spring :8000</text>
<rect x="640" y="92" width="230" height="300" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<rect x="640" y="92" width="230" height="36" rx="10" fill="#7c3aed"/><rect x="640" y="116" width="230" height="12" fill="#7c3aed"/><text x="755.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">FastAPI :9000</text>
<rect x="920" y="92" width="180" height="300" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<rect x="920" y="92" width="180" height="36" rx="10" fill="#ca8a04"/><rect x="920" y="116" width="180" height="12" fill="#ca8a04"/><text x="1010.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">LLM (OpenAI)</text>
<text x="34" y="146" text-anchor="start" font-size="12" fill="#075985" font-weight="bold">상태</text>
<text x="34" y="168" text-anchor="start" font-size="12" fill="#0f172a">• messages (화면 표시용)</text>
<text x="34" y="190" text-anchor="start" font-size="12" fill="#0f172a">• conversationId (UUID)</text>
<text x="34" y="212" text-anchor="start" font-size="12" fill="#0f172a"></text>
<text x="34" y="234" text-anchor="start" font-size="12" fill="#075985" font-weight="bold">요청 본문</text>
<text x="34" y="256" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">{ question, conversationId }</text>
<text x="34" y="278" text-anchor="start" font-size="12" fill="#0f172a"></text>
<text x="34" y="300" text-anchor="start" font-size="12" fill="#075985" font-weight="bold">새 대화 버튼</text>
<text x="34" y="322" text-anchor="start" font-size="12" fill="#0f172a">→ 새 conversationId 발급</text>
<text x="34" y="344" text-anchor="start" font-size="12" fill="#0f172a">→ 화면 messages 비움</text>
<text x="314" y="146" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">대화 저장소 (메모리)</text>
<text x="314" y="168" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">key = (userId, conversationId)</text>
<text x="314" y="190" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">value = [user, assistant, …]</text>
<text x="314" y="212" text-anchor="start" font-size="12" fill="#0f172a"></text>
<text x="314" y="234" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">규칙</text>
<text x="314" y="256" text-anchor="start" font-size="12" fill="#0f172a">• 최근 N개만 유지, 오래된 것 삭제</text>
<text x="314" y="278" text-anchor="start" font-size="12" fill="#0f172a">• 유휴 시간(TTL) 지나면 만료</text>
<text x="314" y="300" text-anchor="start" font-size="12" fill="#0f172a">• 성공한 턴만 저장 (오류는 저장 X)</text>
<text x="314" y="322" text-anchor="start" font-size="12" fill="#0f172a">• 스트림은 token 을 모아 done 에서 저장</text>
<text x="654" y="146" text-anchor="start" font-size="12" fill="#5b21b6" font-weight="bold">무상태 (stateless)</text>
<text x="654" y="168" text-anchor="start" font-size="12" fill="#0f172a"></text>
<text x="654" y="190" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">messages =</text>
<text x="654" y="212" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">[system]</text>
<text x="654" y="234" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">+ history</text>
<text x="654" y="256" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono',monospace">+ [현재 질문]</text>
<text x="654" y="278" text-anchor="start" font-size="12" fill="#0f172a"></text>
<text x="654" y="300" text-anchor="start" font-size="12" fill="#5b21b6" font-weight="bold">history 검증</text>
<text x="654" y="322" text-anchor="start" font-size="12" fill="#0f172a">• 역할은 user / assistant</text>
<text x="654" y="344" text-anchor="start" font-size="12" fill="#0f172a">• 개수 · 길이 제한</text>
<text x="934" y="146" text-anchor="start" font-size="12" fill="#854d0e" font-weight="bold">messages 전체를</text>
<text x="934" y="168" text-anchor="start" font-size="12" fill="#0f172a">한 번에 받아서</text>
<text x="934" y="190" text-anchor="start" font-size="12" fill="#0f172a">문맥을 이해하고</text>
<text x="934" y="212" text-anchor="start" font-size="12" fill="#0f172a">답변 작성</text>
<text x="934" y="234" text-anchor="start" font-size="12" fill="#0f172a"></text>
<text x="934" y="256" text-anchor="start" font-size="12" fill="#0f172a">(Function Calling 이면</text>
<text x="934" y="278" text-anchor="start" font-size="12" fill="#0f172a">도구 호출 포함)</text>
<line x1="250" y1="190" x2="300" y2="190" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="275.0" cy="174" r="11" fill="#0f172a"/><text x="275.0" y="178" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
<line x1="590" y1="230" x2="640" y2="230" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="615.0" cy="214" r="11" fill="#0f172a"/><text x="615.0" y="218" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
<line x1="870" y1="230" x2="920" y2="230" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="895.0" cy="214" r="11" fill="#0f172a"/><text x="895.0" y="218" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
<line x1="300" y1="350" x2="250" y2="350" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<line x1="640" y1="350" x2="590" y2="350" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<line x1="920" y1="350" x2="870" y2="350" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<circle cx="575" cy="334" r="11" fill="#0f172a"/><text x="575" y="338" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">5</text>
<rect x="20" y="408" width="1080" height="100" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="36" y="430" text-anchor="start" font-size="13" fill="#0f172a" font-weight="bold">한 번의 대화 흐름</text>
<circle cx="50" cy="448" r="11" fill="#0f172a"/><text x="50" y="452" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
<text x="68" y="452" text-anchor="start" font-size="11" fill="#0f172a">React → Spring : { question, conversationId } + 쿠키(로그인)</text>
<circle cx="50" cy="472" r="11" fill="#0f172a"/><text x="50" y="476" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
<text x="68" y="476" text-anchor="start" font-size="11" fill="#0f172a">Spring : (userId, conversationId) 로 저장소에서 history 조회 → 최근 N개로 자르기</text>
<circle cx="50" cy="496" r="11" fill="#0f172a"/><text x="50" y="500" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
<text x="68" y="500" text-anchor="start" font-size="11" fill="#0f172a">Spring → FastAPI : { question, user_id, history }</text>
<circle cx="590" cy="448" r="11" fill="#0f172a"/><text x="590" y="452" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
<text x="608" y="452" text-anchor="start" font-size="11" fill="#0f172a">FastAPI → LLM : messages = system + history + 현재 질문</text>
<circle cx="590" cy="472" r="11" fill="#0f172a"/><text x="590" y="476" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">5</text>
<text x="608" y="476" text-anchor="start" font-size="11" fill="#0f172a">LLM → FastAPI → Spring → React : 답변 (JSON 또는 SSE)</text>
<circle cx="590" cy="496" r="11" fill="#0f172a"/><text x="590" y="500" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">6</text>
<text x="608" y="500" text-anchor="start" font-size="11" fill="#0f172a">Spring : 질문 + 최종 답변을 저장소에 추가 (스트림이면 token 을 모아 done 에서)</text>
<rect x="20" y="528" width="540" height="382" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<rect x="20" y="528" width="540" height="34" rx="10" fill="#475569"/><rect x="20" y="550" width="540" height="12" fill="#475569"/><text x="290.0" y="551" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">대화가 길어지면 : 최근 N개만 보낸다</text>
<rect x="40" y="584" width="64" height="40" rx="6" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"/>
<text x="72" y="609" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">턴 1</text>
<rect x="112" y="584" width="64" height="40" rx="6" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"/>
<text x="144" y="609" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">턴 2</text>
<rect x="184" y="584" width="64" height="40" rx="6" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"/>
<text x="216" y="609" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">턴 3</text>
<rect x="256" y="584" width="64" height="40" rx="6" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="288" y="609" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">턴 4</text>
<rect x="328" y="584" width="64" height="40" rx="6" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="360" y="609" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">턴 5</text>
<rect x="400" y="584" width="64" height="40" rx="6" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="432" y="609" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">턴 6</text>
<rect x="472" y="584" width="64" height="40" rx="6" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="504" y="609" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">턴 7</text>
<line x1="256" y1="574" x2="256" y2="634" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="40" y="644" text-anchor="start" font-size="11" fill="#6b7280" font-weight="bold">← 오래된 턴: 버림 (또는 요약)</text>
<text x="300" y="644" text-anchor="start" font-size="11" fill="#166534" font-weight="bold">최근 N턴: LLM 에 전달 →</text>
<text x="40" y="684" text-anchor="start" font-size="12" fill="#0f172a">• 컨텍스트 윈도우(한 번에 처리할 수 있는 길이)에는 한도가 있다</text>
<text x="40" y="710" text-anchor="start" font-size="12" fill="#0f172a">• 보내는 양이 늘수록 비용 · 응답 지연이 늘어난다</text>
<text x="40" y="736" text-anchor="start" font-size="12" fill="#0f172a">• 가장 단순한 방법 : 최근 N개 유지 (예: 10개 메시지)</text>
<text x="40" y="762" text-anchor="start" font-size="12" fill="#0f172a">• 발전 방법 : 오래된 대화를 LLM 으로 요약해 한 덩어리로 유지</text>
<text x="40" y="788" text-anchor="start" font-size="12" fill="#0f172a">• Tool 호출 중간 과정은 저장하지 않는다 (최종 답변만)</text>
<rect x="40" y="824" width="500" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="54" y="844" text-anchor="start" font-size="12" fill="#854d0e" font-weight="bold">시세는 계속 변한다 → system 지시</text>
<text x="54" y="864" text-anchor="start" font-size="11" fill="#422006">"이전 대화의 시세·잔액은 오래됐을 수 있으니 필요하면 도구로 다시 조회"</text>
<rect x="580" y="528" width="520" height="382" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="580" y="528" width="520" height="34" rx="10" fill="#dc2626"/><rect x="580" y="550" width="520" height="12" fill="#dc2626"/><text x="840.0" y="551" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">지켜야 할 규칙</text>
<rect x="596" y="578" width="488" height="54" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="610" y="600" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">대화는 사용자별로 분리</text>
<text x="610" y="620" text-anchor="start" font-size="11" fill="#475569">key 에 userId 포함 → 남의 conversationId 를 알아도 접근 불가</text>
<rect x="596" y="640" width="488" height="54" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="610" y="662" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">클라이언트가 보낸 history 불신</text>
<text x="610" y="682" text-anchor="start" font-size="11" fill="#475569">React 는 conversationId 만 보낸다 (위조 · 프롬프트 주입 방지)</text>
<rect x="596" y="702" width="488" height="54" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="610" y="724" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">conversationId 검증</text>
<text x="610" y="744" text-anchor="start" font-size="11" fill="#475569">UUID 형식 · 길이 확인, 사용자당 대화 수 제한</text>
<rect x="596" y="764" width="488" height="54" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="610" y="786" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">용량 제한</text>
<text x="610" y="806" text-anchor="start" font-size="11" fill="#475569">대화당 최대 메시지 수 · 글자 수, 유휴 시간 후 삭제</text>
<rect x="596" y="826" width="488" height="54" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="610" y="848" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">저장소의 한계</text>
<text x="610" y="868" text-anchor="start" font-size="11" fill="#475569">메모리 저장 → 서버 재시작 시 사라짐 (다음 단계: Redis · DB)</text>
</svg>
