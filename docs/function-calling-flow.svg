<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="860" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Function Calling 왕복 흐름</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">LLM 은 Tool 을 "요청"만 하고, 실행과 결과 전달은 우리 서버가 한다</text>
<rect x="30" y="92" width="180" height="40" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="120" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">FastAPI (우리 서버)</text>
<line x1="120" y1="132" x2="120" y2="810" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="270" y="92" width="180" height="40" rx="10" fill="#0284c7" stroke="#0284c7" stroke-width="1"/>
<text x="360" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">LLM (OpenAI)</text>
<line x1="360" y1="132" x2="360" y2="810" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="510" y="92" width="180" height="40" rx="10" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<text x="600" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Tool 함수 (우리 코드)</text>
<line x1="600" y1="132" x2="600" y2="810" stroke="#94a3b8" stroke-dasharray="4 4"/>
<line x1="120" y1="176" x2="360" y2="176" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<text x="240.0" y="168" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">① 질문 + Tool 목록(스키마) 전달</text>
<text x="240.0" y="194" text-anchor="middle" font-size="11" fill="#475569">messages=[user]  tools=[get_stock_price, get_per]</text>
<rect x="250" y="214" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="360" y="235" text-anchor="middle" font-size="12" fill="#075985" font-weight="bold">LLM : 질문을 읽고 판단</text>
<text x="360" y="253" text-anchor="middle" font-size="11" fill="#075985">"주가 Tool + PER Tool 둘 다 필요"</text>
<line x1="360" y1="312" x2="120" y2="312" stroke="#0284c7" stroke-width="2.2" marker-end="url(#a)"/>
<text x="240.0" y="304" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">② Tool 호출 요청 (실행 아님)</text>
<text x="240.0" y="330" text-anchor="middle" font-size="11" fill="#475569">tool_calls: get_stock_price(삼성전자), get_per(삼성전자)</text>
<rect x="150" y="352" width="200" height="32" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="250" y="373" text-anchor="middle" font-size="11" fill="#854d0e">id · name · arguments(JSON)</text>
<line x1="120" y1="430" x2="600" y2="430" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<text x="360.0" y="422" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">③ 요청된 Tool 을 우리 코드가 실제로 실행</text>
<text x="360.0" y="448" text-anchor="middle" font-size="11" fill="#475569">get_stock_price("삼성전자")  ·  get_per("삼성전자")</text>
<line x1="600" y1="486" x2="120" y2="486" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<text x="360" y="478" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">결과 문자열/JSON 반환</text>
<text x="360" y="504" text-anchor="middle" font-size="11" fill="#475569">71,000원 (+1.43%)   /   PER 12.3배</text>
<line x1="120" y1="560" x2="360" y2="560" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<text x="240.0" y="552" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">④ 결과를 LLM 에게 다시 전달</text>
<text x="240.0" y="578" text-anchor="middle" font-size="11" fill="#475569">messages += assistant(tool_calls) + tool 결과 × 2  (role:"tool", tool_call_id)</text>
<rect x="250" y="598" width="220" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="360" y="620" text-anchor="middle" font-size="12" fill="#075985" font-weight="bold">LLM : 두 결과를 합쳐 답변 작성</text>
<line x1="360" y1="676" x2="120" y2="676" stroke="#0284c7" stroke-width="2.2" marker-end="url(#a)"/>
<text x="240.0" y="668" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">⑤ 최종 자연어 답변</text>
<text x="240.0" y="694" text-anchor="middle" font-size="11" fill="#475569">"삼성전자 현재가 71,000원(+1.43%), PER 12.3배입니다."</text>
<rect x="20" y="730" width="660" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="350" y="754" text-anchor="middle" font-size="12" fill="#854d0e" font-weight="bold">Tool 호출이 더 필요하면 ②~④ 를 반복한다 (무한 반복 방지: 최대 반복 횟수 제한)</text>
<text x="350" y="778" text-anchor="middle" font-size="12" fill="#854d0e">Tool 호출이 없는 응답이 오면 그것이 최종 답변이다</text>
<rect x="720" y="92" width="380" height="300" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="740" y="116" text-anchor="start" font-size="13" fill="#93c5fd" font-weight="bold">Tool 스키마 (LLM 에게 주는 설명서)</text>
<text x="740" y="142" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">{ "type": "function",</text>
<text x="740" y="163" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">  "function": {</text>
<text x="740" y="184" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">    "name": "get_per",</text>
<text x="740" y="205" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">    "description": "종목의 PER 조회",</text>
<text x="740" y="226" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">    "parameters": {</text>
<text x="740" y="247" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">      "type": "object",</text>
<text x="740" y="268" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">      "properties": {"name": {"type":"string"}},</text>
<text x="740" y="289" text-anchor="start" font-size="11" fill="#e2e8f0" font-family="Consolas,'DejaVu Sans Mono',monospace">      "required": ["name"] } } }</text>
<text x="740" y="336" text-anchor="start" font-size="12" fill="#fde68a">description 이 곧 "언제 이 Tool 을 쓸지"의 기준</text>
<text x="740" y="358" text-anchor="start" font-size="12" fill="#fde68a">→ 설명이 모호하면 LLM 이 Tool 을 잘못 고른다</text>
<rect x="720" y="412" width="380" height="226" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="720" y="412" width="380" height="34" rx="10" fill="#dc2626"/><rect x="720" y="434" width="380" height="12" fill="#dc2626"/><text x="910.0" y="435" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">보안 : 이것만은 서버가 결정한다</text>
<text x="738" y="468" text-anchor="start" font-size="12" fill="#7f1d1d">• user_id 는 Tool 인자로 LLM 이 정하게 두지 않는다</text>
<text x="738" y="492" text-anchor="start" font-size="12" fill="#7f1d1d">   (프롬프트 인젝션으로 남의 계좌 조회 위험)</text>
<text x="738" y="516" text-anchor="start" font-size="12" fill="#7f1d1d">   → 서버가 로그인 사용자(JWT) 값으로 주입</text>
<text x="738" y="540" text-anchor="start" font-size="12" fill="#7f1d1d">• 계좌 같은 민감 Tool 은 토큰 사용자와 대상 확인</text>
<text x="738" y="564" text-anchor="start" font-size="12" fill="#7f1d1d">• Tool 실행 결과도 "데이터"로만 다룬다</text>
<text x="738" y="588" text-anchor="start" font-size="12" fill="#7f1d1d">• 최대 반복 횟수 · 타임아웃 · 로그 기록</text>
<rect x="720" y="658" width="380" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="910" y="682" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">기억할 한 줄</text>
<text x="910" y="706" text-anchor="middle" font-size="12" fill="#14532d">LLM 은 "고르고 · 인자를 채우고 · 마지막에 정리"</text>
<text x="910" y="728" text-anchor="middle" font-size="12" fill="#14532d">Tool 의 실행 · 권한 · 안전은 우리 코드의 책임</text>
</svg>
