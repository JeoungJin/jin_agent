<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="800" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">프롬프트 고도화 : Few-shot 으로 답변 형식 통일</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">코드와 API 는 그대로 두고, System Prompt 만 바꿔서 답변의 질을 올린다</text>
<rect x="20" y="92" width="520" height="400" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="20" y="92" width="520" height="36" rx="10" fill="#dc2626"/><rect x="20" y="116" width="520" height="12" fill="#dc2626"/><text x="280.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Zero-shot : 지시만 준다</text>
<text x="40" y="150" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">System Prompt</text>
<rect x="40" y="158" width="480" height="34" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="280.0" y="179.0" text-anchor="middle" font-size="12" fill="#0f172a">"금융 용어를 쉽게 설명해줘"</text>
<text x="40" y="218" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">질문</text>
<rect x="40" y="226" width="200" height="30" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
<text x="140.0" y="245.0" text-anchor="middle" font-size="12" fill="#0f172a">PBR이 뭐야?</text>
<text x="40" y="284" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">같은 질문, 매번 다르게 나오는 답변</text>
<rect x="40" y="294" width="36" height="34" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="58" y="316" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">A</text>
<rect x="84" y="294" width="436" height="34" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="94" y="315.0" text-anchor="start" font-size="12" fill="#0f172a">길고 장황한 설명 (여러 문단, 용어 나열)</text>
<rect x="40" y="338" width="36" height="34" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="58" y="360" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">B</text>
<rect x="84" y="338" width="436" height="34" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="94" y="359.0" text-anchor="start" font-size="12" fill="#0f172a">한 줄 정의만 (예시·주의사항 없음)</text>
<rect x="40" y="382" width="36" height="34" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="58" y="404" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">C</text>
<rect x="84" y="382" width="436" height="34" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="94" y="403.0" text-anchor="start" font-size="12" fill="#0f172a">**PBR** - 목록 형태 (마크다운 기호가 화면에 노출)</text>
<text x="40" y="444" text-anchor="start" font-size="12" fill="#7f1d1d" font-weight="bold">✗ 형식이 들쭉날쭉해서 서비스 품질이 일정하지 않다</text>
<text x="40" y="466" text-anchor="start" font-size="12" fill="#7f1d1d">✗ 길이·톤·구성이 호출할 때마다 달라진다</text>
<rect x="580" y="92" width="520" height="400" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="580" y="92" width="520" height="36" rx="10" fill="#16a34a"/><rect x="580" y="116" width="520" height="12" fill="#16a34a"/><text x="840.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Few-shot : 원하는 답을 예시로 보여준다</text>
<text x="600" y="150" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">System Prompt  (규칙 + 예시 3개)</text>
<rect x="600" y="158" width="480" height="92" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="614" y="180" text-anchor="start" font-size="11" fill="#0f172a" font-weight="bold">질문: PER이 뭐야?</text>
<text x="790" y="180" text-anchor="start" font-size="11" fill="#166534">→ 답변: 정의 → 계산 예시 → 주의사항</text>
<text x="614" y="204" text-anchor="start" font-size="11" fill="#0f172a" font-weight="bold">질문: ROE가 뭐야?</text>
<text x="790" y="204" text-anchor="start" font-size="11" fill="#166534">→ 답변: 정의 → 계산 예시 → 주의사항</text>
<text x="614" y="228" text-anchor="start" font-size="11" fill="#0f172a" font-weight="bold">질문: 배당수익률이 뭐야?</text>
<text x="790" y="228" text-anchor="start" font-size="11" fill="#166534">→ 답변: 정의 → 계산 예시 → 주의사항</text>
<text x="600" y="276" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">질문</text>
<rect x="600" y="284" width="200" height="30" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
<text x="700.0" y="303.0" text-anchor="middle" font-size="12" fill="#0f172a">PBR이 뭐야?</text>
<text x="600" y="336" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">일관된 형식의 답변 (설명용 예시)</text>
<rect x="600" y="344" width="480" height="138" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<rect x="612" y="354" width="456" height="32" rx="6" fill="#dbeafe" stroke="#0284c7" stroke-width="1"/>
<text x="620" y="368" text-anchor="start" font-size="10" fill="#075985" font-weight="bold">정의</text>
<text x="656" y="368" text-anchor="start" font-size="11" fill="#0f172a">PBR(주가순자산비율)은 주가를 주당순자산으로 나눈 값입니다.</text>
<rect x="612" y="392" width="456" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
<text x="620" y="406" text-anchor="start" font-size="10" fill="#166534" font-weight="bold">계산</text>
<text x="656" y="406" text-anchor="start" font-size="11" fill="#0f172a">예를 들어 주가가 2만원이고 주당순자산이 1만원이면</text>
<text x="656" y="424" text-anchor="start" font-size="11" fill="#0f172a">PBR은 2입니다.</text>
<rect x="612" y="444" width="456" height="32" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="620" y="458" text-anchor="start" font-size="10" fill="#854d0e" font-weight="bold">주의</text>
<text x="656" y="458" text-anchor="start" font-size="11" fill="#0f172a">1보다 낮아도 무조건 저평가는 아니며 업종을 함께 봅니다.</text>
<rect x="20" y="512" width="1080" height="270" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<rect x="20" y="512" width="1080" height="36" rx="10" fill="#ca8a04"/><rect x="20" y="536" width="1080" height="12" fill="#ca8a04"/><text x="560.0" y="537" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">System Prompt 의 구성 요소  (우리 챗봇에 대입하면)</text>
<rect x="40" y="566" width="245" height="150" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="162" y="590" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="bold">① 역할</text>
<text x="162" y="610" text-anchor="middle" font-size="11" fill="#475569">누구인가</text>
<text x="162" y="640" text-anchor="middle" font-size="12" fill="#0f172a">금융 도우미</text>
<line x1="285" y1="640" x2="305" y2="640" stroke="#ca8a04" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="305" y="566" width="245" height="150" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="427" y="590" text-anchor="middle" font-size="14" fill="#7c3aed" font-weight="bold">② 규칙</text>
<text x="427" y="610" text-anchor="middle" font-size="11" fill="#475569">해야 할 것 · 하지 말 것</text>
<text x="427" y="640" text-anchor="middle" font-size="12" fill="#0f172a">시세·잔액은 도구로 조회</text>
<text x="427" y="662" text-anchor="middle" font-size="12" fill="#0f172a">투자 권유 금지</text>
<text x="427" y="684" text-anchor="middle" font-size="12" fill="#0f172a">이전 시세는 다시 조회</text>
<line x1="550" y1="640" x2="570" y2="640" stroke="#ca8a04" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="570" y="566" width="245" height="150" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="692" y="590" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">③ 출력 형식</text>
<text x="692" y="610" text-anchor="middle" font-size="11" fill="#475569">어떤 모양으로</text>
<text x="692" y="640" text-anchor="middle" font-size="12" fill="#0f172a">평문 (마크다운 금지)</text>
<text x="692" y="662" text-anchor="middle" font-size="12" fill="#0f172a">한 단락, 3~4문장</text>
<line x1="815" y1="640" x2="835" y2="640" stroke="#ca8a04" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="835" y="566" width="245" height="150" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="957" y="590" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">④ 예시 (Few-shot)</text>
<text x="957" y="610" text-anchor="middle" font-size="11" fill="#475569">이렇게 답해라</text>
<text x="957" y="640" text-anchor="middle" font-size="12" fill="#0f172a">PER · ROE · 배당수익률</text>
<text x="957" y="662" text-anchor="middle" font-size="12" fill="#0f172a">정의→계산 예시→주의사항</text>
<text x="560" y="744" text-anchor="middle" font-size="14" fill="#854d0e" font-weight="bold">핵심 한 줄 : "설명하는 것보다 보여주는 것이 모델에게 더 강하게 전달된다"</text>
<text x="560" y="768" text-anchor="middle" font-size="12" fill="#422006">(예시를 넣어도 코드 · API · SSE 이벤트는 바뀌지 않는다)</text>
</svg>
