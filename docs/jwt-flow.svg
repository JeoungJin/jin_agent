<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1000" height="1010" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">JWT 기본 개념 ② 인증 처리 흐름 (HttpOnly 쿠키 방식)</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">토큰은 서버가 쿠키로 내려주고, 이후 모든 요청에 브라우저가 쿠키를 자동으로 붙인다</text>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"><line x1="140" y1="134" x2="140" y2="906"/><line x1="500" y1="134" x2="500" y2="906"/><line x1="860" y1="134" x2="860" y2="906"/></g>
  <rect x="50" y="90" width="180" height="44" rx="10" fill="#0284c7"/><text x="140" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">브라우저</text><text x="140" y="127" text-anchor="middle" font-size="11" fill="#e0f2fe">React / curl</text>
  <rect x="390" y="90" width="220" height="44" rx="10" fill="#7c3aed"/><text x="500" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Spring Security 필터</text><text x="500" y="127" text-anchor="middle" font-size="11" fill="#ede9fe" font-family="Consolas,monospace">JwtAuthenticationFilter</text>
  <rect x="770" y="90" width="180" height="44" rx="10" fill="#16a34a"/><text x="860" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Controller</text><text x="860" y="127" text-anchor="middle" font-size="11" fill="#dcfce7">Service</text>

  <!-- A -->
  <rect x="20" y="148" width="960" height="206" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="36" y="172" font-size="15" font-weight="bold" fill="#1e40af">A. 로그인 — 쿠키 발급 (처음 1번)</text>
  <text x="500" y="202" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#0f172a">① POST /api/auth/login  { "email": "a@b.com" }</text>
  <line x1="140" y1="210" x2="860" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="500" y="228" text-anchor="middle" font-size="12" fill="#64748b">공개 URL(permitAll)이라 필터가 쿠키 없이 통과시킴</text>
  <rect x="690" y="238" width="270" height="30" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="825" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">JWT 생성·서명 + 쿠키 설정</text>
  <text x="500" y="292" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#0f172a">② 200 OK  { "id": 1, "email": "a@b.com" }   ← 본문에 토큰 없음</text>
  <line x1="860" y1="300" x2="140" y2="300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="500" y="318" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#7c3aed">Set-Cookie: access_token=eyJ…; HttpOnly; SameSite=Lax; Max-Age=3600</text>
  <rect x="40" y="326" width="400" height="22" rx="11" fill="#fff" stroke="#0284c7"/>
  <text x="240" y="341" text-anchor="middle" font-size="12" fill="#075985">브라우저가 쿠키를 저장 (JS는 읽을 수 없음)</text>

  <!-- B -->
  <rect x="20" y="370" width="960" height="372" rx="12" fill="#fefce8" stroke="#fde68a"/>
  <text x="36" y="394" font-size="15" font-weight="bold" fill="#92400e">B. API 호출 — 쿠키 자동 첨부 + 검증 (매 요청마다)</text>
  <text x="325" y="424" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#0f172a">③ POST /api/ai/route</text>
  <line x1="140" y1="432" x2="500" y2="432" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="325" y="450" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#7c3aed">Cookie: access_token=eyJ…</text>
  <text x="325" y="466" text-anchor="middle" font-size="11.5" fill="#64748b">브라우저가 자동으로 첨부 (헤더 코드 불필요)</text>
  <rect x="360" y="478" width="280" height="76" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">④ 토큰 검증</text>
  <text x="500" y="520" text-anchor="middle" font-size="12.5" fill="#1e293b">쿠키에서 토큰 추출 → 서명·만료 확인</text>
  <text x="500" y="539" text-anchor="middle" font-size="12.5" fill="#1e293b">성공 시 AuthUser를 SecurityContext에 저장</text>
  <text x="675" y="578" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">⑤ 검증 성공 → 요청 전달</text>
  <line x1="500" y1="586" x2="860" y2="586" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="740" y="598" width="230" height="40" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="855" y="615" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">Controller 실행</text>
  <text x="855" y="631" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas,monospace">@AuthenticationPrincipal</text>
  <text x="500" y="662" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">⑥ 200 OK  응답</text>
  <line x1="860" y1="670" x2="140" y2="670" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="325" y="698" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">⑤' 검증 실패 → 401 Unauthorized</text>
  <line x1="500" y1="706" x2="140" y2="706" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#r)"/>
  <text x="325" y="724" text-anchor="middle" font-size="12" fill="#b91c1c">쿠키 없음 · 위조 · 만료 (Controller까지 가지 않음)</text>

  <!-- C -->
  <rect x="20" y="758" width="960" height="146" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="36" y="782" font-size="15" font-weight="bold" fill="#166534">C. 로그인 상태 확인 · 로그아웃</text>
  <text x="500" y="808" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#0f172a">⑦ GET /api/ai/me  (앱 시작 시, 쿠키 자동 첨부)</text>
  <line x1="140" y1="816" x2="860" y2="816" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="500" y="834" text-anchor="middle" font-size="12" fill="#166534">200 → 채팅 화면    /    401 → 로그인 화면   (JS가 쿠키를 못 읽으므로 서버에 물어본다)</text>
  <text x="500" y="864" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#0f172a">⑧ POST /api/auth/logout</text>
  <line x1="140" y1="872" x2="860" y2="872" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="500" y="890" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#7c3aed">← Set-Cookie: access_token=; Max-Age=0   (브라우저가 쿠키 삭제)</text>

  <rect x="20" y="920" width="960" height="70" rx="12" fill="#0f172a"/>
  <text x="500" y="946" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">토큰은 JS가 아니라 브라우저가 보관·전송한다 (HttpOnly) — 서버는 여전히 STATELESS</text>
  <text x="500" y="968" text-anchor="middle" font-size="12.5" fill="#cbd5e1">쿠키는 자동 전송되므로 CSRF 위험이 새로 생긴다 → SameSite=Lax로 방어, 운영에서는 CSRF 토큰·Origin 검증 추가</text>
</svg>