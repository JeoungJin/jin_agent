<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="700" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">에이전트 하나 vs 역할을 나눈 에이전트</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">나누는 이유는 &#x27;빨라서&#x27;가 아니라 &#x27;권한과 책임을 나누기 위해서&#x27;다</text>
<rect x="30" y="96" width="430" height="430" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="245" y="124" text-anchor="middle" font-size="16" fill="#991b1b" font-weight="bold">하나의 Agent</text>
<rect x="50" y="142" width="390" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="245" y="166" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">모든 규칙 + 모든 도구가 한 프롬프트에</text>
<rect x="80" y="186" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="165.0" y="211.0" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">get_stock_price · get_per</text>
<rect x="260" y="186" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="345.0" y="211.0" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">get_exchange_rate</text>
<rect x="80" y="244" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="165.0" y="269.0" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">search_documents</text>
<rect x="260" y="244" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="345.0" y="269.0" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">get_account_balance</text>
<text x="245" y="320" text-anchor="middle" font-size="11.5" fill="#475569">어떤 질문이든 이 Agent 하나가 전부 처리한다</text>
<text x="60" y="376" text-anchor="start" font-size="13" fill="#0f172a">•  프롬프트가 길고 복잡해진다</text>
<text x="60" y="410" text-anchor="start" font-size="13" fill="#0f172a">•  도구가 많아 엉뚱한 도구를 고르기 쉽다</text>
<text x="60" y="444" text-anchor="start" font-size="13" fill="#0f172a">•  한 곳이 뚫리면 모든 권한이 함께 열린다</text>
<text x="60" y="478" text-anchor="start" font-size="13" fill="#0f172a">•  어디가 틀렸는지 나눠서 테스트하기 어렵다</text>
<rect x="500" y="96" width="470" height="430" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="735" y="124" text-anchor="middle" font-size="16" fill="#166534" font-weight="bold">Manager-Worker (역할을 나눔)</text>
<rect x="640" y="144" width="190" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="735.0" y="169.0" text-anchor="middle" font-size="12.5" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">manager_node</text>
<text x="735" y="206" text-anchor="middle" font-size="11.5" fill="#475569">어떤 Worker 가 필요한지만 정한다</text>
<line x1="735" y1="184" x2="586" y2="232" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="516" y="232" width="140" height="132" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="586" y="254" text-anchor="middle" font-size="10.5" fill="#075985" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">stock_worker</text>
<text x="586" y="272" text-anchor="middle" font-size="11" fill="#475569">시세 · 환율</text>
<text x="586" y="296" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">get_stock_price</text>
<text x="586" y="316" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">get_per</text>
<text x="586" y="336" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">get_exchange_rate</text>
<line x1="735" y1="184" x2="736" y2="232" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="666" y="232" width="140" height="132" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="736" y="254" text-anchor="middle" font-size="10.5" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">knowledge_worker</text>
<text x="736" y="272" text-anchor="middle" font-size="11" fill="#475569">약관 · 문서</text>
<text x="736" y="296" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">search_documents</text>
<line x1="735" y1="184" x2="886" y2="232" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="816" y="232" width="140" height="132" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="886" y="254" text-anchor="middle" font-size="10.5" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">account_worker</text>
<text x="886" y="272" text-anchor="middle" font-size="11" fill="#475569">내 계좌</text>
<text x="886" y="296" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">get_account_balance</text>
<text x="520" y="400" text-anchor="start" font-size="13" fill="#0f172a">•  Worker 마다 짧고 분명한 프롬프트</text>
<text x="520" y="430" text-anchor="start" font-size="13" fill="#0f172a">•  자기 도구만 쓴다 (최소 권한)</text>
<text x="520" y="460" text-anchor="start" font-size="13" fill="#0f172a">•  Worker 하나씩 따로 테스트한다</text>
<text x="520" y="498" text-anchor="start" font-size="12.5" fill="#166534" font-weight="bold">계좌 도구는 account_worker 에만 있다</text>
<rect x="30" y="548" width="940" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="500" y="570" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">대신 Worker 마다 LLM 을 따로 부르므로 비용 · 지연이 늘어난다</text>
<text x="500" y="588" text-anchor="middle" font-size="12" fill="#475569">→ 단순 질문은 기존 단일 경로로, 복합 질문만 Manager-Worker 로 보낸다</text>
<rect x="30" y="616" width="940" height="50" rx="12" fill="#0f172a"/><text x="500.0" y="646.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">병렬로 만들면 빨라지지만, 순차여도 &#x27;권한 분리&#x27;라는 이점은 그대로 남는다</text>
</svg>
