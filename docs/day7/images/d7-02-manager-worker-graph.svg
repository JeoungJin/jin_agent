<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="730" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">오늘의 통합 그래프</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">Day 6 그래프에 Manager-Worker 경로를 한 갈래 더한다</text>
<rect x="30" y="150" width="70" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="65.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">START</text>
<line x1="100" y1="168" x2="125" y2="168" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="125" y="150" width="110" height="36" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="180.0" y="173.0" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">mask_node</text>
<line x1="235" y1="168" x2="260" y2="168" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="260" y="150" width="130" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="325.0" y="173.0" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">classify_node</text>
<text x="325" y="138" text-anchor="middle" font-size="11" fill="#475569">category + COMPLEX 판정</text>
<rect x="520" y="100" width="300" height="96" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="670" y="126" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold">기존 단일 노드 경로 (Day 6)</text>
<text x="670" y="150" text-anchor="middle" font-size="11" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">stock · exchange · knowledge · general</text>
<text x="670" y="172" text-anchor="middle" font-size="11.5" fill="#475569" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">→ answer_node</text>
<polyline points="390,160 450,160 450,148 520,148" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<text x="452" y="128" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="bold">단순 질문</text>
<rect x="870" y="128" width="100" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="920.0" y="153.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">END</text>
<line x1="820" y1="148" x2="870" y2="148" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="325,186 325,255 330,255" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#o)"/>
<text x="262" y="226" text-anchor="middle" font-size="11.5" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">COMPLEX</text>
<rect x="330" y="230" width="230" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
<text x="445" y="252" text-anchor="middle" font-size="13.5" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">manager_node</text>
<text x="445" y="272" text-anchor="middle" font-size="11" fill="#475569">다음 Worker 를 정한다</text>
<rect x="130" y="350" width="200" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="230.0" y="378.0" text-anchor="middle" font-size="12" fill="#075985" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">stock_worker</text>
<line x1="445" y1="282" x2="230" y2="350" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="350" y="350" width="200" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="450.0" y="378.0" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">knowledge_worker</text>
<line x1="445" y1="282" x2="450" y2="350" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="570" y="350" width="200" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="670.0" y="378.0" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">account_worker</text>
<line x1="445" y1="282" x2="670" y2="350" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<polyline points="230,396 230,424 90,424 90,256 330,256" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#p)"/>
<text x="160" y="444" text-anchor="middle" font-size="11.5" fill="#475569">Worker 가 끝나면 manager 로 되돌아간다</text>
<rect x="800" y="230" width="170" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="885.0" y="261.0" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">aggregator_node</text>
<line x1="560" y1="256" x2="800" y2="256" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="680" y="246" text-anchor="middle" font-size="11.5" fill="#166534" font-weight="bold">할 일이 없으면</text>
<line x1="885" y1="282" x2="885" y2="336" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="845" y="336" width="80" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="885.0" y="359.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">END</text>
<rect x="30" y="470" width="470" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="265" y="496" text-anchor="middle" font-size="13.5" fill="#92400e" font-weight="bold">Manager 규칙</text>
<text x="46" y="528" text-anchor="start" font-size="11.5" fill="#0f172a">•  workers = [..] 를 JSON 으로 정한다 (허용 목록 3개 밖의 이름은 버린다)</text>
<text x="46" y="558" text-anchor="start" font-size="11.5" fill="#0f172a">•  한 번에 한 Worker 씩 순서대로, Worker 호출은 최대 3번</text>
<text x="46" y="588" text-anchor="start" font-size="11.5" fill="#0f172a">•  전체 노드 수 · 시간 상한 (Kill Switch)</text>
<rect x="520" y="470" width="450" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="745" y="496" text-anchor="middle" font-size="13.5" fill="#991b1b" font-weight="bold">Worker 마다 허용 도구가 다르다</text>
<text x="536" y="528" text-anchor="start" font-size="11.5" fill="#0f172a">•  stock_worker : 시세 · 환율 도구만</text>
<text x="536" y="558" text-anchor="start" font-size="11.5" fill="#0f172a">•  knowledge_worker : 문서 검색만</text>
<text x="536" y="588" text-anchor="start" font-size="11.5" fill="#0f172a">•  account_worker : 계좌 조회만 (user_id 는 서버가 넣는다)</text>
<rect x="30" y="650" width="940" height="44" rx="12" fill="#0f172a"/><text x="500.0" y="677.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">Worker 결과는 State 의 리스트에 쌓이고(리듀서), aggregator 가 그것만 근거로 답한다</text>
</svg>
