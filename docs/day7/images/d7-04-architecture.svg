<text x="860" y="424" text-anchor="middle" font-size="11.5" fill="#0f172a">RAG 출처 · 임계값 ·</text>
<text x="860" y="444" text-anchor="middle" font-size="11.5" fill="#0f172a">&quot;확인할 수 없다&quot;</text>
<text x="30" y="520" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">README 에 이 그림과 함께 쓸 것</text>
<text x="46" y="552" text-anchor="start" font-size="13" fill="#0f172a">•  어떤 문제를 푸는 프로젝트인가 (한 문장)</text>
<text x="46" y="580" text-anchor="start" font-size="13" fill="#0f172a">•  층마다 맡은 일과 약속(주소 · 형식 · 인증)</text>
<text x="46" y="608" text-anchor="start" font-size="13" fill="#0f172a">•  AI 가 틀렸던 사례 3가지와 고친 과정</text>
<text x="46" y="636" text-anchor="start" font-size="13" fill="#0f172a">•  안전장치를 왜 그렇게 설계했나</text>
<text x="46" y="664" text-anchor="start" font-size="13" fill="#0f172a">•  아직 못 고친 한계와 다음 개선 방향</text>
<rect x="30" y="704" width="940" height="40" rx="12" fill="#0f172a"/><text x="500.0" y="729.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">그림은 AI 가 그려 줘도, 왜 이렇게 나눴는지는 내 말로 설명할 수 있어야 한다</text>
