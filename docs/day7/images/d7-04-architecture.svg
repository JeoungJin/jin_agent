<text x="380" y="444" text-anchor="middle" font-size="11.5" fill="#0f172a">출력 · 저장 · 로그</text>
<rect x="510" y="366" width="220" height="112" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
