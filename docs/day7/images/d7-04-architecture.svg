<text x="620" y="424" text-anchor="middle" font-size="11.5" fill="#0f172a">라운드 · 시간 ·</text>
<text x="620" y="444" text-anchor="middle" font-size="11.5" fill="#0f172a">반복 · 그래프 실행 횟수</text>
<rect x="750" y="366" width="220" height="112" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
