<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="760" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">전체 시스템 E2E 점검</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">React → Spring → FastAPI → Agent 를 처음부터 끝까지 한 번에</text>
<rect x="30" y="100" width="220" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="140" y="134" text-anchor="middle" font-size="14.5" fill="#075985" font-weight="bold">① 로그인</text>
<text x="140" y="162" text-anchor="middle" font-size="12" fill="#0f172a">JWT 쿠키가 발급된다</text>
<line x1="250" y1="150" x2="270" y2="150" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="270" y="100" width="220" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="380" y="134" text-anchor="middle" font-size="14.5" fill="#075985" font-weight="bold">② 간단 질문</text>
<text x="380" y="162" text-anchor="middle" font-size="12" fill="#0f172a">스트리밍으로 답이 나온다</text>
<line x1="490" y1="150" x2="510" y2="150" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="510" y="100" width="220" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="620" y="134" text-anchor="middle" font-size="14.5" fill="#5b21b6" font-weight="bold">③ 복합 질문</text>
<text x="620" y="162" text-anchor="middle" font-size="12" fill="#0f172a">Worker 가 나뉘어 실행된다</text>
<line x1="730" y1="150" x2="750" y2="150" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="750" y="100" width="220" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="860" y="134" text-anchor="middle" font-size="14.5" fill="#166534" font-weight="bold">④ 대시보드</text>
<text x="860" y="162" text-anchor="middle" font-size="12" fill="#0f172a">종목 9개가 보인다</text>
<rect x="30" y="240" width="220" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="140" y="274" text-anchor="middle" font-size="14.5" fill="#92400e" font-weight="bold">⑤ 계좌조회</text>
<text x="140" y="302" text-anchor="middle" font-size="12" fill="#0f172a">Function Calling 으로 잔액</text>
<line x1="250" y1="290" x2="270" y2="290" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="270" y="240" width="220" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="380" y="274" text-anchor="middle" font-size="14.5" fill="#5b21b6" font-weight="bold">⑥ RAG 질의</text>
<text x="380" y="302" text-anchor="middle" font-size="12" fill="#0f172a">답과 함께 출처가 나온다</text>
<line x1="490" y1="290" x2="510" y2="290" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="510" y="240" width="220" height="100" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="620" y="274" text-anchor="middle" font-size="14.5" fill="#991b1b" font-weight="bold">⑦ 개인정보</text>
<text x="620" y="302" text-anchor="middle" font-size="12" fill="#0f172a">로그 · 응답에 마스킹</text>
<polyline points="910,200 910,220 130,220 130,240" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="750" y="240" width="220" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="860" y="282" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">골든 질문 10개</text>
<text x="860" y="306" text-anchor="middle" font-size="12" fill="#475569">환각 · 출처 회귀 점검</text>
<text x="30" y="386" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">장애를 일부러 일으켜 본다</text>
<rect x="30" y="402" width="220" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="140" y="432" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">FastAPI 를 끈다</text>
<text x="140" y="458" text-anchor="middle" font-size="13" fill="#475569">→</text>
<text x="140" y="482" text-anchor="middle" font-size="11.5" fill="#0f172a">Spring 이 Fallback 응답을 돌려준다</text>
<rect x="270" y="402" width="220" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="380" y="432" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">로그인 없이 계좌조회</text>
<text x="380" y="458" text-anchor="middle" font-size="13" fill="#475569">→</text>
<text x="380" y="482" text-anchor="middle" font-size="11.5" fill="#0f172a">거부된다 (401)</text>
<rect x="510" y="402" width="220" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="620" y="432" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">상한을 낮춰 실행</text>
<text x="620" y="458" text-anchor="middle" font-size="13" fill="#475569">→</text>
<text x="620" y="482" text-anchor="middle" font-size="11.5" fill="#0f172a">안내 문구로 정상 종료한다</text>
<rect x="750" y="402" width="220" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="860" y="432" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">문서에 없는 질문</text>
<text x="860" y="458" text-anchor="middle" font-size="13" fill="#475569">→</text>
<text x="860" y="482" text-anchor="middle" font-size="11.5" fill="#0f172a">&quot;확인할 수 없다&quot;고 답한다</text>
<rect x="30" y="530" width="940" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="500" y="556" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">통과한 것만이 아니라 &#x27;실패했을 때 어떻게 실패하는가&#x27;를 본다</text>
<text x="500" y="584" text-anchor="middle" font-size="12.5" fill="#475569">세 프로젝트 사이의 약속(주소 · 형식 · 인증)이 지켜지는지가 E2E 의 핵심이다</text>
<rect x="30" y="640" width="940" height="50" rx="12" fill="#0f172a"/><text x="500.0" y="670.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">단위 테스트가 모두 통과해도, 층을 이어 붙이면 깨질 수 있다</text>
</svg>
