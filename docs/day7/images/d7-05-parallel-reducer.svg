<text x="742" y="620" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">Annotated[list, operator.add]</text>
<text x="742" y="646" text-anchor="middle" font-size="11.5" fill="#475569">여러 Worker 의 결과를 안전하게 합친다</text>
<rect x="30" y="704" width="940" height="44" rx="12" fill="#0f172a"/><text x="500.0" y="731.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">병렬은 빠르지만 비용은 같거나 더 든다 — 효과가 있는 질문에만 쓴다</text>
