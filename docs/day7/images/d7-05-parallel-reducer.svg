<text x="333" y="556" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">[&#x27;잔액&#x27;]  (3개 중 1개)</text>
<text x="258" y="620" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">빠진 결과가 있어도 오류가 나지 않는다 — 조용히 틀린다</text>
<text x="258" y="646" text-anchor="middle" font-size="11.5" fill="#475569">병렬 실행 순서도 매번 다를 수 있다</text>
<rect x="514" y="432" width="456" height="250" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="742" y="458" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="bold">operator.add — 누적된다</text>
