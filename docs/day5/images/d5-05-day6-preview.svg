<text x="395" y="514" text-anchor="middle" font-size="12.5" fill="#92400e" font-weight="bold">부족하면 다시 계획 (재시도 1~2회 상한)</text>
<text x="500" y="552" text-anchor="middle" font-size="12" fill="#0f172a">예) &quot;내 포트폴리오 점검해줘&quot; → 보유 종목 조회 → 시세 확인 → 비중 계산 → 점검 → 답변</text>
<rect x="30" y="606" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="633" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">자율형 Agent = 계획 + 실행 + 점검 + 상한</text>
<text x="500.0" y="656" text-anchor="middle" font-size="12" fill="#fbbf24">오늘 만든 Kill Switch · PII 마스킹이 그래프의 노드와 조건으로 들어간다</text>
