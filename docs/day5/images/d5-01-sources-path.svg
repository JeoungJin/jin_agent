<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="730" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">출처(sources)가 지나가는 길</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">FastAPI 가 만들고, Spring 은 그대로 전달하고, React 가 보여 준다</text>
<rect x="30" y="98" width="290" height="128" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="175.0" y="124" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">① FastAPI (VS Code)</text>
<text x="175.0" y="147" text-anchor="middle" font-size="13" fill="#0f172a">search_documents 로 검색</text>
<text x="175.0" y="167" text-anchor="middle" font-size="13" fill="#0f172a">SourceCollector 가 번호 수집</text>
<text x="175.0" y="187" text-anchor="middle" font-size="13" fill="#0f172a">응답에 sources 만 추가</text>
<rect x="355" y="98" width="290" height="128" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="500.0" y="124" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">② SpringBoot (IntelliJ)</text>
<text x="500.0" y="147" text-anchor="middle" font-size="13" fill="#0f172a">sources 를 그대로 전달</text>
<text x="500.0" y="167" text-anchor="middle" font-size="13" fill="#0f172a">대화 기록에는 저장하지 않음</text>
<text x="500.0" y="187" text-anchor="middle" font-size="13" fill="#0f172a">인증 · 중계 방식은 그대로</text>
<rect x="680" y="98" width="290" height="128" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="825.0" y="124" text-anchor="middle" font-size="15" fill="#075985" font-weight="bold">③ React (VS Code)</text>
<text x="825.0" y="147" text-anchor="middle" font-size="13" fill="#0f172a">답변 아래 &#x27;출처 N건&#x27; 표시</text>
<text x="825.0" y="167" text-anchor="middle" font-size="13" fill="#0f172a">펼치면 번호 · 파일 · 원문</text>
<text x="825.0" y="187" text-anchor="middle" font-size="13" fill="#0f172a">없으면 영역을 만들지 않음</text>
<line x1="320" y1="162" x2="355" y2="162" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<line x1="645" y1="162" x2="680" y2="162" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="30" y="266" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">SSE 이벤트 순서 (/route-stream)</text>
<rect x="35" y="280" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="110" y="306" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">category</text>
<text x="110" y="328" text-anchor="middle" font-size="11" fill="#475569">질문 분류</text>
<line x1="185" y1="312" x2="230" y2="312" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="230" y="280" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="305" y="306" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">tool *</text>
<text x="305" y="328" text-anchor="middle" font-size="11" fill="#475569">도구 시작 · 완료</text>
<line x1="380" y1="312" x2="425" y2="312" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="425" y="280" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="500" y="306" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">token *</text>
<text x="500" y="328" text-anchor="middle" font-size="11" fill="#475569">답변 조각</text>
<line x1="575" y1="312" x2="620" y2="312" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="620" y="280" width="150" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
<text x="695" y="306" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">sources ?</text>
<text x="695" y="328" text-anchor="middle" font-size="11" fill="#475569">검색을 썼을 때만 1번</text>
<line x1="770" y1="312" x2="815" y2="312" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="815" y="280" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="890" y="306" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">done</text>
<text x="890" y="328" text-anchor="middle" font-size="11" fill="#475569">끝</text>
<text x="30" y="386" text-anchor="start" font-size="13" fill="#991b1b" font-weight="bold">오류가 나면</text>
<rect x="130" y="366" width="130" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="195" y="388" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">category</text>
<line x1="260" y1="383" x2="300" y2="383" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="300" y="366" width="130" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="365" y="388" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">…</text>
<line x1="430" y1="383" x2="470" y2="383" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="470" y="366" width="130" height="34" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="535" y="388" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">error</text>
<text x="620" y="388" text-anchor="start" font-size="12.5" fill="#991b1b">여기서 끝 — sources · done 은 보내지 않는다</text>
<text x="30" y="446" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">번호 규칙 — 답변 속 [1] 은 sources[0] 이다</text>
<rect x="30" y="462" width="400" height="104" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="230" y="490" text-anchor="middle" font-size="13" fill="#475569" font-weight="bold">answer</text>
<text x="230" y="520" text-anchor="middle" font-size="13.5" fill="#0f172a">중도상환수수료율은 0.7% 입니다 [1].</text>
<text x="230" y="548" text-anchor="middle" font-size="12" fill="#64748b">[2] 가 있으면 sources[1]</text>
<line x1="430" y1="514" x2="520" y2="514" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="475" y="504" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">[1] = [0]</text>
<rect x="520" y="462" width="450" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="745" y="486" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">sources[0]</text>
<text x="745" y="510" text-anchor="middle" font-size="12.5" fill="#0f172a">jin_smart_loan.txt · p.1 · #3</text>
<text x="745" y="532" text-anchor="middle" font-size="12.5" fill="#0f172a">score 0.62</text>
<text x="745" y="553" text-anchor="middle" font-size="12" fill="#475569">text: 약관 청크 원문 (…3년 이내 0.7%…)</text>
<rect x="30" y="588" width="940" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="500" y="613" text-anchor="middle" font-size="12.5" fill="#334155">문서 검색을 쓰지 않은 질문(PER 설명 · 시세 · 잔액)은  &quot;sources&quot;: []  이고 sources 이벤트도 없다</text>
<rect x="30" y="652" width="940" height="50" rx="12" fill="#0f172a"/><text x="500.0" y="682.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">바뀌는 것은 sources 뿐 — 기존 이벤트 · 요청 형식 · 인증은 그대로</text>
</svg>
