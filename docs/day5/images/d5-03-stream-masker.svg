<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="720" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">스트리밍에서 PII 가 두 조각에 걸칠 때</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">token 은 글자 조각으로 도착한다 — 조각마다 마스킹하면 놓친다</text>
<text x="30" y="98" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold">LLM 이 보내는 token 조각</text>
<rect x="60" y="134" width="360" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="240" y="166" text-anchor="middle" font-size="15" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">내 번호는 010-12</text>
<rect x="70" y="118" width="70" height="20" rx="10.0" fill="#94a3b8"/><text x="105.0" y="132.5" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">조각 1</text>
<line x1="420" y1="159" x2="480" y2="159" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="480" y="134" width="360" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="660" y="166" text-anchor="middle" font-size="15" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">34-5678 입니다</text>
<rect x="490" y="118" width="70" height="20" rx="10.0" fill="#94a3b8"/><text x="525.0" y="132.5" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">조각 2</text>
<rect x="30" y="206" width="450" height="252" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="255.0" y="232" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">조각마다 mask_pii 를 하면</text>
<text x="60" y="270" text-anchor="start" font-size="13" fill="#0f172a">조각 1  010-12  → 패턴이 없다</text>
<text x="60" y="298" text-anchor="start" font-size="13" fill="#475569">→ 그대로 내보낸다</text>
<text x="60" y="326" text-anchor="start" font-size="13" fill="#0f172a">조각 2  34-5678  → 패턴이 없다</text>
<text x="60" y="354" text-anchor="start" font-size="13" fill="#475569">→ 그대로 내보낸다</text>
<rect x="50" y="382" width="410" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="255" y="406" text-anchor="middle" font-size="12" fill="#475569">화면에 보이는 결과</text>
<text x="255" y="428" text-anchor="middle" font-size="14.5" fill="#991b1b" font-weight="bold">010-1234-5678  ✗ 유출</text>
<rect x="520" y="206" width="450" height="252" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="745.0" y="232" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">StreamMasker 는</text>
<circle cx="548" cy="268" r="13" fill="#16a34a"/><text x="548" y="273" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
<text x="572" y="264" text-anchor="start" font-size="13" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">feed(조각 1)</text>
<text x="572" y="284" text-anchor="start" font-size="12" fill="#0f172a">&#x27;내 번호는 &#x27; 는 바로 출력</text>
<text x="572" y="302" text-anchor="start" font-size="12" fill="#0f172a">&#x27;010-12&#x27; 는 끝이 숫자 · 하이픈이라 보류</text>
<circle cx="548" cy="334" r="13" fill="#16a34a"/><text x="548" y="339" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">2</text>
<text x="572" y="330" text-anchor="start" font-size="13" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">feed(조각 2)</text>
<text x="572" y="350" text-anchor="start" font-size="12" fill="#0f172a">보류분과 이어 &#x27;010-1234-5678&#x27;</text>
<text x="572" y="368" text-anchor="start" font-size="12" fill="#0f172a">공백을 만나 확정 → 010-****-5678 출력</text>
<circle cx="548" cy="400" r="13" fill="#16a34a"/><text x="548" y="405" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">3</text>
<text x="572" y="396" text-anchor="start" font-size="13" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">done 직전</text>
<text x="572" y="416" text-anchor="start" font-size="12" fill="#0f172a">flush() 로 남은 보류분을</text>
<text x="572" y="434" text-anchor="start" font-size="12" fill="#0f172a">마지막 token 으로 내보낸다</text>
<rect x="30" y="484" width="300" height="106" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="180.0" y="510" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">보류 길이 상한 32자</text>
<text x="180.0" y="532" text-anchor="middle" font-size="12.5" fill="#0f172a">넘으면 그 시점에 마스킹해</text>
<text x="180.0" y="551.5" text-anchor="middle" font-size="12.5" fill="#0f172a">내보낸다 (무한 지연 방지)</text>
<rect x="350" y="484" width="300" height="106" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="500.0" y="510" text-anchor="middle" font-size="14" fill="#075985" font-weight="bold">숫자 없는 구간은 즉시</text>
<text x="500.0" y="532" text-anchor="middle" font-size="12.5" fill="#0f172a">평범한 문장은</text>
<text x="500.0" y="551.5" text-anchor="middle" font-size="12.5" fill="#0f172a">거의 지연 없이 나온다</text>
<rect x="670" y="484" width="300" height="106" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="820.0" y="510" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">error 로 끝나면 보류분 버림</text>
<text x="820.0" y="532" text-anchor="middle" font-size="12.5" fill="#0f172a">정상 종료일 때만</text>
<text x="820.0" y="551.5" text-anchor="middle" font-size="12.5" fill="#0f172a">flush() 결과를 내보낸다</text>
<rect x="30" y="616" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="643" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">조각이 아니라 이어 붙인 텍스트 기준으로 검사한다</text>
<text x="500.0" y="666" text-anchor="middle" font-size="12" fill="#fbbf24">앞부분은 즉시 보내고, 끝의 숫자 · 하이픈 구간만 잠깐 보류한다</text>
</svg>
