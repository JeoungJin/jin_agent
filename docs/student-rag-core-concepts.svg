<rect x="387" y="452" width="346" height="36" rx="10" fill="#7c3aed"/><rect x="387" y="476" width="346" height="12" fill="#7c3aed"/><text x="560.0" y="477" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">⑤  임계값</text>
