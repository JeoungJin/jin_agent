<text x="560.0" y="596" text-anchor="middle" font-size="10" fill="#475569">0.5</text>
<line x1="693" y1="574" x2="693" y2="582" stroke="#475569"/>
<text x="693" y="596" text-anchor="middle" font-size="10" fill="#475569">1</text>
