<rect width="1120" height="1190" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">★ 꼭 이해하기 (개념) — RAG 7가지</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">코드를 외우지 말고, 이 7가지를 자기 말로 설명할 수 있으면 충분합니다 (면접에도 나옵니다)</text>
<rect x="20" y="92" width="346" height="350" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="20" y="92" width="346" height="36" rx="10" fill="#dc2626"/><rect x="20" y="116" width="346" height="12" fill="#dc2626"/><text x="193.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">①  RAG가 필요한 이유</text>
<rect x="40" y="140" width="145" height="112" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="112" y="158" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">LLM 만</text>
<text x="112" y="180" text-anchor="middle" font-size="11" fill="#0f172a">"우리 문서"를 모른다</text>
<line x1="112" y1="188" x2="112" y2="206" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
