<text x="273.5" y="229.0" text-anchor="middle" font-size="12" fill="#14532d" font-weight="bold">0.7% [1] ✔</text>
<text x="40" y="268" text-anchor="start" font-size="12" fill="#0f172a">• LLM은 우리 회사 문서를 학습하지 않았다</text>
<text x="40" y="290" text-anchor="start" font-size="12" fill="#0f172a">• 모르면 그럴듯하게 지어낸다 (환각)</text>
<text x="40" y="312" text-anchor="start" font-size="12" fill="#0f172a">• 문서를 찾아서 근거로 주면 지어내지 않는다</text>
<rect x="34" y="380" width="318" height="50" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="44" y="398" text-anchor="start" font-size="11" fill="#854d0e" font-weight="bold">면접  RAG란 무엇이고 왜 쓰나요?</text>
<text x="44" y="416" text-anchor="start" font-size="11" fill="#475569">→ 문서를 근거로 답하게 해 환각을 줄인다</text>
