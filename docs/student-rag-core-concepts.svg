<text x="557" y="198" text-anchor="start" font-size="10" fill="#4c1d95">수수료</text>
<circle cx="667" cy="240" r="7" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
<text x="667" y="226" text-anchor="middle" font-size="10" fill="#475569">점심 메뉴</text>
<ellipse cx="502" cy="199" rx="50" ry="22" fill="none" stroke="#7c3aed" stroke-dasharray="4 3"/>
<text x="639" y="188" text-anchor="middle" font-size="10" fill="#6b7280"></text>
<text x="407" y="268" text-anchor="start" font-size="12" fill="#0f172a">• 문장의 의미를 숫자(벡터)로 바꾼 것</text>
<text x="407" y="290" text-anchor="start" font-size="12" fill="#0f172a">• 의미가 비슷하면 벡터도 가깝다</text>
<text x="407" y="312" text-anchor="start" font-size="12" fill="#0f172a">• 질문과 문서는 같은 모델로 변환해야 비교할 수 있다</text>
<rect x="401" y="380" width="318" height="50" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="411" y="398" text-anchor="start" font-size="11" fill="#854d0e" font-weight="bold">면접  임베딩이란 무엇인가요?</text>
<text x="411" y="416" text-anchor="start" font-size="11" fill="#475569">→ 의미를 숫자 벡터로 바꿔 거리로 비교</text>
<rect x="754" y="92" width="346" height="350" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
