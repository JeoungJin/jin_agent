<text x="112.5" y="229.0" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">수수료 1.2% ✗</text>
<rect x="201" y="140" width="145" height="112" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="273" y="158" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">LLM + 문서</text>
<text x="273" y="180" text-anchor="middle" font-size="11" fill="#0f172a">찾아온 근거를 읽는다</text>
<line x1="273" y1="188" x2="273" y2="206" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
