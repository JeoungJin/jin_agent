<text x="288.0" y="600" text-anchor="middle" font-size="10" fill="#0f172a">청크 3</text>
<rect x="136" y="546" width="16" height="64" fill="#ea580c" fill-opacity="0.25" stroke="#ea580c" stroke-dasharray="3 2"/>
<rect x="232" y="546" width="16" height="64" fill="#ea580c" fill-opacity="0.25" stroke="#ea580c" stroke-dasharray="3 2"/>
<text x="272" y="562" text-anchor="start" font-size="10" fill="#9a3412" font-weight="bold">겹침 50자</text>
<text x="40" y="628" text-anchor="start" font-size="12" fill="#0f172a">• 문서를 통째로 넣을 수 없어서 자른다</text>
<text x="40" y="650" text-anchor="start" font-size="12" fill="#0f172a">• 너무 크면 엉뚱한 내용이 섞이고, 너무 작으면</text>
<text x="54" y="669" text-anchor="start" font-size="12" fill="#0f172a">문맥이 끊긴다</text>
<text x="40" y="691" text-anchor="start" font-size="12" fill="#0f172a">• 겹치게 잘라 경계에서 문장이 잘리는 손실을 줄인다</text>
<rect x="34" y="740" width="318" height="50" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="44" y="758" text-anchor="start" font-size="11" fill="#854d0e" font-weight="bold">면접  청크 크기는 어떻게 정하나요?</text>
<text x="44" y="776" text-anchor="start" font-size="11" fill="#475569">→ 문서와 질문 특성에 맞춰 실험으로 정한다</text>
