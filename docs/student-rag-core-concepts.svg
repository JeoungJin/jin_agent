<text x="407" y="154" text-anchor="start" font-size="11" fill="#334155" font-family="Consolas,'DejaVu Sans Mono',monospace">"중도상환수수료" → [0.12, -0.80, 0.33, …]</text>
<rect x="407" y="166" width="306" height="86" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
