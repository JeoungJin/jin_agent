<text x="880" y="222" text-anchor="middle" font-size="10" fill="#991b1b">질문</text>
<text x="1000" y="162" text-anchor="start" font-size="11" fill="#854d0e" font-weight="bold">top-3</text>
<text x="1000" y="178" text-anchor="start" font-size="10" fill="#475569">가장 가까운</text>
<text x="1000" y="192" text-anchor="start" font-size="10" fill="#475569">3개를 가져옴</text>
<text x="774" y="268" text-anchor="start" font-size="12" fill="#0f172a">• 질문도 벡터로 바꿔 가장 가까운 청크를 찾는다</text>
<text x="774" y="290" text-anchor="start" font-size="12" fill="#0f172a">• 키워드 일치가 아니라 의미가 가까운 것</text>
<text x="774" y="312" text-anchor="start" font-size="12" fill="#0f172a">• 점수가 클수록 가깝다 (코사인 유사도)</text>
