<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="740" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">○ 흐름만 이해하기 (구조) — "이런 일을 한다"</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">코드를 외울 필요 없이, 각 부분이 어떤 일을 하는지만 알면 됩니다</text>
<rect x="20" y="92" width="540" height="300" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<rect x="20" y="92" width="540" height="36" rx="10" fill="#0284c7"/><rect x="20" y="116" width="540" height="12" fill="#0284c7"/><text x="290.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">① 도구 병렬 실행</text>
<text x="40" y="152" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">순서대로</text>
<rect x="40" y="160" width="200" height="22" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
<text x="140" y="176" text-anchor="middle" font-size="11" fill="#075985">주가</text>
<rect x="240" y="160" width="200" height="22" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
<text x="340" y="176" text-anchor="middle" font-size="11" fill="#166534">PER</text>
<text x="460" y="176" text-anchor="start" font-size="11" fill="#dc2626" font-weight="bold">= 2배 시간</text>
<text x="40" y="214" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">동시에 (병렬)</text>
<rect x="40" y="222" width="200" height="22" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
<text x="140" y="238" text-anchor="middle" font-size="11" fill="#075985">주가</text>
<rect x="40" y="248" width="200" height="22" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
<text x="140" y="264" text-anchor="middle" font-size="11" fill="#166534">PER</text>
<text x="260" y="252" text-anchor="start" font-size="11" fill="#166534" font-weight="bold">= 1배 시간</text>
<rect x="40" y="342" width="490" height="34" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="285" y="364" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">주가와 PER을 동시에 조회해서 기다리는 시간을 줄인다</text>
<rect x="580" y="92" width="520" height="300" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<rect x="580" y="92" width="520" height="36" rx="10" fill="#7c3aed"/><rect x="580" y="116" width="520" height="12" fill="#7c3aed"/><text x="840.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">② 대화 기록(messages)에 남기기</text>
<rect x="600" y="146" width="70" height="17" rx="4" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
<text x="635" y="159" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">system</text>
<text x="680" y="159" text-anchor="start" font-size="11" fill="#0f172a">금융 도우미 규칙</text>
<rect x="600" y="166" width="70" height="17" rx="4" fill="#bae6fd" stroke="#94a3b8" stroke-width="1"/>
<text x="635" y="179" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">user</text>
<text x="680" y="179" text-anchor="start" font-size="11" fill="#0f172a">삼성전자 주가와 PER?</text>
<rect x="600" y="186" width="70" height="17" rx="4" fill="#fde68a" stroke="#94a3b8" stroke-width="1"/>
<text x="635" y="199" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">assistant</text>
<text x="680" y="199" text-anchor="start" font-size="11" fill="#0f172a">tool_calls: get_stock_price, get_per</text>
<rect x="600" y="206" width="70" height="17" rx="4" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/>
<text x="635" y="219" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">tool</text>
<text x="680" y="219" text-anchor="start" font-size="11" fill="#0f172a">71,000원 (+1.43%)</text>
<rect x="600" y="226" width="70" height="17" rx="4" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/>
<text x="635" y="239" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">tool</text>
<text x="680" y="239" text-anchor="start" font-size="11" fill="#0f172a">PER 12.3배</text>
<text x="600" y="270" text-anchor="start" font-size="11" fill="#5b21b6" font-weight="bold">→ 다시 LLM 호출 → 최종 답변</text>
<rect x="600" y="250" width="0" height="0" rx="10" fill="none" stroke="none" stroke-width="0"/>
<rect x="600" y="342" width="480" height="34" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="840" y="364" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">기록에 도구 호출과 결과를 남겨야 LLM이 이어서 답할 수 있다</text>
<rect x="20" y="412" width="540" height="300" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<rect x="20" y="412" width="540" height="36" rx="10" fill="#ca8a04"/><rect x="20" y="436" width="540" height="12" fill="#ca8a04"/><text x="290.0" y="437" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">③ 조각난 tool_calls 이어 붙이기</text>
<rect x="40" y="466" width="150" height="44" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="115" y="486" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="bold">조각 1</text>
<text x="115" y="502" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">{"na</text>
<rect x="208" y="466" width="150" height="44" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="283" y="486" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="bold">조각 2</text>
<text x="283" y="502" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">me":"삼</text>
<rect x="376" y="466" width="150" height="44" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="451" y="486" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="bold">조각 3</text>
<text x="451" y="502" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">성전자"}</text>
<line x1="290" y1="510" x2="290" y2="534" stroke="#ca8a04" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="40" y="536" width="480" height="40" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="280" y="561" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">{"name":"삼성전자"}   ← 이어 붙인 결과</text>
<line x1="290" y1="576" x2="290" y2="598" stroke="#ca8a04" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="40" y="600" width="480" height="30" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="280" y="620" text-anchor="middle" font-size="12" fill="#854d0e" font-weight="bold">스트림이 끝난 뒤 한 번에 json.loads (중간에 해석하면 깨진다)</text>
<rect x="40" y="662" width="490" height="34" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="285" y="684" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">Day3 SSE 파서와 같은 아이디어: 잘려 온 조각을 모았다가 해석</text>
<rect x="580" y="412" width="520" height="300" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="580" y="412" width="520" height="36" rx="10" fill="#dc2626"/><rect x="580" y="436" width="520" height="12" fill="#dc2626"/><text x="840.0" y="437" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">④ 도중 오류는 error 이벤트로</text>
<text x="600" y="478" text-anchor="start" font-size="12" fill="#166534" font-weight="bold">정상</text>
<rect x="650" y="462" width="98" height="24" rx="6" fill="#0284c7" stroke="#0284c7" stroke-width="1"/>
<text x="699" y="479" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">category</text>
<rect x="758" y="462" width="98" height="24" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<text x="807" y="479" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">tool</text>
<rect x="866" y="462" width="98" height="24" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="915" y="479" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">token</text>
<rect x="974" y="462" width="98" height="24" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="1023" y="479" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">done</text>
<text x="600" y="534" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">오류</text>
<rect x="650" y="518" width="98" height="24" rx="6" fill="#0284c7" stroke="#0284c7" stroke-width="1"/>
<text x="699" y="535" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">category</text>
<rect x="758" y="518" width="98" height="24" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<text x="807" y="535" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">tool</text>
<rect x="866" y="518" width="98" height="24" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="915" y="535" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">error</text>
<text x="986" y="535" text-anchor="start" font-size="11" fill="#991b1b" font-weight="bold">끝 (done 없음)</text>
<text x="600" y="582" text-anchor="start" font-size="12" fill="#7f1d1d">• 이미 200 응답이 시작됐으므로 상태코드를 바꿀 수 없다</text>
<text x="600" y="604" text-anchor="start" font-size="12" fill="#7f1d1d">• 내부 예외 내용은 로그에만, 화면에는 안내 문구만</text>
<text x="600" y="626" text-anchor="start" font-size="12" fill="#7f1d1d">• React는 error를 받으면 오류를 표시하고 로딩을 끝낸다</text>
<rect x="600" y="662" width="490" height="34" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="845" y="684" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold">Day3 규칙 그대로 : 오류는 error 이벤트 1개, 이후 done 없음</text>
</svg>
