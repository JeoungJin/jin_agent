<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1000" height="770" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">AiGatewayService 오류 처리 기준</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#64748b">어떤 오류는 fallback(대체 응답)으로, 어떤 오류는 그대로 알릴까?</text>

  <!-- start -->
  <rect x="300" y="88" width="400" height="40" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="500" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985" font-family="Consolas,monospace">POST /api/ai/route  { "question": ... }</text>
  <line x1="500" y1="128" x2="500" y2="156" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- step 1 -->
  <rect x="300" y="156" width="400" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">① 입력 검증 (@Valid, @NotBlank)</text>
  <text x="500" y="201" text-anchor="middle" font-size="13" fill="#1e293b">question이 null · 빈 문자열 · 공백인가?</text>

  <text x="725" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">예</text>
  <line x1="700" y1="186" x2="750" y2="186" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <rect x="750" y="146" width="220" height="84" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="860" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">400 Bad Request</text>
  <text x="860" y="190" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#0f172a">{"status":400,</text>
  <text x="860" y="207" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#0f172a">"message":"질문을 입력해주세요"}</text>
  <text x="860" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">FastAPI는 호출하지 않음</text>

  <text x="526" y="244" font-size="12" font-weight="bold" fill="#475569">아니오</text>
  <line x1="500" y1="216" x2="500" y2="262" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- step 2 -->
  <rect x="300" y="262" width="400" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">② FastAPI 호출 (WebClient)</text>
  <text x="500" y="307" text-anchor="middle" font-size="13" fill="#1e293b">응답 타임아웃 10초  (ai.fastapi.timeout)</text>

  <line x1="440" y1="322" x2="175" y2="384" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="500" y1="322" x2="495" y2="384" stroke="#d97706" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="560" y1="322" x2="820" y2="384" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>

  <!-- col 1 -->
  <rect x="30" y="384" width="290" height="270" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="175" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">정상 응답 (2xx)</text>
  <text x="175" y="438" text-anchor="middle" font-size="13" fill="#475569">호출 성공</text>
  <rect x="52" y="456" width="246" height="46" rx="8" fill="#fff" stroke="#16a34a"/>
  <text x="175" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">HTTP 200 OK</text>
  <text x="175" y="493" text-anchor="middle" font-size="12" fill="#475569">FastAPI 응답을 그대로 반환</text>
  <rect x="52" y="516" width="246" height="62" rx="8" fill="#fff" stroke="#16a34a"/>
  <text x="175" y="538" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#0f172a">category:</text>
  <text x="175" y="558" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#166534">"stock" | "account" | "general"</text>
  <text x="175" y="630" text-anchor="middle" font-size="12" fill="#166534">정상 흐름</text>

  <!-- col 2 -->
  <rect x="350" y="384" width="290" height="270" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="495" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">호출한 쪽 잘못 (4xx)</text>
  <text x="495" y="438" text-anchor="middle" font-size="13" fill="#475569">요청 형식 오류 등</text>
  <rect x="372" y="456" width="246" height="46" rx="8" fill="#fff" stroke="#d97706"/>
  <text x="495" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">fallback 하지 않음</text>
  <text x="495" y="493" text-anchor="middle" font-size="12" fill="#475569">대체 응답으로 가리지 않는다</text>
  <rect x="372" y="516" width="246" height="62" rx="8" fill="#fff" stroke="#d97706"/>
  <text x="495" y="537" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">FastAPI 상태코드 그대로 전달</text>
  <text x="495" y="558" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#92400e">422 → 422 · 404 → 404</text>
  <text x="495" y="630" text-anchor="middle" font-size="12" fill="#92400e">원인을 숨기지 않고 알림</text>

  <!-- col 3 -->
  <rect x="670" y="384" width="300" height="270" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="820" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">서버 쪽 문제 → FALLBACK</text>
  <g font-size="12.5" text-anchor="middle" fill="#7f1d1d">
    <rect x="690" y="426" width="260" height="26" rx="13" fill="#fff" stroke="#dc2626"/><text x="820" y="444">FastAPI 5xx</text>
    <rect x="690" y="458" width="260" height="26" rx="13" fill="#fff" stroke="#dc2626"/><text x="820" y="476">타임아웃 (10초 초과)</text>
    <rect x="690" y="490" width="260" height="26" rx="13" fill="#fff" stroke="#dc2626"/><text x="820" y="508">연결 거부 (FastAPI 중지)</text>
  </g>
  <text x="820" y="534" text-anchor="middle" font-size="12" fill="#1e293b">log.warn  예외 타입 · 메시지 · question</text>
  <rect x="690" y="546" width="260" height="102" rx="8" fill="#fff" stroke="#dc2626"/>
  <text x="820" y="566" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">HTTP 200 + 기본 응답</text>
  <text x="820" y="584" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#0f172a">category: "FALLBACK"</text>
  <text x="820" y="602" text-anchor="middle" font-size="11.5" fill="#0f172a">answer: 현재 AI 서비스가</text>
  <text x="820" y="618" text-anchor="middle" font-size="11.5" fill="#0f172a">원활하지 않습니다… (고정 문구)</text>
  <text x="820" y="634" text-anchor="middle" font-size="11.5" fill="#0f172a">question: 요청 값 그대로</text>

  <!-- banner -->
  <rect x="30" y="680" width="940" height="64" rx="12" fill="#0f172a"/>
  <text x="500" y="707" text-anchor="middle" font-size="16" font-weight="bold" fill="#f8fafc">서버 쪽 문제(5xx · 타임아웃 · 연결 거부)만 fallback — 호출한 쪽 잘못(4xx)은 숨기지 않고 알린다</text>
  <text x="500" y="729" text-anchor="middle" font-size="13" fill="#cbd5e1">fallback은 '성공'이 아니라 '대체 응답'이므로 category로 정상 응답과 구분한다</text>
</svg>
