<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="640" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">왜 그래프로 다시 짜는가</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">흐름이 코드 속에 숨어 있으면 고치기도, 설명하기도, 디버깅하기도 어렵다</text>
<rect x="30" y="96" width="450" height="360" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="255" y="124" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">지금 구조 (Day 1~5)</text>
<rect x="48" y="140" width="414" height="196" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="62" y="164.0" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">def run_agent(question):</text>
<text x="62" y="184.5" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  question = mask(question)</text>
<text x="62" y="205.0" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  category = classify(question)</text>
<text x="62" y="225.5" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  for _ in range(MAX_TOOL_ROUNDS):</text>
<text x="62" y="246.0" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    if tool_calls: run_tools()</text>
<text x="62" y="266.5" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    if category == &#x27;KNOWLEDGE&#x27;:</text>
<text x="62" y="287.0" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">      search_documents()</text>
<text x="62" y="307.5" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">    if kill_switch(): break</text>
<text x="62" y="328.0" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  return answer</text>
<text x="60" y="366" text-anchor="start" font-size="13" fill="#0f172a">•  흐름이 if · for 안에 묻혀 한눈에 안 보인다</text>
<text x="60" y="396" text-anchor="start" font-size="13" fill="#0f172a">•  분기를 하나 추가할 때마다 if 가 늘어난다</text>
<text x="60" y="426" text-anchor="start" font-size="13" fill="#0f172a">•  단계마다 값이 어떻게 바뀌는지 찍기 어렵다</text>
<line x1="480" y1="276" x2="520" y2="276" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#p)"/>
<rect x="520" y="96" width="450" height="360" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="745" y="124" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">그래프 구조 (Day 6)</text>
<rect x="536" y="160" width="80" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="576.0" y="182.0" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">mask</text>
<rect x="650" y="160" width="100" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="700.0" y="182.0" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">classify</text>
<line x1="616" y1="177" x2="650" y2="177" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="790" y="140" width="100" height="28" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="840.0" y="159.0" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">stock</text>
<line x1="750" y1="177" x2="790" y2="154" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="790" y="178" width="100" height="28" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="840.0" y="197.0" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">exchange</text>
<line x1="750" y1="177" x2="790" y2="192" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="790" y="216" width="100" height="28" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="840.0" y="235.0" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">knowledge</text>
<line x1="750" y1="177" x2="790" y2="230" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="790" y="254" width="100" height="28" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="840.0" y="273.0" text-anchor="middle" font-size="11.5" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">general</text>
<line x1="750" y1="177" x2="790" y2="268" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="650" y="300" width="100" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="700.0" y="322.0" text-anchor="middle" font-size="12.5" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">answer</text>
<polyline points="840,288 840,316 750,317" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="545" y="364" text-anchor="start" font-size="13" fill="#0f172a">•  노드 = 하는 일 하나 (함수)</text>
<text x="545" y="390" text-anchor="start" font-size="13" fill="#0f172a">•  엣지 = 다음에 갈 곳</text>
<text x="545" y="416" text-anchor="start" font-size="13" fill="#0f172a">•  State = 모두가 읽고 쓰는 공유 데이터</text>
<text x="545" y="444" text-anchor="start" font-size="12.5" fill="#166534" font-weight="bold">흐름이 데이터(노드·엣지)로 드러난다</text>
<rect x="30" y="478" width="940" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="500" y="502" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="bold">같은 기능을 다시 짜는 것이다 — 달라지는 것은 &#x27;흐름을 바깥에 꺼내 놓는다&#x27;는 점</text>
<text x="500" y="524" text-anchor="middle" font-size="12.5" fill="#475569">그래서 분기 · 순환 · 중단 조건을 그림처럼 읽고 바꿀 수 있다</text>
<rect x="30" y="556" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="583" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">체인은 한 방향으로 흐르고, 그래프는 분기하고 되돌아갈 수 있다</text>
<text x="500.0" y="606" text-anchor="middle" font-size="12" fill="#fbbf24">되돌아갈 수 있어야 &#x27;계획 → 실행 → 점검 → 다시 계획&#x27;(자율형)을 만들 수 있다</text>
</svg>
