<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="780" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">오늘의 그래프 — RAG · 안전장치 통합</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">미션 3 — mask_node → classify_node → (분기) → answer_node</text>
<rect x="30" y="170" width="80" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="70.0" y="195.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">START</text>
<line x1="110" y1="190" x2="140" y2="190" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="140" y="170" width="120" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="200.0" y="195.0" text-anchor="middle" font-size="12.5" fill="#991b1b" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">mask_node</text>
<line x1="260" y1="190" x2="290" y2="190" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="290" y="170" width="130" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="355.0" y="195.0" text-anchor="middle" font-size="12.5" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">classify_node</text>
<rect x="490" y="110" width="170" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="575.0" y="134.0" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">stock_tool_node</text>
<line x1="420" y1="190" x2="490" y2="129" stroke="#d97706" stroke-width="2.2" marker-end="url(#o)"/>
<line x1="660" y1="129" x2="730" y2="190" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="490" y="160" width="170" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="575.0" y="184.0" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">exchange_tool_node</text>
<line x1="420" y1="190" x2="490" y2="179" stroke="#d97706" stroke-width="2.2" marker-end="url(#o)"/>
<line x1="660" y1="179" x2="730" y2="190" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="490" y="210" width="170" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="575.0" y="234.0" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">knowledge_node</text>
<line x1="420" y1="190" x2="490" y2="229" stroke="#d97706" stroke-width="2.2" marker-end="url(#o)"/>
<line x1="660" y1="229" x2="730" y2="190" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="490" y="260" width="170" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="575.0" y="284.0" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">general_node</text>
<line x1="420" y1="190" x2="490" y2="279" stroke="#d97706" stroke-width="2.2" marker-end="url(#o)"/>
<line x1="660" y1="279" x2="730" y2="190" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="730" y="170" width="130" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="795.0" y="195.0" text-anchor="middle" font-size="12.5" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">answer_node</text>
<line x1="860" y1="190" x2="890" y2="190" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="890" y="170" width="80" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="930.0" y="195.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">END</text>
<text x="575" y="100" text-anchor="middle" font-size="11.5" fill="#92400e" font-weight="bold">조건부 엣지 (category)</text>
<rect x="490" y="326" width="170" height="32" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="575" y="347" text-anchor="middle" font-size="11.5" fill="#5b21b6">Day 5 의 RAG 로직</text>
<rect x="140" y="228" width="120" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="200" y="248" text-anchor="middle" font-size="11.5" fill="#991b1b">Day 5 의</text>
<text x="200" y="267" text-anchor="middle" font-size="11.5" fill="#991b1b" font-weight="bold">PII 마스킹</text>
<rect x="30" y="392" width="940" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
<text x="500" y="420" text-anchor="middle" font-size="14.5" fill="#92400e" font-weight="bold">Kill Switch — 그래프 전체 실행 횟수를 센다</text>
<rect x="48" y="436" width="285" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="190" y="456" text-anchor="middle" font-size="12.5" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">State.steps</text>
<text x="190" y="474" text-anchor="middle" font-size="11.5" fill="#475569">노드가 실행될 때마다 +1</text>
<rect x="353" y="436" width="285" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="495" y="456" text-anchor="middle" font-size="12.5" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">GRAPH_MAX_STEPS</text>
<text x="495" y="474" text-anchor="middle" font-size="11.5" fill="#475569">넘으면 곧바로 END (안내 문구)</text>
<rect x="658" y="436" width="285" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="800" y="456" text-anchor="middle" font-size="12.5" fill="#92400e" font-weight="bold">Day 5 의 시간 · 반복 상한</text>
<text x="800" y="474" text-anchor="middle" font-size="11.5" fill="#475569">같은 판정 로직을 재사용</text>
<rect x="30" y="516" width="456" height="118" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="258" y="544" text-anchor="middle" font-size="14.5" fill="#075985" font-weight="bold">verbose 모드</text>
<text x="258" y="570" text-anchor="middle" font-size="12" fill="#0f172a">노드마다 입력 State · 돌려준 값을 로그로</text>
<text x="258" y="592" text-anchor="middle" font-size="12" fill="#0f172a">PII 는 이미 마스킹된 값만 찍힌다</text>
<text x="258" y="614" text-anchor="middle" font-size="12" fill="#075985" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">GRAPH_VERBOSE=true</text>
<rect x="514" y="516" width="456" height="118" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="742" y="544" text-anchor="middle" font-size="14.5" fill="#166534" font-weight="bold">그래프 시각화</text>
<text x="742" y="570" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">graph.get_graph().draw_mermaid_png()</text>
<text x="742" y="592" text-anchor="middle" font-size="12" fill="#0f172a">네트워크가 막히면 draw_mermaid() 텍스트로</text>
<text x="742" y="614" text-anchor="middle" font-size="12" fill="#0f172a">mermaid 글자를 붙여 넣어 그림으로 본다</text>
<rect x="30" y="664" width="940" height="66" rx="12" fill="#0f172a"/><text x="500.0" y="691" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">안전장치(마스킹 · 상한)는 그래프의 맨 앞 노드와 조건으로 들어간다</text>
<text x="500.0" y="714" text-anchor="middle" font-size="12" fill="#fbbf24">LangGraph 자체의 recursion_limit 은 최후의 보루일 뿐, 우리 상한이 먼저 걸리게 한다</text>
</svg>
