<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'Malgun Gothic','NanumGothic','Nanum Gothic','Noto Sans KR',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect width="1000" height="720" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">State · Node · Edge</text>
<text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">LangGraph 의 세 가지 재료</text>
<rect x="30" y="96" width="300" height="300" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="180" y="126" text-anchor="middle" font-size="18" fill="#075985" font-weight="bold">State</text>
<text x="180" y="152" text-anchor="middle" font-size="12" fill="#0f172a">그래프 전체가 공유하는 데이터 바구니</text>
<rect x="46" y="172" width="268" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="58" y="198" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">class GraphState(TypedDict):</text>
<text x="58" y="228" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  question: str</text>
<text x="58" y="258" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  category: str</text>
<text x="58" y="288" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  tool_result: str</text>
<text x="58" y="318" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  answer: str</text>
<rect x="350" y="96" width="300" height="300" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="500" y="126" text-anchor="middle" font-size="18" fill="#5b21b6" font-weight="bold">Node</text>
<text x="500" y="152" text-anchor="middle" font-size="12" fill="#0f172a">State 를 받아 일하고, 바뀐 키만 돌려주는 함수</text>
<rect x="366" y="172" width="268" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="378" y="198" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">def classify_node(state):</text>
<text x="378" y="228" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  q = state[&#x27;question&#x27;]</text>
<text x="378" y="258" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  return {&#x27;category&#x27;:</text>
<text x="378" y="288" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">          &#x27;STOCK&#x27;}</text>
<rect x="670" y="96" width="300" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="820" y="126" text-anchor="middle" font-size="18" fill="#166534" font-weight="bold">Edge</text>
<text x="820" y="152" text-anchor="middle" font-size="12" fill="#0f172a">어느 노드 다음에 어느 노드로 갈지 정한 연결</text>
<rect x="686" y="172" width="268" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="698" y="198" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">add_edge(&#x27;A&#x27;, &#x27;B&#x27;)</text>
<text x="698" y="228" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  → A 다음에는 항상 B</text>
<text x="698" y="258" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">add_conditional_edges(</text>
<text x="698" y="288" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  &#x27;A&#x27;, 고르는_함수, 매핑)</text>
<text x="698" y="318" text-anchor="start" font-size="12" fill="#0f172a" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">  → State 값에 따라 B 또는 C</text>
<text x="30" y="436" text-anchor="start" font-size="15" fill="#0f172a" font-weight="bold">예) 질문 하나가 그래프를 지나가는 모습</text>
<rect x="30" y="452" width="940" height="138" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<rect x="60" y="490" width="80" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="100.0" y="515.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">START</text>
<line x1="140" y1="510" x2="180" y2="510" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="180" y="490" width="130" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="245.0" y="515.0" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">classify_node</text>
<line x1="310" y1="510" x2="380" y2="478" stroke="#d97706" stroke-width="2.2" marker-end="url(#o)"/>
<line x1="310" y1="510" x2="380" y2="542" stroke="#d97706" stroke-width="2.2" marker-end="url(#o)"/>
<rect x="380" y="462" width="130" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="445.0" y="483.0" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">stock_tool_node</text>
<rect x="380" y="526" width="130" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="445.0" y="547.0" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">general_node</text>
<text x="345" y="474" text-anchor="end" font-size="11.5" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">STOCK</text>
<text x="345" y="552" text-anchor="end" font-size="11.5" fill="#92400e" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">GENERAL</text>
<line x1="510" y1="478" x2="580" y2="510" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="510" y1="542" x2="580" y2="510" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="580" y="490" width="130" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="645.0" y="515.0" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">answer_node</text>
<line x1="710" y1="510" x2="750" y2="510" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="750" y="490" width="80" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="790.0" y="515.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono','NanumGothicCoding',monospace">END</text>
<text x="500" y="578" text-anchor="middle" font-size="12.5" fill="#92400e" font-weight="bold">주황 화살표 = 조건부 엣지 — State.category 값으로 갈 곳을 고른다</text>
<rect x="30" y="616" width="940" height="50" rx="12" fill="#0f172a"/><text x="500.0" y="646.0" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">노드는 State 를 읽고 &#x27;바뀐 부분만&#x27; 돌려준다 — 합치는 것은 LangGraph 가 한다</text>
</svg>
