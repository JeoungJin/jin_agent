<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="900" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">RAG 전체 흐름 : 문서를 찾아와서 그 근거로 답한다</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">LLM이 외운 것이 아니라, 우리 문서에서 찾아온 내용으로 답하게 만든다</text>
<rect x="20" y="92" width="1080" height="196" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<rect x="20" y="92" width="1080" height="36" rx="10" fill="#0284c7"/><rect x="20" y="116" width="1080" height="12" fill="#0284c7"/><text x="560.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">① 준비 단계 (오프라인, 한 번만 실행) : 문서를 검색할 수 있는 형태로 만들어 둔다</text>
<rect x="40" y="140" width="230" height="86" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="155.0" y="164" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="bold">ⓐ  문서 읽기</text>
<text x="155.0" y="190" text-anchor="middle" font-size="12" fill="#0f172a">txt · pdf 파일</text>
<text x="155.0" y="212" text-anchor="middle" font-size="12" fill="#475569">data/docs</text>
<line x1="270" y1="183" x2="310" y2="183" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="310" y="140" width="230" height="86" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="425.0" y="164" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="bold">ⓑ  청킹</text>
<text x="425.0" y="190" text-anchor="middle" font-size="12" fill="#0f172a">500자 단위로 자른다</text>
<text x="425.0" y="212" text-anchor="middle" font-size="12" fill="#475569">50자씩 겹치게</text>
<line x1="540" y1="183" x2="580" y2="183" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="580" y="140" width="230" height="86" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="695.0" y="164" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="bold">ⓒ  임베딩</text>
<text x="695.0" y="190" text-anchor="middle" font-size="12" fill="#0f172a">문장 → 숫자 벡터</text>
<text x="695.0" y="212" text-anchor="middle" font-size="12" fill="#475569">text-embedding-3-small</text>
<line x1="810" y1="183" x2="850" y2="183" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="850" y="140" width="230" height="86" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="965.0" y="164" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="bold">ⓓ  FAISS 저장</text>
<text x="965.0" y="190" text-anchor="middle" font-size="12" fill="#0f172a">index.faiss (벡터)</text>
<text x="965.0" y="212" text-anchor="middle" font-size="12" fill="#475569">chunks.json (원문·출처)</text>
<text x="560" y="254" text-anchor="middle" font-size="12" fill="#075985">문서가 바뀌면 다시 실행 · 임베딩 모델을 바꾸면 인덱스도 다시 만든다 (질문과 문서는 같은 모델로 벡터화해야 비교할 수 있다)</text>
<rect x="20" y="308" width="1080" height="400" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="20" y="308" width="1080" height="36" rx="10" fill="#16a34a"/><rect x="20" y="332" width="1080" height="12" fill="#16a34a"/><text x="560.0" y="333" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">② 질문 단계 (온라인) : 사용자가 질문할 때마다 실행</text>
<rect x="40" y="362" width="230" height="96" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="155.0" y="386" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="bold">①  React 질문</text>
<text x="155.0" y="412" text-anchor="middle" font-size="12" fill="#0f172a">"JIN 스마트 신용대출</text>
<text x="155.0" y="434" text-anchor="middle" font-size="12" fill="#475569">수수료율은?"</text>
<line x1="270" y1="410" x2="310" y2="410" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="310" y="362" width="230" height="96" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="425.0" y="386" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">②  Spring</text>
<text x="425.0" y="412" text-anchor="middle" font-size="12" fill="#0f172a">JWT 확인 · 대화 기록 붙임</text>
<text x="425.0" y="434" text-anchor="middle" font-size="12" fill="#475569">FastAPI 로 전달</text>
<line x1="540" y1="410" x2="580" y2="410" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="580" y="362" width="230" height="96" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="695.0" y="386" text-anchor="middle" font-size="14" fill="#7c3aed" font-weight="bold">③  FastAPI + LLM</text>
<text x="695.0" y="412" text-anchor="middle" font-size="12" fill="#0f172a">Function Calling :</text>
<text x="695.0" y="434" text-anchor="middle" font-size="12" fill="#475569">search_documents 선택</text>
<line x1="810" y1="410" x2="850" y2="410" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="850" y="362" width="230" height="96" rx="10" fill="#fff" stroke="#ca8a04" stroke-width="2"/>
<text x="965.0" y="386" text-anchor="middle" font-size="14" fill="#ca8a04" font-weight="bold">④  검색</text>
<text x="965.0" y="412" text-anchor="middle" font-size="12" fill="#0f172a">질문 임베딩 → FAISS</text>
<text x="965.0" y="434" text-anchor="middle" font-size="12" fill="#475569">가장 가까운 청크 top-3</text>
<line x1="965" y1="458" x2="965" y2="512" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="850" y="514" width="230" height="96" rx="10" fill="#fff" stroke="#ca8a04" stroke-width="2"/>
<text x="965.0" y="538" text-anchor="middle" font-size="14" fill="#ca8a04" font-weight="bold">⑤  임계값 필터</text>
<text x="965.0" y="564" text-anchor="middle" font-size="12" fill="#0f172a">점수 낮은 청크 제거</text>
<text x="965.0" y="586" text-anchor="middle" font-size="12" fill="#475569">번호 붙은 [문서] 블록</text>
<line x1="850" y1="562" x2="810" y2="562" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="580" y="514" width="230" height="96" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="695.0" y="538" text-anchor="middle" font-size="14" fill="#7c3aed" font-weight="bold">⑥  LLM 답변</text>
<text x="695.0" y="564" text-anchor="middle" font-size="12" fill="#0f172a">문서 내용만 근거로</text>
<text x="695.0" y="586" text-anchor="middle" font-size="12" fill="#475569">근거 뒤에 [1] 표기</text>
<line x1="580" y1="562" x2="540" y2="562" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="310" y="514" width="230" height="96" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="425.0" y="538" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">⑦  응답 만들기</text>
<text x="425.0" y="564" text-anchor="middle" font-size="12" fill="#0f172a">answer + sources</text>
<text x="425.0" y="586" text-anchor="middle" font-size="12" fill="#475569">(원문 · 출처 · 점수)</text>
<line x1="310" y1="562" x2="270" y2="562" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="40" y="514" width="230" height="96" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="155.0" y="538" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="bold">⑧  React 표시</text>
<text x="155.0" y="564" text-anchor="middle" font-size="12" fill="#0f172a">답변 + "출처 N건"</text>
<text x="155.0" y="586" text-anchor="middle" font-size="12" fill="#475569">펼치면 약관 원문</text>
<line x1="965" y1="226" x2="965" y2="362" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="955" y="338" text-anchor="end" font-size="11" fill="#075985" font-weight="bold">ⓓ 에서 만든 인덱스를 불러와 검색</text>
<rect x="40" y="630" width="1040" height="60" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="560" y="654" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">문서와 관계없는 질문이면 : ③ 도구를 부르지 않거나, ⑤ 에서 점수가 낮아 걸러진다 → "제공된 문서에서 확인할 수 없습니다"</text>
<text x="560" y="676" text-anchor="middle" font-size="12" fill="#475569">일반 금융 용어(PER 등)나 시세 · 잔액 질문은 문서 검색 없이 기존 방식(Few-shot, 도구)으로 처리한다</text>
<rect x="20" y="724" width="1080" height="156" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<rect x="20" y="724" width="1080" height="34" rx="10" fill="#ca8a04"/><rect x="20" y="746" width="1080" height="12" fill="#ca8a04"/><text x="560.0" y="747" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">RAG 가 환각을 줄이는 이유</text>
<rect x="40" y="774" width="500" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="290" y="796" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">RAG 없이</text>
<text x="290" y="820" text-anchor="middle" font-size="12" fill="#0f172a">LLM 이 학습한 일반 지식으로 답한다</text>
<text x="290" y="842" text-anchor="middle" font-size="12" fill="#7f1d1d">→ 우리 문서에 없는 값을 그럴듯하게 지어낸다 (1.2% ✗)</text>
<rect x="580" y="774" width="500" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="796" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">RAG 있음</text>
<text x="830" y="820" text-anchor="middle" font-size="12" fill="#0f172a">문서에서 찾아온 청크를 근거로 답한다</text>
<text x="830" y="842" text-anchor="middle" font-size="12" fill="#14532d">→ 문서의 값(0.7%)과 출처가 나오고, 없으면 모른다고 한다</text>
</svg>
