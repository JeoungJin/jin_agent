<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" font-family="'Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1120" height="860" fill="#f8fafc"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Few-shot 의 부작용과 대응</text>
<text x="560" y="68" text-anchor="middle" font-size="14" fill="#64748b">예시를 넣으면 형식이 좋아지지만, 범위 · 숫자 · 표시 방식 · 비용을 함께 관리해야 한다</text>
<rect x="20" y="92" width="520" height="230" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="20" y="92" width="520" height="36" rx="10" fill="#dc2626"/><rect x="20" y="116" width="520" height="12" fill="#dc2626"/><text x="280.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">① 모든 답변이 같은 형식이 된다</text>
<rect x="40" y="140" width="480" height="30" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="50" y="159.0" text-anchor="start" font-size="12" fill="#0f172a">질문 "삼성전자 주가는?"</text>
<rect x="40" y="176" width="480" height="30" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="50" y="195.0" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">답변 "정의: 주가는 … 계산 예시: …" ✗</text>
<line x1="280" y1="208" x2="280" y2="226" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="40" y="230" width="480" height="80" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="54" y="252" text-anchor="start" font-size="13" fill="#166534" font-weight="bold">✔ 대응 : 적용 범위를 문장으로 명시</text>
<text x="54" y="276" text-anchor="start" font-size="11" fill="#0f172a">"금융 용어·개념 질문에만 이 형식. 시세·환율·잔액·인사에는 쓰지 않는다"</text>
<rect x="580" y="92" width="520" height="230" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<rect x="580" y="92" width="520" height="36" rx="10" fill="#ca8a04"/><rect x="580" y="116" width="520" height="12" fill="#ca8a04"/><text x="840.0" y="117" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">② 예시의 숫자를 실제 값으로 착각한다</text>
<rect x="600" y="140" width="480" height="30" rx="10" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="610" y="159.0" text-anchor="start" font-size="12" fill="#0f172a">질문 "삼성전자 PER은?"</text>
<rect x="600" y="176" width="480" height="30" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="610" y="195.0" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">답변 "PER은 10입니다" (예시 숫자) ✗</text>
<line x1="840" y1="208" x2="840" y2="226" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="600" y="230" width="480" height="80" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="614" y="252" text-anchor="start" font-size="13" fill="#166534" font-weight="bold">✔ 대응 : 예시는 가상, 실제 수치는 도구</text>
<text x="614" y="276" text-anchor="start" font-size="11" fill="#0f172a">"예시의 숫자는 가상이다. 특정 종목의 수치는 반드시 도구로 조회한다"</text>
<rect x="20" y="336" width="520" height="230" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<rect x="20" y="336" width="520" height="36" rx="10" fill="#7c3aed"/><rect x="20" y="360" width="520" height="12" fill="#7c3aed"/><text x="280.0" y="361" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">③ 화면에 마크다운 기호가 그대로 보인다</text>
<rect x="40" y="384" width="480" height="30" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="50" y="403.0" text-anchor="start" font-size="12" fill="#0f172a">화면 "**PER**은 … - 정의 - 계산" ✗</text>
<rect x="40" y="420" width="480" height="30" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="50" y="439.0" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">(우리 React 는 마크다운을 렌더링하지 않음)</text>
<line x1="280" y1="452" x2="280" y2="470" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="40" y="474" width="480" height="80" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="54" y="496" text-anchor="start" font-size="13" fill="#166534" font-weight="bold">✔ 대응 : 출력 형식을 평문으로 지정</text>
<text x="54" y="520" text-anchor="start" font-size="11" fill="#0f172a">"마크다운 기호(**, #, - 목록)를 쓰지 않고 평문 한 단락으로 답한다"</text>
<rect x="580" y="336" width="520" height="230" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<rect x="580" y="336" width="520" height="36" rx="10" fill="#0284c7"/><rect x="580" y="360" width="520" height="12" fill="#0284c7"/><text x="840.0" y="361" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">④ 모든 요청에 붙어 토큰 · 비용이 늘어난다</text>
<rect x="600" y="384" width="480" height="30" rx="10" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
<text x="610" y="403.0" text-anchor="start" font-size="12" fill="#0f172a">예시 3개 × 모든 요청 × 대화 길이</text>
<rect x="600" y="420" width="480" height="30" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="610" y="439.0" text-anchor="start" font-size="12" fill="#991b1b" font-weight="bold">응답 지연과 비용 증가 ✗</text>
<line x1="840" y1="452" x2="840" y2="470" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="600" y="474" width="480" height="80" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="614" y="496" text-anchor="start" font-size="13" fill="#166534" font-weight="bold">✔ 대응 : 예시를 짧고 적게 (2~3개)</text>
<text x="614" y="520" text-anchor="start" font-size="11" fill="#0f172a">예시는 핵심 형식만 보여주고, 길어지면 개수를 늘리기보다 규칙 문장을 다듬는다</text>
<rect x="20" y="592" width="540" height="250" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="20" y="592" width="540" height="36" rx="10" fill="#16a34a"/><rect x="20" y="616" width="540" height="12" fill="#16a34a"/><text x="290.0" y="617" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">고친 뒤에는 확인표로 전 / 후 비교</text>
<text x="40" y="656" text-anchor="start" font-size="12" fill="#0f172a" font-weight="bold">"PBR이 뭐야?"</text>
<text x="248" y="656" text-anchor="start" font-size="11" fill="#166534">→ 정의 → 계산 예시 → 주의사항, 한 단락</text>
<text x="40" y="686" text-anchor="start" font-size="12" fill="#0f172a" font-weight="bold">"삼성전자 주가 알려줘"</text>
<text x="248" y="686" text-anchor="start" font-size="11" fill="#166534">→ 형식 없이 도구로 조회한 문장</text>
<text x="40" y="716" text-anchor="start" font-size="12" fill="#0f172a" font-weight="bold">"삼성전자 PER은?"</text>
<text x="248" y="716" text-anchor="start" font-size="11" fill="#166534">→ 예시 숫자(10)가 아닌 get_per 결과</text>
<text x="40" y="746" text-anchor="start" font-size="12" fill="#0f172a" font-weight="bold">"내 잔액 알려줘"</text>
<text x="248" y="746" text-anchor="start" font-size="11" fill="#166534">→ 도구 결과만 간단히</text>
<text x="40" y="776" text-anchor="start" font-size="12" fill="#0f172a" font-weight="bold">"삼성전자 사도 돼?"</text>
<text x="248" y="776" text-anchor="start" font-size="11" fill="#166534">→ 투자 권유 없이 판단 근거만</text>
<text x="40" y="806" text-anchor="start" font-size="12" fill="#0f172a" font-weight="bold">"PER이 뭐야?" → "그럼 ROE는?"</text>
<text x="248" y="806" text-anchor="start" font-size="11" fill="#166534">→ 같은 형식으로 이어서 설명</text>
<rect x="580" y="592" width="520" height="250" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<rect x="580" y="592" width="520" height="36" rx="10" fill="#ca8a04"/><rect x="580" y="616" width="520" height="12" fill="#ca8a04"/><text x="840.0" y="617" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">프롬프트는 "보장"이 아니라 "유도"</text>
<rect x="600" y="642" width="230" height="70" rx="8" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
<text x="715" y="664" text-anchor="middle" font-size="13" fill="#075985" font-weight="bold">코드</text>
<text x="715" y="686" text-anchor="middle" font-size="11" fill="#0f172a">항상 같은 결과 (결정적)</text>
<text x="715" y="702" text-anchor="middle" font-size="11" fill="#475569">예: 1+1 은 항상 2</text>
<rect x="850" y="642" width="230" height="70" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="965" y="664" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">LLM</text>
<text x="965" y="686" text-anchor="middle" font-size="11" fill="#0f172a">매번 조금씩 다름 (확률적)</text>
<text x="965" y="702" text-anchor="middle" font-size="11" fill="#475569">형식을 100% 지키진 않는다</text>
<text x="600" y="740" text-anchor="start" font-size="12" fill="#422006">• 사람이 읽는 답변 → 프롬프트(Few-shot)로 유도</text>
<text x="600" y="768" text-anchor="start" font-size="12" fill="#422006">• 프로그램이 읽어야 하는 데이터 → Function Calling · JSON 같은 구조화 출력</text>
<text x="600" y="796" text-anchor="start" font-size="12" fill="#422006" font-weight="bold">• 바꿀 때마다 확인표를 돌린다 (평가 세트 → Day7 로 이어짐)</text>
</svg>
