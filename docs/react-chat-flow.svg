<text x="591" y="382" text-anchor="middle" font-size="12" fill="#9a3412">answer 한 번에 추가</text>
<polyline points="690,262 702,262 702,452 692,452" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#a)"/>
<text x="560" y="300" text-anchor="start" font-size="12" fill="#7c3aed" font-weight="bold">ON ↘ 아래 ②로</text>
<rect x="40" y="438" width="650" height="152" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="56" y="460" text-anchor="start" font-size="14" fill="#166534" font-weight="bold">② 스트리밍 요청 (SSE)</text>
