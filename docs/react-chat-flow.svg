<text x="764" y="350" text-anchor="middle" font-size="11" fill="#c2410c">쿠키 자동</text>
<text x="764" y="364" text-anchor="middle" font-size="11" fill="#c2410c">첨부</text>
<line x1="690" y1="516" x2="838" y2="516" stroke="#16a34a" stroke-width="2.2" marker-end="url(#a)"/>
<text x="764" y="500" text-anchor="middle" font-size="11" fill="#166534">쿠키 +</text>
<text x="764" y="514" text-anchor="middle" font-size="11" fill="#166534">credentials</text>
<line x1="838" y1="420" x2="692" y2="420" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="764" y="436" text-anchor="middle" font-size="11" fill="#c2410c">JSON 응답</text>
<line x1="838" y1="566" x2="692" y2="566" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="764" y="582" text-anchor="middle" font-size="11" fill="#166534">event: token ...</text>
<text x="560" y="740" text-anchor="middle" font-size="13" fill="#475569">※ 프록시를 쓰지 않으므로 브라우저는 5173 → 8000 으로 직접(교차 출처) 호출한다. localhost 로 통일해야 쿠키가 전송된다.</text>
<text x="560" y="762" text-anchor="middle" font-size="13" fill="#475569">※ axios 는 withCredentials: true , fetch 는 credentials: "include" — 둘 중 하나라도 빠지면 모든 요청이 401</text>
