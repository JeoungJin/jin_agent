<text x="126" y="492" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">fetch (직접 호출)</text>
<text x="126" y="510" text-anchor="middle" font-size="10" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">credentials:"include"</text>
<text x="126" y="526" text-anchor="middle" font-size="10" fill="#475569">Accept: text/event-stream</text>
<line x1="196" y1="504" x2="222" y2="504" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="226" y="472" width="140" height="64" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="296" y="492" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">getReader()</text>
<text x="296" y="510" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">TextDecoder</text>
<text x="296" y="526" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">{ stream: true }</text>
<line x1="366" y1="504" x2="392" y2="504" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="396" y="472" width="120" height="64" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="456" y="492" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">parseSse()</text>
<text x="456" y="510" text-anchor="middle" font-size="11" fill="#475569">순수 함수</text>
<text x="456" y="526" text-anchor="middle" font-size="10" fill="#475569">잘린 청크 → 버퍼</text>
<line x1="516" y1="504" x2="540" y2="504" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="544" y="472" width="136" height="106" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="612" y="490" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">이벤트 처리</text>
<text x="554" y="508" text-anchor="start" font-size="11" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">category</text>
<text x="612" y="508" text-anchor="start" font-size="10" fill="#475569">배지</text>
<text x="554" y="525" text-anchor="start" font-size="11" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">token</text>
<text x="612" y="525" text-anchor="start" font-size="10" fill="#475569">글자 이어붙임</text>
<text x="554" y="542" text-anchor="start" font-size="11" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">done</text>
<text x="612" y="542" text-anchor="start" font-size="10" fill="#475569">로딩 종료</text>
<text x="554" y="559" text-anchor="start" font-size="11" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">error</text>
<text x="612" y="559" text-anchor="start" font-size="10" fill="#475569">오류 표시</text>
<rect x="56" y="544" width="420" height="36" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1"/>
<text x="266" y="560" text-anchor="middle" font-size="12" fill="#166534">fetch는 401을 인터셉터가 못 잡는다 → res.status 직접 확인</text>
<text x="266" y="574" text-anchor="middle" font-size="11" fill="#475569">res.ok 먼저 확인 : 401 → 로그인 화면, 400 → message 표시</text>
<rect x="40" y="602" width="650" height="86" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="56" y="624" text-anchor="start" font-size="14" fill="#854d0e" font-weight="bold">공통 규칙</text>
<text x="56" y="644" text-anchor="start" font-size="12" fill="#422006">• httpClient 401 인터셉터 → setUnauthorizedHandler(fn) → App이 로그인 화면으로 전환 (새로고침 금지)</text>
<text x="56" y="662" text-anchor="start" font-size="12" fill="#422006">• 토큰은 HttpOnly 쿠키 : JS가 읽지 못함, localStorage 금지, Authorization 헤더 직접 설정 금지</text>
<text x="56" y="680" text-anchor="start" font-size="12" fill="#422006">• user_id는 보내지 않는다 (서버가 쿠키의 JWT로 결정) · 언마운트 시 요청 취소 (signal / AbortController)</text>
<rect x="820" y="92" width="280" height="610" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="820" y="92" width="280" height="38" rx="10" fill="#16a34a"/><rect x="820" y="118" width="280" height="12" fill="#16a34a"/><text x="960.0" y="119" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Spring Boot — :8000</text>
<rect x="840" y="150" width="240" height="62" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="960" y="172" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">POST /api/auth/login</text>
<text x="960" y="190" text-anchor="middle" font-size="12" fill="#475569">→ Set-Cookie (HttpOnly)</text>
<text x="960" y="205" text-anchor="middle" font-size="10" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">POST /api/auth/logout · GET /api/ai/me</text>
<rect x="840" y="330" width="240" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="960" y="352" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">POST /api/ai/route</text>
<text x="960" y="370" text-anchor="middle" font-size="12" fill="#475569">JSON · Mono (기존)</text>
<text x="960" y="385" text-anchor="middle" font-size="10" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">→ FastAPI /api/v1/route</text>
<rect x="840" y="486" width="240" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="960" y="508" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">POST /api/ai/route-stream</text>
<text x="960" y="526" text-anchor="middle" font-size="12" fill="#475569">SSE · Flux (추가)</text>
<text x="960" y="541" text-anchor="middle" font-size="10" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">→ FastAPI /api/v1/route-stream</text>
<rect x="840" y="600" width="240" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="960" y="622" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">CORS 설정 (다음 단계)</text>
<text x="960" y="640" text-anchor="middle" font-size="11" fill="#7f1d1d">첫 실행 시 CORS 오류가 나는 것이</text>
<text x="960" y="655" text-anchor="middle" font-size="11" fill="#7f1d1d">정상 → Spring에서 수정</text>
