<text x="366" y="362" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="bold" font-family="Consolas,'DejaVu Sans Mono',monospace">AiRouteResponse</text>
<text x="366" y="380" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas,'DejaVu Sans Mono',monospace">{ question, category, answer }</text>
<text x="366" y="396" text-anchor="middle" font-size="11" fill="#475569">한 번에 도착</text>
<line x1="466" y1="374" x2="502" y2="374" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="506" y="342" width="170" height="64" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
